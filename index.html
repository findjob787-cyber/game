<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mind Arcade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #05060f;
  --bg2: #0a0d1f;
  --panel: rgba(17, 21, 46, 0.72);
  --panel2: rgba(22, 28, 60, 0.9);
  --line: rgba(140, 165, 255, 0.14);
  --line2: rgba(140, 165, 255, 0.28);
  --text: #e9ecff;
  --muted: #8a92b9;
  --dim: #5d658c;
  --cyan: #2ee6ff;
  --violet: #8b5cf6;
  --orange: #ff8a2b;
  --pink: #ff3d81;
  --gold: #ffd27a;
  --good: #34f5a5;
  --danger: #ff5c6c;
  --accent: #2ee6ff;
  --ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --hud: "Rajdhani", "Inter", sans-serif;
  --disp: "Orbitron", "Rajdhani", sans-serif;
  --radius: 18px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }

body {
  font-family: var(--ui);
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(1100px 620px at 0% -10%, rgba(139, 92, 246, 0.22), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(46, 230, 255, 0.11), transparent 60%),
    radial-gradient(1000px 640px at 50% 120%, rgba(255, 122, 26, 0.12), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 140px 80px, #cfe8ff, transparent),
    radial-gradient(1.5px 1.5px at 90px 160px, #fff, transparent),
    radial-gradient(1px 1px at 200px 210px, #ffe7c4, transparent),
    radial-gradient(1px 1px at 60px 230px, #fff, transparent),
    radial-gradient(1.5px 1.5px at 230px 40px, #d9d2ff, transparent);
  background-size: 260px 260px;
  animation: dust 160s linear infinite;
}

button { font: inherit; color: inherit; touch-action: manipulation; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ============ Layout shell ============ */

.shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }

.side {
  position: sticky; top: 0; height: 100vh; width: 248px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 6px; padding: 22px 14px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(10, 13, 32, 0.92), rgba(6, 8, 20, 0.92));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  overflow-y: auto;
}

.brandrow { display: flex; align-items: center; gap: 12px; padding: 0 8px 18px; }

.logo {
  width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 22px;
  background: linear-gradient(135deg, var(--violet), #2a7bff 55%, var(--cyan));
  box-shadow: 0 0 22px rgba(46, 230, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.brand { font-family: var(--disp); font-weight: 900; font-size: 16px; letter-spacing: 0.14em;
  background: linear-gradient(90deg, #fff, var(--cyan) 60%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand-sub { font-family: var(--hud); font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

.navlabel { font-family: var(--hud); font-weight: 700; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--dim); padding: 14px 10px 6px; }

.navbtn {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; background: none;
  font-weight: 600; font-size: 14px; color: #c3c9e8;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

.navbtn .ni { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px;
  background: color-mix(in srgb, var(--c, #8b5cf6) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c, #8b5cf6) 30%, transparent); }
.navbtn:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
.navbtn.active { background: linear-gradient(90deg, color-mix(in srgb, var(--c, #2ee6ff) 18%, transparent), transparent); border-color: color-mix(in srgb, var(--c, #2ee6ff) 35%, transparent); color: #fff; }

.side .grow { flex: 1; }

.main { flex: 1; min-width: 0; padding: 22px clamp(14px, 3vw, 36px) 60px; }

/* Mobile top bar */
.mtop { display: none; }

.topline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.hello small { display: block; font-family: var(--hud); font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cyan); font-size: 12px; }
.hello h1 { margin: 4px 0 0; font-family: var(--disp); font-weight: 800; font-size: clamp(22px, 3vw, 30px); letter-spacing: 0.03em; }
.hello h1 .nm { background: linear-gradient(90deg, #fff, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }

.search {
  margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 220px; flex: 0 1 320px;
  padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.03);
}
.search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 14px; }
.search input::placeholder { color: var(--dim); }

.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }

.stat {
  position: relative; overflow: hidden; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(24, 30, 64, 0.8), rgba(11, 14, 32, 0.85));
}
.stat::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent), transparent 70%); }
.stat small { font-family: var(--hud); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); font-size: 11px; }
.stat b { display: block; margin-top: 6px; font-family: var(--disp); font-size: 24px; font-weight: 800; }
.stat i { font-style: normal; position: absolute; right: 16px; top: 16px; font-size: 22px; z-index: 1; }

.sec { margin-bottom: 30px; scroll-margin-top: 80px; }
.sechead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sechead .si { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px;
  background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.sechead h2 { margin: 0; font-family: var(--disp); font-size: 17px; letter-spacing: 0.06em; font-weight: 800; }
.sechead p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.sechead .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }

/* Continue row */
.controw { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.ccard {
  --c: var(--cyan);
  display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; cursor: pointer; text-align: left;
  border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  background: linear-gradient(120deg, color-mix(in srgb, var(--c) 16%, rgba(14, 18, 40, 0.9)), rgba(10, 13, 30, 0.92));
  transition: transform 0.2s, box-shadow 0.2s;
}
.ccard:hover { transform: translateY(-3px); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 30%, transparent); }
.ccard .meta { flex: 1; min-width: 0; }
.ccard b { display: block; font-family: var(--disp); font-size: 14px; letter-spacing: 0.04em; }
.ccard small { color: var(--muted); font-size: 12px; }
.ccard .go { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--c); color: #0a0c1c; font-weight: 900; box-shadow: 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }

.ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; }

/* Game cards */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 14px; }

.gcard {
  --c: var(--cyan);
  position: relative; overflow: hidden; text-align: left; cursor: pointer;
  padding: 16px; border-radius: var(--radius); border: 1px solid var(--line);
  background:
    radial-gradient(120% 80% at 100% 0%, color-mix(in srgb, var(--c) 18%, transparent), transparent 60%),
    linear-gradient(180deg, rgba(24, 30, 64, 0.85), rgba(11, 14, 32, 0.9));
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: transform 0.25s cubic-bezier(.2, .8, .2, 1), border-color 0.25s, box-shadow 0.25s;
  display: flex; flex-direction: column; gap: 9px; min-height: 196px;
}
.gcard:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--c) 60%, transparent);
  box-shadow: 0 0 30px color-mix(in srgb, var(--c) 28%, transparent), 0 20px 50px rgba(0, 0, 0, 0.45); }
.gcard::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.07) 50%, transparent 65%);
  transform: translateX(-100%); transition: transform 0.7s ease; }
.gcard:hover::after { transform: translateX(100%); }

.gtop { display: flex; align-items: center; justify-content: space-between; }
.gicon {
  --c: var(--accent);
  width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 26px; flex-shrink: 0;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 45%, #1a1f48), #0f1330);
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  box-shadow: 0 0 20px color-mix(in srgb, var(--c) 32%, transparent);
}
.tier {
  font-family: var(--hud); font-weight: 700; font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px; color: var(--c);
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent);
}
.gname { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: 0.04em; }
.gdesc { color: var(--muted); font-size: 12.5px; line-height: 1.5; flex: 1; }
.bar { height: 5px; border-radius: 5px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--c), #fff); box-shadow: 0 0 10px var(--c); }
.gmeta { display: flex; justify-content: space-between; align-items: center; font-family: var(--hud); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; color: var(--muted); }
.gmeta .star { color: var(--gold); }
.badge-new { color: var(--cyan); }

.empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 16px; }

/* ============ Buttons ============ */

.btn {
  border: 0; cursor: pointer; border-radius: 12px; padding: 12px 20px;
  font-family: var(--hud); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  color: #fff; background: linear-gradient(135deg, var(--orange), var(--pink));
  box-shadow: 0 0 22px rgba(255, 90, 80, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  transition: transform 0.15s, box-shadow 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(255, 90, 80, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn:active { transform: scale(0.97); }
.btn.ghost { background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line2); box-shadow: none; }
.btn.ghost:hover { border-color: var(--cyan); box-shadow: 0 0 16px rgba(46, 230, 255, 0.22); }
.btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.btn.big { padding: 15px 26px; font-size: 16px; }
.btn.small { padding: 9px 13px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; cursor: pointer; flex-shrink: 0;
  border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.04);
  display: grid; place-items: center; font-size: 16px;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
}
.icon-btn:hover { border-color: var(--cyan); box-shadow: 0 0 14px rgba(46, 230, 255, 0.3); }
.icon-btn:active { transform: scale(0.94); }

/* ============ Hub (level select) ============ */

.hubhead {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 22px; border-radius: 22px; margin-bottom: 22px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  background: radial-gradient(90% 140% at 0% 0%, color-mix(in srgb, var(--c) 24%, transparent), transparent 60%), linear-gradient(180deg, rgba(22, 28, 60, 0.9), rgba(10, 13, 30, 0.92));
}
.hubhead .gicon { width: 74px; height: 74px; font-size: 38px; border-radius: 22px; }
.hubhead h2 { margin: 0; font-family: var(--disp); font-size: clamp(22px, 3.2vw, 30px); letter-spacing: 0.04em; }
.hubhead p { margin: 6px 0 0; color: #b9c0e2; max-width: 560px; line-height: 1.6; font-size: 14px; }
.hubhead .catname { font-family: var(--hud); font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; font-size: 12px; color: var(--c); }
.hubhead .acts { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.hubstats { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.hubstats span { font-family: var(--hud); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); }

.tierblock { margin-bottom: 16px; }
.tierlabel { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-family: var(--hud); font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; font-size: 12px; color: var(--muted); }
.tierlabel::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
.tierlabel b { color: var(--text); }
.lgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 9px; }

.lv {
  --c: var(--cyan);
  aspect-ratio: 1; border-radius: 12px; cursor: pointer; padding: 0;
  border: 1px solid var(--line2);
  background: linear-gradient(180deg, rgba(28, 35, 74, 0.9), rgba(13, 17, 38, 0.9));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font-family: var(--disp); font-weight: 800; font-size: clamp(12px, 1.6vw, 17px);
  transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
}
.lv:hover:not(.locked) { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 40%, transparent); }
.lv small { font-size: clamp(7px, 0.9vw, 10px); letter-spacing: 1px; color: #3a4166; font-family: var(--ui); }
.lv small .on { color: var(--gold); text-shadow: 0 0 6px rgba(255, 210, 122, 0.7); }
.lv.done { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, #1c234a), #0e1228); border-color: color-mix(in srgb, var(--c) 40%, transparent); }
.lv.current { border-color: var(--c); animation: glowPulse 1.6s ease-in-out infinite; }
.lv.locked { opacity: 0.3; cursor: not-allowed; font-size: clamp(11px, 1.3vw, 15px); }

/* ============ Progress page ============ */

.chartgrid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
.panel {
  position: relative; padding: 18px; border-radius: 18px; border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(22, 28, 60, 0.85), rgba(10, 13, 30, 0.9));
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  min-width: 0;
}
.panel h3 { margin: 0 0 4px; font-family: var(--disp); font-size: 14px; letter-spacing: 0.08em; }
.panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.chart { width: 100%; display: block; }
.chart text { font-family: var(--hud); font-weight: 600; fill: #8a92b9; font-size: 11px; }
.chart .axis { stroke: rgba(140, 165, 255, 0.12); }
.chart .val { fill: #e9ecff; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ptable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptable th { text-align: left; font-family: var(--hud); letter-spacing: 0.14em; text-transform: uppercase; font-size: 11px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ptable td { padding: 9px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
.ptable tr { cursor: pointer; }
.ptable tr:hover td { background: rgba(46, 230, 255, 0.04); }
.ptable .mini { display: inline-block; width: 90px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.06); vertical-align: middle; overflow: hidden; }
.ptable .mini i { display: block; height: 100%; border-radius: 6px; }
.tablewrap { overflow-x: auto; }
.selrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.selrow select { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line2); background: #10142e; font-size: 14px; }

/* ============ Play screen ============ */

.play {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
  background:
    radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    radial-gradient(800px 500px at 50% 120%, rgba(139, 92, 246, 0.14), transparent 60%),
    var(--bg);
  overscroll-behavior: none;
  padding-bottom: var(--safe-b);
}

.playbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  background: rgba(8, 10, 24, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.ptitle { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ptitle .gicon { width: 38px; height: 38px; font-size: 19px; border-radius: 11px; }
.ptitle b { display: block; font-family: var(--disp); font-size: 14px; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptitle small { font-family: var(--hud); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-size: 11.5px; }
.hud { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hchip { display: flex; flex-direction: column; align-items: center; min-width: 58px; padding: 3px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); }
.hchip small { font-family: var(--hud); font-weight: 700; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.hchip b { font-family: var(--hud); font-size: 17px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.hearts i { font-style: normal; color: #ff4d6d; text-shadow: 0 0 8px rgba(255, 77, 109, 0.7); margin: 0 1px; }
.hearts i.lost { color: #3a3f5c; text-shadow: none; }

.timebar { height: 4px; margin: 8px 14px 0; border-radius: 4px; background: rgba(255, 255, 255, 0.06); overflow: hidden; flex-shrink: 0; }
.timebar i { display: block; height: 100%; transform-origin: left; background: linear-gradient(90deg, var(--accent), #fff); box-shadow: 0 0 12px var(--accent); }
.timebar.low i { background: linear-gradient(90deg, var(--danger), #ffb3bb); box-shadow: 0 0 12px var(--danger); }
.timebar.hit { animation: flashRed 0.4s; }

.arena { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.banner { min-height: 28px; padding: 6px 14px 0; text-align: center; font-family: var(--hud); font-weight: 700; font-size: 13.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.banner.good { color: var(--good); }
.banner.bad { color: var(--danger); }
.banner.flash { animation: fadeUp 0.35s ease; }

.board {
  position: relative; flex: 1; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: 8px 12px 14px;
}
.board.shake { animation: shake 0.4s; }

.gridarea { flex: 1; min-height: 0; width: 100%; container-type: size; display: grid; place-items: center; }
.gridbox { position: relative; width: min(100cqw, 100cqh * var(--ar, 1), 760px); aspect-ratio: var(--ar, 1); container-type: inline-size; }

.grid { display: grid; width: 100%; height: 100%; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); gap: clamp(3px, 1.4cqw, 11px); }

.scene {
  flex: 1; min-height: 0; width: 100%; max-width: 1200px; display: block;
  border-radius: 16px; touch-action: none; user-select: none; -webkit-user-select: none;
  border: 1px solid var(--line2);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 16%, transparent), 0 20px 60px rgba(0, 0, 0, 0.5);
}
.scene.aim { cursor: none; }

.tile {
  position: relative; padding: 0; cursor: pointer; user-select: none; -webkit-user-select: none; min-width: 0; min-height: 0;
  border: 1px solid var(--line2); border-radius: clamp(5px, 2cqw, 15px);
  background: linear-gradient(180deg, rgba(32, 40, 82, 0.95), rgba(15, 19, 42, 0.95));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 5px 14px rgba(0, 0, 0, 0.3);
  display: grid; place-items: center; overflow: hidden;
  font-family: var(--disp); font-weight: 800; font-size: calc(34cqw / var(--cols)); color: var(--text);
  transition: transform 0.12s, background 0.2s, box-shadow 0.2s, border-color 0.2s, opacity 0.25s;
}
.tile:active { transform: scale(0.94); }
.tile.emo { font-size: calc(50cqw / var(--cols)); font-family: var(--ui); }
.tile.show { background: radial-gradient(circle at 50% 35%, #fff, var(--accent) 55%); box-shadow: 0 0 22px var(--accent); border-color: transparent; color: #0a0c1c; }
.tile.good { background: linear-gradient(180deg, #34f5a5, #13a86d); box-shadow: 0 0 18px rgba(52, 245, 165, 0.55); border-color: transparent; color: #04140c; }
.tile.bad { background: linear-gradient(180deg, #ff6b7a, #b3263a); box-shadow: 0 0 18px rgba(255, 92, 108, 0.55); border-color: transparent; }
.tile.lit { background: radial-gradient(circle at 50% 38%, #fffbe0, #ffd23f 45%, #ff9d2b); box-shadow: 0 0 22px rgba(255, 210, 63, 0.7), inset 0 0 12px rgba(255, 255, 255, 0.6); border-color: transparent; }
.tile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 60%, transparent); }
.tile.done { opacity: 0.16; transform: scale(0.88); pointer-events: none; }
.tile.hidden { visibility: hidden; }
.tile.blank { background: rgba(255, 255, 255, 0.02); border-color: rgba(255, 255, 255, 0.04); box-shadow: none; cursor: default; }
.tile.swatch { border: 0; }
.tile.wrong { animation: wrong 0.35s; }
.tile .sub { position: absolute; right: 8%; bottom: 4%; font-size: 40%; opacity: 0.7; }

.controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; }
.controls .btn.small { min-width: 46px; min-height: 42px; font-size: 15px; }

/* Panels inside boards (quiz style games) */
.qbox { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.qrule { font-family: var(--hud); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-size: 13px; padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.04); text-align: center; }
.qrule.flip { color: var(--gold); border-color: rgba(255, 210, 122, 0.55); box-shadow: 0 0 16px rgba(255, 210, 122, 0.25); }
.qbig { font-family: var(--disp); font-weight: 900; font-size: clamp(30px, 9vw, 72px); letter-spacing: 0.03em; text-align: center; line-height: 1.15; text-shadow: 0 0 28px color-mix(in srgb, currentColor 60%, transparent); }
.qbig.pop { animation: pop 0.28s ease; }
.qmid { font-family: var(--disp); font-weight: 800; font-size: clamp(20px, 6vw, 38px); text-align: center; }
.choices { display: grid; grid-template-columns: repeat(var(--cc, 2), 1fr); gap: 10px; width: 100%; }
.choice { padding: 16px 8px; min-height: 58px; border-radius: 14px; cursor: pointer; border: 1px solid var(--line2);
  background: linear-gradient(180deg, rgba(32, 40, 82, 0.95), rgba(15, 19, 42, 0.95));
  font-family: var(--hud); font-weight: 700; font-size: clamp(16px, 4.6vw, 21px); letter-spacing: 0.08em; transition: transform 0.1s, border-color 0.2s; }
.choice:hover { border-color: var(--accent); }
.choice:active { transform: scale(0.95); }
.choice.good { background: linear-gradient(180deg, #34f5a5, #13a86d); color: #03140b; }
.choice.bad { background: linear-gradient(180deg, #ff6b7a, #b3263a); }

/* Echo pads */
.pad { --c: #fff; cursor: pointer; padding: 0; border-radius: clamp(10px, 4cqw, 26px); min-width: 0; min-height: 0;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 32%, #121633), color-mix(in srgb, var(--c) 12%, #0b0e22));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.4); transition: transform 0.1s, box-shadow 0.12s, background 0.12s; }
.pad.on { background: radial-gradient(circle at 50% 35%, #fff, var(--c) 60%); box-shadow: 0 0 46px var(--c), inset 0 0 22px rgba(255, 255, 255, 0.6); transform: scale(1.03); }

/* Mole holes */
.hole { position: relative; overflow: hidden; cursor: pointer; padding: 0; border: 0; border-radius: 50%; min-width: 0; min-height: 0;
  background: radial-gradient(ellipse 62% 36% at 50% 74%, #06040b 0 62%, transparent 64%), radial-gradient(circle at 50% 38%, #2e2357, #141030);
  box-shadow: inset 0 -8px 16px rgba(0, 0, 0, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.06), 0 8px 22px rgba(0, 0, 0, 0.45); }
.mole { position: absolute; left: 50%; bottom: 14%; line-height: 1; font-size: calc(48cqw / var(--cols)); transform: translate(-50%, 150%); transition: transform 0.15s cubic-bezier(.3, 1.6, .5, 1); filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.55)); }
.hole.up .mole { transform: translate(-50%, 0); }
.hole.up.bomb { box-shadow: inset 0 -8px 16px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 92, 108, 0.45); }
.hole.hit::after { content: "💥"; position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(44cqw / var(--cols)); animation: boom 0.45s forwards; }

/* Sniper windows */
.win { position: relative; overflow: hidden; cursor: crosshair; padding: 0; min-width: 0; min-height: 0; border-radius: 6px;
  border: 3px solid #3b2f55; background: linear-gradient(180deg, #0d1330, #1d2550); box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.8); }
.win::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 47%, #3b2f55 47% 53%, transparent 53%), linear-gradient(0deg, transparent 47%, #3b2f55 47% 53%, transparent 53%); opacity: 0.6; z-index: 2; pointer-events: none; }
.win .who { position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 110%); font-size: calc(46cqw / var(--cols)); line-height: 1; transition: transform 0.16s; z-index: 1; }
.win.up .who { transform: translate(-50%, 6%); }
.win .fuse { position: absolute; left: 6%; right: 6%; top: 6%; height: 7%; border-radius: 4px; background: rgba(0, 0, 0, 0.5); z-index: 3; display: none; }
.win .fuse i { display: block; height: 100%; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffd23f, #ff3d5e); transform-origin: left; }
.win.up.enemy .fuse { display: block; }
.win.lit { background: linear-gradient(180deg, #ffe7a6, #ffb34d); }
.win.hit::after { content: "💥"; position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(40cqw / var(--cols)); animation: boom 0.45s forwards; z-index: 4; }
.facade { padding: 4%; border-radius: 14px; background: linear-gradient(180deg, #2a2340, #1a1530); border: 1px solid var(--line2); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }

/* Memory cards */
.card { position: relative; perspective: 900px; background: none; border: 0; padding: 0; cursor: pointer; min-width: 0; min-height: 0; }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.2, .8, .2, 1); }
.card.flipped .inner { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; border-radius: clamp(5px, 1.8cqw, 13px); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.card .back { border: 1px solid var(--line2);
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent) 35%, transparent) 0 12%, transparent 13%), repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.045) 0 6px, transparent 6px 12px), linear-gradient(135deg, #2a1f5c, #12163a);
  box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35); }
.card .front { transform: rotateY(180deg); font-size: calc(46cqw / var(--cols)); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); background: linear-gradient(180deg, #1f2756, #10142e); }
.card.matched .front { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 70%, transparent); animation: pop 0.4s; }
.card.trap .front { border-color: var(--danger); background: linear-gradient(180deg, #4a1424, #1d0a12); }

/* Slide tiles */
.slide { position: relative; width: 100%; height: 100%; }
.stile { position: absolute; width: calc(100% / var(--cols)); height: calc(100% / var(--rows)); padding: clamp(2px, 0.7cqw, 5px); cursor: pointer; transition: left 0.14s ease, top 0.14s ease; }
.stile b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: clamp(6px, 2cqw, 14px); border: 1px solid var(--line2);
  font-family: var(--disp); font-weight: 800; font-size: calc(32cqw / var(--cols));
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 48%, #1b2350), #12173a); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 16px rgba(0, 0, 0, 0.35); }
.stile.ok b { border-color: rgba(52, 245, 165, 0.6); box-shadow: inset 0 0 0 1px rgba(52, 245, 165, 0.35), 0 0 14px rgba(52, 245, 165, 0.25); }

/* Candy */
.candy { position: absolute; width: calc(100% / var(--cols)); height: calc(100% / var(--rows)); padding: clamp(1px, 0.6cqw, 4px); transition: left 0.18s ease, top 0.22s cubic-bezier(.3, 1.3, .6, 1), transform 0.2s, opacity 0.2s; cursor: pointer; touch-action: none; }
.candy b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 28%; font-size: calc(52cqw / var(--cols)); line-height: 1;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.28), transparent 50%), color-mix(in srgb, var(--cc) 35%, #12163a);
  box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.35), 0 4px 10px rgba(0, 0, 0, 0.3); }
.candy.sel b { box-shadow: 0 0 0 3px #fff, 0 0 18px #fff; }
.candy.pop { transform: scale(0); opacity: 0; }
.candy.hint b { animation: wiggle 0.6s 2; }

/* Tubes (ball sort) */
.tubes { display: flex; flex-wrap: wrap; justify-content: center; align-content: space-evenly; align-items: flex-end; column-gap: var(--tg, 4%); row-gap: 4%; width: 100%; height: 100%; }
.tube { position: relative; width: var(--tw, 12%); aspect-ratio: 1 / 3.4; border-radius: 0 0 999px 999px; cursor: pointer; padding: calc(var(--tw, 12%) * 0.1) calc(var(--tw, 12%) * 0.1);
  border: 2px solid rgba(180, 200, 255, 0.35); border-top: 0; background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.07));
  display: flex; flex-direction: column-reverse; gap: 4%; transition: transform 0.15s, box-shadow 0.2s; }
.tube.sel { transform: translateY(-10px); box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
.tube.full { box-shadow: 0 0 18px rgba(52, 245, 165, 0.45); border-color: rgba(52, 245, 165, 0.6); }
.ball { display: block; flex-shrink: 0; width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 8%, var(--bc) 30%, color-mix(in srgb, var(--bc) 55%, #000)); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); }

/* Hanoi */
.hanoi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; width: 100%; height: 100%; align-items: end; }
.peg { position: relative; height: 100%; display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; padding-bottom: 6%; cursor: pointer; border-radius: 14px; border: 1px solid transparent; transition: border-color 0.2s, background 0.2s; }
.peg::before { content: ""; position: absolute; bottom: 0; left: 6%; right: 6%; height: 4%; border-radius: 6px; background: linear-gradient(180deg, #4a4f78, #262a48); }
.peg::after { content: ""; position: absolute; bottom: 4%; left: 50%; width: 4%; height: 80%; transform: translateX(-50%); border-radius: 6px; background: linear-gradient(90deg, #565c88, #2c3052); z-index: 0; }
.peg.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.disk { position: relative; z-index: 1; height: 9%; border-radius: 999px; margin-top: 2%; background: linear-gradient(180deg, color-mix(in srgb, var(--dc) 80%, #fff), var(--dc)); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); transition: transform 0.15s; }
.disk.lift { transform: translateY(-18px); box-shadow: 0 0 18px var(--dc); }

/* Board games */
.cell4 { position: relative; display: grid; place-items: center; cursor: pointer; }
.cell4::after { content: ""; width: 82%; aspect-ratio: 1; border-radius: 50%; background: rgba(0, 0, 0, 0.45); box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.6); }
.cell4.p1::after { background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb020 60%, #b06d00); box-shadow: 0 0 14px rgba(255, 176, 32, 0.6); }
.cell4.p2::after { background: radial-gradient(circle at 35% 30%, #ff9aa8, #ff3d5e 60%, #9a1028); box-shadow: 0 0 14px rgba(255, 61, 94, 0.6); }
.cell4.win::after { outline: 3px solid #fff; outline-offset: 2px; }
.c4board { padding: 2%; border-radius: 16px; background: linear-gradient(180deg, #2348b8, #172f80); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.2); }
.disc { width: 84%; aspect-ratio: 1; border-radius: 50%; transition: transform 0.25s; }
.disc.b { background: radial-gradient(circle at 35% 30%, #555b7a, #0b0d18 70%); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6); }
.disc.w { background: radial-gradient(circle at 35% 30%, #fff, #c9cfe6 70%); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45); }
.rv { background: linear-gradient(180deg, #13734a, #0b5535); border-color: rgba(0, 0, 0, 0.35); border-radius: 4px; }
.rv.hintmove::after { content: ""; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, 0.28); }
.ttt { font-size: calc(48cqw / var(--cols)); }
.ttt.x { color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
.ttt.o { color: var(--pink); text-shadow: 0 0 14px var(--pink); }
.ttt.winline { background: color-mix(in srgb, var(--accent) 26%, #12163a); }

/* Nim */
.nim { display: flex; flex-direction: column; gap: 14px; width: min(100%, 560px); }
.nimrow { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); min-height: 64px; flex-wrap: wrap; }
.stick { width: clamp(12px, 3.2vw, 18px); height: 46px; border-radius: 6px; cursor: pointer; border: 0; padding: 0;
  background: linear-gradient(180deg, #ffd27a, #c27a1c); box-shadow: 0 0 10px rgba(255, 210, 122, 0.35); transition: transform 0.12s, opacity 0.2s; }
.stick.mark { background: linear-gradient(180deg, #ff6b7a, #b3263a); transform: translateY(-6px); }
.stick.gone { opacity: 0; pointer-events: none; transform: translateY(-20px) scale(0.6); }

/* Dots & boxes */
.dots { position: relative; width: 100%; height: 100%; }
.dots .dot { position: absolute; width: 3.2cqw; height: 3.2cqw; min-width: 8px; min-height: 8px; border-radius: 50%; background: #dfe5ff; transform: translate(-50%, -50%); box-shadow: 0 0 8px rgba(255, 255, 255, 0.5); z-index: 3; pointer-events: none; }
.dots .edge { position: absolute; cursor: pointer; z-index: 2; display: grid; place-items: center; }
.dots .edge i { display: block; border-radius: 6px; background: rgba(255, 255, 255, 0.07); transition: background 0.15s; }
.dots .edge.h i { width: 86%; height: 26%; }
.dots .edge.v i { width: 26%; height: 86%; }
.dots .edge:hover i { background: rgba(255, 255, 255, 0.22); }
.dots .edge.p1 i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.dots .edge.p2 i { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
.dots .box { position: absolute; display: grid; place-items: center; font-family: var(--disp); font-weight: 900; font-size: 5cqw; border-radius: 6px; z-index: 1; }
.dots .box.p1 { background: color-mix(in srgb, var(--cyan) 22%, transparent); color: var(--cyan); }
.dots .box.p2 { background: color-mix(in srgb, var(--pink) 22%, transparent); color: var(--pink); }

/* Warship */
.seawrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; flex: 1; min-height: 0; }
.seas { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: 1fr; grid-template-rows: 1.5fr 1fr; gap: 12px; }
.sea { container-type: size; display: grid; place-items: center; min-height: 0; }
.sealabel { font-family: var(--hud); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-size: 12px; color: var(--muted); text-align: center; }
.seabox { width: min(100cqw, 100cqh); aspect-ratio: 1; container-type: inline-size; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 2px; padding: 2px; border-radius: 10px;
  background: linear-gradient(180deg, #0b2a52, #071a36); border: 1px solid rgba(46, 230, 255, 0.3); box-shadow: 0 0 30px rgba(46, 140, 255, 0.2); }
.sq { border-radius: 3px; background: rgba(46, 140, 255, 0.12); display: grid; place-items: center; font-size: calc(46cqw / var(--cols)); cursor: pointer; position: relative; min-width: 0; min-height: 0; }
.sq.ship { background: linear-gradient(180deg, #8a93b8, #4d557a); }
.sq.miss::after { content: ""; width: 26%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
.sq.hit { background: radial-gradient(circle, #ffd23f, #ff3d00 60%, #6b1300); box-shadow: 0 0 10px rgba(255, 120, 0, 0.7); }
.sq.sunk { background: linear-gradient(180deg, #4a1424, #24060f); }
.sq.sunk::after { content: "✕"; color: #ff6b7a; font-weight: 900; }
.seas.mini .sea:last-child .seabox { opacity: 0.95; }

/* Minesweeper */
.ms { font-family: var(--disp); font-size: calc(36cqw / var(--cols)); border-radius: clamp(3px, 1cqw, 8px); }
.ms.open { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.05); box-shadow: none; cursor: default; }
.ms.flag::after { content: "🚩"; font-size: 100%; }
.ms.boom { background: radial-gradient(circle, #ff9d2b, #b3263a); }
.n1 { color: #5aa9ff; } .n2 { color: #34f5a5; } .n3 { color: #ff6b7a; } .n4 { color: #c39bff; } .n5 { color: #ffb347; } .n6 { color: #2ee6ff; } .n7 { color: #fff; } .n8 { color: #aaa; }

/* Mastermind */
.mm { width: min(100%, 460px); display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; flex: 1; min-height: 0; }
.mmrows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
.mmrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.025); }
.mmrow.cur { border-color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.peg2 { width: clamp(30px, 8vw, 40px); height: clamp(30px, 8vw, 40px); border-radius: 50%; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); cursor: pointer; flex-shrink: 0; }
.peg2.f { background: radial-gradient(circle at 35% 30%, #fff 0 6%, var(--pc) 40%, color-mix(in srgb, var(--pc) 50%, #000)); border: 0; }
.fb { margin-left: auto; display: grid; grid-template-columns: repeat(3, 10px); gap: 3px; }
.fb i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); }
.fb i.b { background: #34f5a5; box-shadow: 0 0 6px #34f5a5; }
.fb i.w { background: #fff; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.palette button { width: clamp(38px, 10vw, 48px); height: clamp(38px, 10vw, 48px); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); cursor: pointer; }

/* Nonogram */
.nono { display: grid; gap: 2px; width: 100%; height: 100%; }
.nclue { display: flex; align-items: flex-end; justify-content: center; gap: 2px; font-family: var(--hud); font-weight: 700; color: #b9c0e2; font-size: calc(22cqw / var(--cols)); line-height: 1.05; }
.nclue.row { flex-direction: row; align-items: center; justify-content: flex-end; padding-right: 4px; gap: 5px; }
.nclue.col { flex-direction: column; padding-bottom: 3px; }
.nclue.ok { color: var(--good); }
.ncell { border-radius: 3px; background: rgba(120, 140, 230, 0.16); border: 1px solid rgba(160, 180, 255, 0.22); cursor: pointer; display: grid; place-items: center; color: #ff6b7a; font-weight: 900; font-size: calc(26cqw / var(--cols)); }
.ncell.f { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 50%, transparent); }

/* Pair link */

// ===== core.js =====
"use strict";

// =====================================================================
// Constants
// =====================================================================
const STORE_KEY = "mindArcade.v2";
const MAX_LEVEL = 100;
const TIERS = ["Rookie", "Apprentice", "Skilled", "Pro", "Expert", "Elite", "Master", "Grandmaster", "Legend", "Mythic"];
const tierOf = L => TIERS[Math.min(9, Math.floor((L - 1) / 10))];

const CATS = [
  { id: "racing", name: "Car Racing", icon: "🏎️", color: "#ff3d5e", tag: "High-speed highways, neon cities and street missions." },
  { id: "military", name: "Military Ops", icon: "🪖", color: "#9ccc65", tag: "Gunships, tanks, warships and squad missions." },
  { id: "arcade", name: "Arcade Classics", icon: "🕹️", color: "#ff8a2b", tag: "Bird hunting and sweet candy matching." },
  { id: "math", name: "Brain Math", icon: "➗", color: "#ffd23f", tag: "Numbers at full speed." }
];
const CAT_BY = Object.fromEntries(CATS.map(c => [c.id, c]));

const GAMES = [];
const GAME_BY = {};

// Shared art/assets for all games
const EMOJI_POOL = ["🚀", "🌙", "⭐", "🔥", "💎", "🍀", "🎯", "🦊", "🐙", "🍉", "⚡", "🎲", "🌈", "🦋", "🍄", "👑", "🎧", "🧊", "🍩", "🐳", "🌵", "🎈", "🪐", "🦄", "🍒", "🐼", "🎸", "🧲", "🌻", "🐝", "🍕", "🛸"];
const STAR_ART = { i: [["⭐", 34, 52, 1.5], ["⭐", 50, 44, 2], ["⭐", 66, 52, 1.5]], label: "Earn up to 3 stars" };


function addGames(cat, list) {
  for (const g of list) {
    g.cat = cat;
    g.color = g.color || CAT_BY[cat].color;
    GAMES.push(g);
    GAME_BY[g.id] = g;
  }
}

// =====================================================================
// Helpers
// =====================================================================
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const range = n => Array.from({ length: n }, (_, i) => i);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function shuffle(rng, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const pickOf = (rng, arr) => arr[Math.floor(rng() * arr.length)];
const randInt = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
const isTouch = () => matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;

function toast(text) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = el("div", "toast", text);
  t.style.setProperty("--tx", "-50%");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1900);
}

// =====================================================================
// Shared visuals: soft volumetric clouds and sky palettes
// =====================================================================
const SKY_TINTS = {
  day: { light: "255,255,255", mid: "232,238,250", shadow: "150,165,198" },
  sunset: { light: "255,238,222", mid: "246,182,170", shadow: "118,78,128" },
  night: { light: "160,172,215", mid: "86,96,146", shadow: "28,32,66" }
};

function makeCloudSprite(seed, w, h, tintName) {
  const tint = SKY_TINTS[tintName] || SKY_TINTS.day;
  const r = mulberry32(seed);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  const puffs = [];
  const n = 16 + Math.floor(r() * 10);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const bump = Math.sin(t * Math.PI);
    const rad = h * (0.12 + 0.26 * bump * (0.55 + r() * 0.55));
    puffs.push([w * (0.12 + 0.76 * t + (r() - 0.5) * 0.08), h * 0.66 - bump * h * 0.2 * r() - rad * 0.25, rad]);
  }
  for (let i = 0; i < 6; i++) puffs.push([w * (0.3 + r() * 0.4), h * (0.35 + r() * 0.15), h * (0.2 + r() * 0.12)]);
  puffs.forEach(([x, y, rad]) => {
    const gr = g.createRadialGradient(x, y + rad * 0.45, rad * 0.1, x, y + rad * 0.3, rad * 1.05);
    gr.addColorStop(0, "rgba(" + tint.shadow + ",.85)"); gr.addColorStop(1, "rgba(" + tint.shadow + ",0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y + rad * 0.3, rad * 1.05, 0, TAU); g.fill();
  });
  puffs.forEach(([x, y, rad]) => {
    const gr = g.createRadialGradient(x - rad * 0.3, y - rad * 0.4, rad * 0.05, x, y, rad);
    gr.addColorStop(0, "rgba(" + tint.light + ",1)"); gr.addColorStop(0.6, "rgba(" + tint.mid + ",.92)"); gr.addColorStop(1, "rgba(" + tint.mid + ",0)");
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, rad, 0, TAU); g.fill();
  });
  g.globalCompositeOperation = "destination-out";
  const fade = g.createLinearGradient(0, h * 0.72, 0, h);
  fade.addColorStop(0, "rgba(0,0,0,0)"); fade.addColorStop(1, "rgba(0,0,0,1)");
  g.fillStyle = fade; g.fillRect(0, 0, w, h);
  return cv;
}

// A drifting band of clouds. speed is in screen-widths per second.
function makeCloudField(seed, count, tintName, opts) {
  const r = mulberry32(seed);
  const sprites = range(4).map(i => makeCloudSprite(seed * 7 + i * 131, 420, 190, tintName));
  const items = range(count).map(() => ({
    x: r() * 1.4 - 0.2,
    y: opts.y0 + r() * (opts.y1 - opts.y0),
    s: opts.s0 + r() * (opts.s1 - opts.s0),
    v: opts.v * (0.7 + r() * 0.6),
    img: sprites[Math.floor(r() * sprites.length)],
    flip: r() < 0.5
  }));
  return {
    update(dt, extra = 0) {
      items.forEach(it => {
        it.x -= (it.v + extra * opts.parallax) * dt;
        if (it.x < -0.5) { it.x = 1.15 + r() * 0.3; it.y = opts.y0 + r() * (opts.y1 - opts.y0); }
        if (it.x > 1.6) it.x = -0.45;
      });
    },
    draw(g, W, H) {
      g.save();
      g.globalAlpha = opts.alpha;
      items.forEach(it => {
        const w = W * 0.38 * it.s, h = w * 0.45;
        const x = it.x * W, y = it.y * H;
        if (it.flip) { g.save(); g.translate(x + w, y); g.scale(-1, 1); g.drawImage(it.img, 0, 0, w, h); g.restore(); }
        else g.drawImage(it.img, x, y, w, h);
      });
      g.restore();
    }
  };
}

// Continuous engine hum whose pitch follows speed.
function engineSound(type = "sawtooth", cutoff = 900) {
  const silent = { set() {}, stop() {} };
  if (!store.settings.sound) return silent;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o1 = audio.createOscillator(), o2 = audio.createOscillator(), f = audio.createBiquadFilter(), g = audio.createGain();
    o1.type = type; o2.type = "square";
    f.type = "lowpass"; f.frequency.value = cutoff;
    g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(audio.destination);
    o1.start(); o2.start();
    let stopped = false;
    return {
      set(freq, vol) {
        if (stopped) return;
        const t = audio.currentTime;
        o1.frequency.setTargetAtTime(freq, t, 0.06);
        o2.frequency.setTargetAtTime(freq * 0.5, t, 0.06);
        g.gain.setTargetAtTime(vol, t, 0.1);
      },
      stop() {
        if (stopped) return;
        stopped = true;
        try { const t = audio.currentTime; g.gain.setTargetAtTime(0, t, 0.04); o1.stop(t + 0.25); o2.stop(t + 0.25); } catch (_) {}
      }
    };
  } catch (_) { return silent; }
}

// =====================================================================
// Storage — localStorage has no expiry
// =====================================================================
function freshStore() {
  return {
    v: 2, games: {}, history: [], recent: [],
    settings: { sound: true, vibe: true },
    profile: { name: "Commander", streak: 0, lastDay: "", playMs: 0, created: Date.now() }
  };
}

function loadStore() {
  try {
    const data = JSON.parse(localStorage.getItem(STORE_KEY));
    if (data && data.games) {
      const base = freshStore();
      return { ...base, ...data, settings: { ...base.settings, ...data.settings }, profile: { ...base.profile, ...data.profile } };
    }
  } catch (_) {}
  return freshStore();
}

let store = loadStore();

function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch (e) { console.warn("Could not save", e); }
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

function gs(id) {
  if (!store.games[id]) store.games[id] = { unlocked: 1, stars: {}, plays: 0, wins: 0, resume: null, seen: false, done: false };
  return store.games[id];
}

const dayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };

function touchStreak() {
  const p = store.profile;
  const today = dayKey();
  if (p.lastDay === today) return;
  const yesterday = dayKey(Date.now() - 86400000);
  p.streak = p.lastDay === yesterday ? p.streak + 1 : 1;
  p.lastDay = today;
  persist();
}

const cleared = s => Object.keys(s.stars).length;
const starsOf = s => Object.values(s.stars).reduce((a, b) => a + b, 0);

function totals() {
  let stars = 0, clearedN = 0, done = 0, plays = 0, wins = 0;
  for (const g of GAMES) {
    const s = gs(g.id);
    stars += starsOf(s); clearedN += cleared(s); plays += s.plays; wins += s.wins;
    if (s.done) done++;
  }
  return { stars, cleared: clearedN, done, plays, wins };
}

function fmtTime(ms) {
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + "m";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

// =====================================================================
// Sound & vibration
// =====================================================================
let audio = null;

function tone(freq, dur = 0.1, type = "sine", vol = 0.12, slide = 0, delay = 0) {
  if (!store.settings.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime + delay;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  } catch (_) {}
}

function noise(dur = 0.2, vol = 0.12, delay = 0) {
  if (!store.settings.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + delay;
    const len = Math.floor(audio.sampleRate * dur);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const src = audio.createBufferSource();
    const g = audio.createGain();
    src.buffer = buf;
    g.gain.value = vol;
    src.connect(g).connect(audio.destination);
    src.start(t);
  } catch (_) {}
}

function buzz(ms) {
  if (store.settings.vibe && navigator.vibrate) { try { navigator.vibrate(ms); } catch (_) {} }
}

const SFX = {
  click: () => tone(560, 0.06, "triangle", 0.07),
  good: () => { tone(660, 0.08, "triangle", 0.1); tone(990, 0.12, "triangle", 0.08, 0, 0.07); },
  bad: () => { tone(170, 0.28, "sawtooth", 0.07, -70); buzz(60); },
  shot: () => { noise(0.12, 0.16); tone(900, 0.08, "square", 0.03, -600); },
  hit: () => { tone(320, 0.14, "triangle", 0.12, 320); buzz(20); },
  boom: () => { noise(0.5, 0.25); tone(90, 0.4, "sine", 0.2, -50); buzz(80); },
  coin: () => { tone(880, 0.07, "square", 0.05); tone(1320, 0.12, "square", 0.05, 0, 0.06); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, "triangle", 0.11, 0, i * 0.11)),
  lose: () => { [392, 311, 233].forEach((f, i) => tone(f, 0.24, "sawtooth", 0.06, 0, i * 0.14)); buzz(120); },
  champ: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.26, "triangle", 0.12, 0, i * 0.13))
};

// =====================================================================
// SVG charts (bar + line), drawn by hand — no libraries
// =====================================================================
let chartId = 0;

function niceMax(v) {
  if (v <= 5) return 5;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

function lineChart({ w = 640, h = 240, labels, series, yLabel = "" }) {
  const id = "lc" + (++chartId);
  const pad = { l: 38, r: 14, t: 14, b: 28 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const maxV = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  const n = labels.length;
  const x = i => pad.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = v => pad.t + ih - (v / maxV) * ih;
  let out = '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img"><defs>';

  series.forEach((s, k) => {
    out += '<linearGradient id="' + id + "g" + k + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s.color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient>';
    out += '<filter id="' + id + "f" + k + '" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  });
  out += "</defs>";

  for (let i = 0; i <= 4; i++) {
    const v = (maxV / 4) * i;
    out += '<line class="axis" x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    out += '<text x="' + (pad.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + Math.round(v) + "</text>";
  }

  const step = Math.max(1, Math.ceil(n / 8));
  labels.forEach((lb, i) => {
    if ((i % step === 0 && i < n - Math.ceil(step / 2)) || i === n - 1) out += '<text x="' + x(i) + '" y="' + (h - 8) + '" text-anchor="' + (i === n - 1 ? "end" : i === 0 ? "start" : "middle") + '">' + esc(lb) + "</text>";
  });

  series.forEach((s, k) => {
    const pts = s.values.map((v, i) => [x(i), y(v)]);
    if (!pts.length) return;
    let d = "M" + pts[0][0] + "," + pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2;
      d += " C" + cx + "," + y0 + " " + cx + "," + y1 + " " + x1 + "," + y1;
    }
    const area = d + " L" + pts[pts.length - 1][0] + "," + (pad.t + ih) + " L" + pts[0][0] + "," + (pad.t + ih) + " Z";
    out += '<path d="' + area + '" fill="url(#' + id + "g" + k + ')"/>';
    out += '<path class="lineanim" style="--len:2000" d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.6" stroke-linecap="round" filter="url(#' + id + "f" + k + ')"/>';
    pts.forEach(([px, py], i) => {
      if (s.values[i] > 0 || n < 20) out += '<circle cx="' + px + '" cy="' + py + '" r="3.2" fill="#0b0f24" stroke="' + s.color + '" stroke-width="2"/>';
    });
  });

  if (yLabel) out += '<text x="' + pad.l + '" y="10">' + esc(yLabel) + "</text>";
  return out + "</svg>";
}

function barChart({ w = 640, h = 260, items, max }) {
  const id = "bc" + (++chartId);
  const pad = { l: 34, r: 10, t: 22, b: 46 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const maxV = max || niceMax(Math.max(1, ...items.map(it => it.value)));
  const n = items.length;
  const slot = iw / Math.max(1, n);
  const bw = Math.min(46, slot * 0.62);
  const y = v => pad.t + ih - (v / maxV) * ih;
  let out = '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img"><defs>';

  items.forEach((it, i) => {
    out += '<linearGradient id="' + id + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + it.color + '"/><stop offset="1" stop-color="' + it.color + '" stop-opacity=".25"/></linearGradient>';
  });
  out += "</defs>";

  const ticks = maxV % 3 === 0 && maxV % 4 !== 0 ? 3 : 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (maxV / ticks) * i;
    out += '<line class="axis" x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
    out += '<text x="' + (pad.l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + Math.round(v) + "</text>";
  }

  items.forEach((it, i) => {
    const cx = pad.l + slot * i + slot / 2;
    const top = y(it.value);
    const hh = Math.max(0, pad.t + ih - top);
    out += '<rect class="barv" style="animation-delay:' + (i * 0.05) + 's" x="' + (cx - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + Math.max(hh, 0.001) + '" rx="' + Math.min(8, bw / 3) + '" fill="url(#' + id + i + ')"/>';
    if (hh > 0) out += '<rect x="' + (cx - bw / 2) + '" y="' + top + '" width="' + bw + '" height="3" rx="1.5" fill="' + it.color + '" style="filter:drop-shadow(0 0 6px ' + it.color + ')"/>';
    out += '<text class="val" x="' + cx + '" y="' + (top - 6) + '" text-anchor="middle">' + it.value + "</text>";
    if (it.icon) out += '<text x="' + cx + '" y="' + (h - 24) + '" text-anchor="middle" style="font-size:16px">' + it.icon + "</text>";
    out += '<text x="' + cx + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(it.label) + "</text>";
  });

  return out + "</svg>";
}

function hbarChart({ w = 560, items, max }) {
  const id = "hb" + (++chartId);
  const rowH = 30, pad = { l: 132, r: 46, t: 6 };
  const h = pad.t * 2 + items.length * rowH;
  const maxV = max || niceMax(Math.max(1, ...items.map(it => it.value)));
  const iw = w - pad.l - pad.r;
  let out = '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" role="img"><defs>';
  items.forEach((it, i) => {
    out += '<linearGradient id="' + id + i + '" x1="0" x2="1"><stop offset="0" stop-color="' + it.color + '" stop-opacity=".35"/><stop offset="1" stop-color="' + it.color + '"/></linearGradient>';
  });
  out += "</defs>";
  items.forEach((it, i) => {
    const y = pad.t + i * rowH;
    const bw = Math.max(3, (it.value / maxV) * iw);
    out += '<text x="6" y="' + (y + rowH / 2 + 4) + '" style="font-size:12.5px;fill:#c3c9e8">' + (it.icon ? it.icon + "  " : "") + esc(it.label) + "</text>";
    out += '<rect x="' + pad.l + '" y="' + (y + 7) + '" width="' + iw + '" height="' + (rowH - 14) + '" rx="8" fill="rgba(255,255,255,.04)"/>';
    out += '<rect class="barh" style="animation-delay:' + (i * 0.05) + 's" x="' + pad.l + '" y="' + (y + 7) + '" width="' + bw + '" height="' + (rowH - 14) + '" rx="8" fill="url(#' + id + i + ')"/>';
    out += '<circle cx="' + (pad.l + bw) + '" cy="' + (y + rowH / 2) + '" r="4" fill="' + it.color + '" style="filter:drop-shadow(0 0 6px ' + it.color + ')"/>';
    out += '<text class="val" x="' + (pad.l + bw + 10) + '" y="' + (y + rowH / 2 + 4) + '">' + it.value + "</text>";
  });
  return out + "</svg>";
}

function donut(pct, color, size = 52, label = "") {
  const r = 22, c = 2 * Math.PI * r;
  return '<div class="ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>' +
    '<circle cx="26" cy="26" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * pct) + " " + c + '" style="filter:drop-shadow(0 0 4px ' + color + ')"/></svg><span>' + label + "</span></div>";
}

// =====================================================================
// How-to-play illustrations ("screenshots" drawn live)
// =====================================================================
const ART_CLASSES = new Set(["lit", "show", "good", "bad", "sel", "dim", "none"]);

function renderArt(art = {}) {
  const box = el("div", "art " + (art.bg || ""));

  if (art.html) {
    const h = el("div", "arthtml", art.html);
    box.appendChild(h);
  }

  let host = box;

  if (art.g) {
    const [cols, rows] = art.g;
    const g = el("div", "art-g" + (cols * rows > 20 ? " tight" : ""));
    g.style.setProperty("--cols", cols);
    g.style.setProperty("--ar", cols / rows);
    for (let i = 0; i < cols * rows; i++) {
      const cell = el("div", "ac");
      let v = art.c && art.c[i];
      if (v != null) {
        String(v).split("|").forEach(part => {
          if (ART_CLASSES.has(part)) cell.classList.add(part);
          else if (part.startsWith("#")) { cell.style.background = part; cell.style.borderColor = "transparent"; }
          else cell.textContent = part;
        });
      }
      g.appendChild(cell);
    }
    box.appendChild(g);
    host = g;

    if (typeof art.tap === "number") {
      art = { ...art, tap: [((art.tap % cols) + 0.5) / cols * 100, (Math.floor(art.tap / cols) + 0.5) / rows * 100] };
    }
  }

  (art.i || []).forEach(([emo, x, y, s = 1]) => {
    const it = el("div", "ai", emo);
    it.style.left = x + "%";
    it.style.top = y + "%";
    it.style.setProperty("--s", s);
    host.appendChild(it);
  });

  if (Array.isArray(art.tap)) {
    const f = el("div", "finger", "👆");
    f.style.left = art.tap[0] + "%";
    f.style.top = art.tap[1] + "%";
    host.appendChild(f);
  }

  if (art.swipe) {
    const [x1, y1, x2, y2] = art.swipe;
    const f = el("div", "finger swipe", "👆");
    f.style.setProperty("--x1", x1 + "%"); f.style.setProperty("--y1", y1 + "%");
    f.style.setProperty("--x2", x2 + "%"); f.style.setProperty("--y2", y2 + "%");
    host.appendChild(f);
  }

  if (art.label) box.appendChild(el("div", "artlabel", art.label));
  return box;
}

// =====================================================================
// Modal (how to play, settings)
// =====================================================================
const modal = () => $("modal");

function closeModal() {
  modal().hidden = true;
  modal().innerHTML = "";
}

function openHowTo(game, onDone) {
  const steps = (game.how || []).slice(0, 5);
  if (!steps.length) { if (onDone) onDone(); return; }
  let i = 0;
  const m = modal();
  m.hidden = false;

  const finish = () => {
    gs(game.id).seen = true;
    persist();
    closeModal();
    if (onDone) onDone();
  };

  function draw() {
    const [title, text, art] = steps[i];
    m.innerHTML = "";
    const card = el("div", "mcard");
    card.style.setProperty("--accent", game.color);
    card.innerHTML =
      '<div class="mhead"><div class="gicon" style="--c:' + game.color + '">' + game.icon + '</div><div><small>How to play</small><b>' + esc(game.name) + '</b></div><button class="icon-btn x" type="button" aria-label="Close">✕</button></div>';
    card.appendChild(renderArt(art));
    card.appendChild(el("div", "stepnum", "Step " + (i + 1) + " of " + steps.length));
    card.appendChild(el("h3", "", title));
    card.appendChild(el("p", "mtext", text));
    card.appendChild(el("div", "dotsnav", steps.map((_, k) => '<i class="' + (k === i ? "on" : "") + '"></i>').join("")));
    const foot = el("div", "mfoot");
    const prev = el("button", "btn ghost", "← Back");
    prev.type = "button";
    prev.disabled = i === 0;
    const next = el("button", "btn", i === steps.length - 1 ? "Got it ✓" : "Next →");
    next.type = "button";
    foot.append(prev, next);
    card.appendChild(foot);
    m.appendChild(card);

    card.querySelector(".x").onclick = () => { SFX.click(); finish(); };
    prev.onclick = () => { SFX.click(); i = Math.max(0, i - 1); draw(); };
    next.onclick = () => { SFX.click(); if (i < steps.length - 1) { i++; draw(); } else finish(); };
    next.focus();
  }

  draw();
}

// =====================================================================
// Navigation & views
// =====================================================================
const ui = { view: "home", cat: "all", q: "", game: null, progressGame: null };

function rerender() {
  if (ui.view === "home") renderHome();
  else if (ui.view === "progress") renderProgress();
  else if (ui.view === "hub" && ui.game) renderHub(ui.game);
  renderNav();
}

function go(view, opts = {}) {
  stopRun();
  if (view !== "play") $("play").hidden = true;
  document.body.style.overflow = "";
  ui.view = view;
  if (opts.cat) ui.cat = opts.cat;
  ["home", "progress", "hub"].forEach(v => { $("view_" + v).hidden = v !== view; });
  rerender();
  window.scrollTo(0, 0);
}

function renderNav() {
  const side = $("sideCats");
  side.innerHTML = "";
  const chips = $("chips");
  chips.innerHTML = "";

  const all = [{ id: "all", name: "All games", icon: "✦", color: "#2ee6ff" }].concat(CATS);
  all.forEach(cat => {
    const active = ui.view === "home" && ui.cat === cat.id;
    const b = el("button", "navbtn" + (active ? " active" : ""), '<span class="ni">' + cat.icon + "</span>" + esc(cat.name));
    b.type = "button";
    b.style.setProperty("--c", cat.color);
    b.onclick = () => { SFX.click(); go("home", { cat: cat.id }); };

    const ch = el("button", "chip" + (active ? " active" : ""), cat.icon + " " + esc(cat.name));
    ch.type = "button";
