const CALLSIGNS = ["Viper", "Ghost", "Raven", "Hawk", "Cobra", "Wolf", "Blaze", "Storm", "Titan", "Shadow", "Fox", "Reaper", "Nova", "Rex", "Ace", "Bolt", "Echo", "Jinx", "Onyx", "Saber"];

const BIOMES = {
  grass: { base: "#2f5a2a", dots: ["rgba(20,50,20,.35)", "rgba(90,140,60,.25)", "rgba(60,100,40,.3)"], roofs: ["#6b5b4b", "#5a6270", "#7a4a3a", "#4f5a48"], tree: ["#1d4a1f", "#2f7a32"] },
  desert: { base: "#b59a6a", dots: ["rgba(140,110,60,.35)", "rgba(220,200,150,.3)", "rgba(160,130,80,.25)"], roofs: ["#c9a46a", "#a8845a", "#d9bb84", "#8f6d48"], tree: ["#5d6b2a", "#8a9a3f"] },
  snow: { base: "#dfe7f2", dots: ["rgba(170,190,215,.35)", "rgba(255,255,255,.5)", "rgba(190,205,225,.3)"], roofs: ["#8a96aa", "#6f7a90", "#a3aec2", "#5d6880"], tree: ["#2f4f45", "#4f7a6a"] },
  urban: { base: "#3a3d48", dots: ["rgba(20,20,26,.35)", "rgba(90,95,110,.25)", "rgba(60,62,72,.3)"], roofs: ["#4a5068", "#3f4558", "#59617c", "#2f3446"], tree: ["#1f3d2a", "#2f5a3a"] }
};

function groundPattern(g, biome) {
  const b = BIOMES[biome];
  const cv = document.createElement("canvas");
  cv.width = cv.height = 256;
  const x = cv.getContext("2d");
  x.fillStyle = b.base;
  x.fillRect(0, 0, 256, 256);
  const r = mulberry32(hashStr(biome));
  for (let i = 0; i < 700; i++) {
    x.fillStyle = b.dots[i % b.dots.length];
    const s = 1 + r() * (i < 60 ? 14 : 3);
    x.beginPath(); x.arc(r() * 256, r() * 256, s, 0, TAU); x.fill();
  }
  if (biome === "urban") {
    x.strokeStyle = "rgba(255,210,90,.18)"; x.lineWidth = 3; x.setLineDash([16, 14]);
    x.beginPath(); x.moveTo(0, 128); x.lineTo(256, 128); x.stroke();
  }
  return g.createPattern(cv, "repeat");
}

function segRect(x1, y1, x2, y2, q) {
  let t0 = 0, t1 = 1;
  const dx = x2 - x1, dy = y2 - y1;
  const p = [-dx, dx, -dy, dy], qq = [x1 - q.x, q.x + q.w - x1, y1 - q.y, q.y + q.h - y1];
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (qq[i] < 0) return false; }
    else {
      const t = qq[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
      else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
  }
  return true;
}

function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

async function tactical(c, mode) {
  const L = c.L, d = c.d, rng = c.rng;
  const cfg = {
    royale: { size: 1500 + d * 1300, bots: 4 + Math.floor(L / 7), biome: "grass" },
    assault: { size: 1300 + d * 700, bots: 4 + Math.floor(L / 8), biome: "desert" },
    hold: { size: 1150, bots: 0, biome: "snow" },
    rescue: { size: 1500 + d * 800, bots: 3 + Math.floor(L / 9), biome: "urban" }
  }[mode];
  const MW = Math.round(cfg.size), MH = Math.round(cfg.size);
  const reaction = 0.62 - d * 0.4;
  const spread = 0.24 - d * 0.17;
  const sight = 470 + d * 250;
  const botSpeed = 118 + d * 42;
  const W8 = { dmg: 17, rate: 0.15, speed: 950, range: 680, mag: 30, reload: 1.6 };

  // ---------------- Map
  const rects = [], trees = [], loot = [];
  const blockedAt = (x, y, r) => {
    if (x < r || y < r || x > MW - r || y > MH - r) return true;
    for (const q of rects) { const cx = clamp(x, q.x, q.x + q.w), cy = clamp(y, q.y, q.y + q.h); if ((x - cx) * (x - cx) + (y - cy) * (y - cy) < r * r) return true; }
    for (const t of trees) if ((t.x - x) * (t.x - x) + (t.y - y) * (t.y - y) < (t.r * 0.55 + r) * (t.r * 0.55 + r)) return true;
    return false;
  };
  const overlaps = (x, y, w, h, m) => rects.some(q => x < q.x + q.w + m && x + w + m > q.x && y < q.y + q.h + m && y + h + m > q.y);
  const addRect = (x, y, w, h, kind) => rects.push({ x, y, w, h, kind, roof: pickOf(rng, BIOMES[cfg.biome].roofs), vents: range(randInt(rng, 0, 3)).map(() => [rng(), rng()]) });

  function compound(cx, cy, size, gap) {
    const t = 22, s = size;
    const x0 = cx - s / 2, y0 = cy - s / 2;
    addRect(x0, y0, s / 2 - gap / 2, t, "wall"); addRect(cx + gap / 2, y0, s / 2 - gap / 2, t, "wall");
    addRect(x0, y0 + s - t, s / 2 - gap / 2, t, "wall"); addRect(cx + gap / 2, y0 + s - t, s / 2 - gap / 2, t, "wall");
    addRect(x0, y0 + t, t, s / 2 - gap / 2 - t, "wall"); addRect(x0, cy + gap / 2, t, s / 2 - gap / 2 - t, "wall");
    addRect(x0 + s - t, y0 + t, t, s / 2 - gap / 2 - t, "wall"); addRect(x0 + s - t, cy + gap / 2, t, s / 2 - gap / 2 - t, "wall");
    addRect(cx - 60, cy - 40, 120, 80, "building");
  }

  let extract = null, hostage = null;
  if (mode === "assault") compound(MW / 2, MH / 2, 520 + d * 160, 110);
  if (mode === "rescue") {
    compound(MW * 0.74, MH * 0.74, 440, 100);
    extract = { x: 150, y: 150, r: 80 };
  }
  if (mode === "hold") {
    const cx = MW / 2, cy = MH / 2;
    range(10).forEach(i => { const a = (i / 10) * TAU; if (i % 3 === 0) return; addRect(cx + Math.cos(a) * 170 - 20, cy + Math.sin(a) * 170 - 20, 40, 40, "crate"); });
  }

  const nBuild = Math.round((MW * MH) / (mode === "hold" ? 260000 : 150000));
  for (let i = 0, tries = 0; i < nBuild && tries < 600; tries++) {
    const w = 110 + rng() * 170, h = 100 + rng() * 160;
    const x = 60 + rng() * (MW - w - 120), y = 60 + rng() * (MH - h - 120);
    if (overlaps(x, y, w, h, 90)) continue;
    if (mode === "rescue" && Math.hypot(x - 150, y - 150) < 300) continue;
    if (mode === "hold" && Math.hypot(x + w / 2 - MW / 2, y + h / 2 - MH / 2) < 320) continue;
    addRect(x, y, w, h, "building"); i++;
  }
  for (let i = 0, tries = 0; i < MW / 70 && tries < 800; tries++) {
    const s = 32 + rng() * 16, x = 40 + rng() * (MW - 80), y = 40 + rng() * (MH - 80);
    if (overlaps(x, y, s, s, 50)) continue;
    addRect(x, y, s, s, "crate"); i++;
  }
  for (let i = 0, tries = 0; i < MW / 32 && tries < 1200; tries++) {
    const r = 18 + rng() * 16, x = 40 + rng() * (MW - 80), y = 40 + rng() * (MH - 80);
    if (overlaps(x - r, y - r, 2 * r, 2 * r, 30) || trees.some(t => Math.hypot(t.x - x, t.y - y) < t.r + r + 20)) continue;
    if (extract && Math.hypot(x - extract.x, y - extract.y) < 160) continue;
    trees.push({ x, y, r }); i++;
  }
  const freeSpot = (r, filter) => {
    for (let k = 0; k < 400; k++) {
      const x = 60 + rng() * (MW - 120), y = 60 + rng() * (MH - 120);
      if (!blockedAt(x, y, r + 6) && (!filter || filter(x, y))) return { x, y };
    }
    return { x: MW / 2, y: MH / 2 };
  };

  // ---------------- Units
  const units = [];
  const makeUnit = (x, y, team, isPlayer, name, hue) => {
    const u = { x, y, r: 15, hp: 100, armor: 0, ang: rng() * TAU, team, player: isPlayer, alive: true, cd: 0, ammo: W8.mag, reload: 0, med: isPlayer ? 1 : 0, name, hue, deadT: 0, flash: 0,
      ai: { state: "roam", wx: x, wy: y, seen: 0, target: null, lx: 0, ly: 0, strafe: rng() < 0.5 ? 1 : -1, think: rng() * 0.2, alert: mode === "royale" || mode === "hold", post: { x, y }, stuck: 0, lastPos: { x, y }, sw: 0 } };
    units.push(u);
    return u;
  };

  let pSpawn;
  if (mode === "assault") pSpawn = { x: MW / 2, y: MH - 90 };
  else if (mode === "hold") pSpawn = { x: MW / 2, y: MH / 2 };
  else if (mode === "rescue") pSpawn = { x: 150, y: 150 };
  else pSpawn = freeSpot(20);
  const player = makeUnit(pSpawn.x, pSpawn.y, 1, true, "You", 190);
  player.armor = mode === "hold" ? 50 : 0;

  const botNames = shuffle(rng, CALLSIGNS);
  for (let i = 0; i < cfg.bots; i++) {
    let pos;
    if (mode === "assault") {
      const s = 480 + d * 160;
      pos = freeSpot(18, (x, y) => Math.abs(x - MW / 2) < s / 2 - 40 && Math.abs(y - MH / 2) < s / 2 - 40) ;
      if (i >= Math.ceil(cfg.bots * 0.6)) pos = freeSpot(18, (x, y) => Math.hypot(x - MW / 2, y - MH / 2) < 520 && Math.hypot(x - player.x, y - player.y) > 500);
    } else if (mode === "rescue") {
      pos = freeSpot(18, (x, y) => (Math.hypot(x - MW * 0.74, y - MH * 0.74) < 420 || (rng() < 0.3 && Math.hypot(x - player.x, y - player.y) > 600)));
    } else pos = freeSpot(18, (x, y) => Math.hypot(x - player.x, y - player.y) > 420);
    makeUnit(pos.x, pos.y, mode === "royale" ? 10 + i : 2, false, botNames[i % botNames.length], mode === "royale" ? Math.round(rng() * 360) : 0);
  }
  if (mode === "rescue") hostage = { x: MW * 0.74, y: MH * 0.74 + 70, following: false };

  const nLoot = mode === "royale" ? 8 + cfg.bots : mode === "hold" ? 3 : 4;
  for (let i = 0; i < nLoot; i++) {
    const p = freeSpot(14);
    loot.push({ x: p.x, y: p.y, type: rng() < 0.55 ? "med" : "armor" });
  }

  // ---------------- Zone (royale)
  const zone = mode === "royale" ? { x: MW * (0.35 + rng() * 0.3), y: MH * (0.35 + rng() * 0.3), r: MW * 0.78, r0: MW * 0.78, rMin: 90, T: 55 + cfg.bots * 5, t: 0 } : null;

  // ---------------- State
  const bullets = [], parts = [], feed = [], flashes = [];
  let kills = 0, started = false, t = 0, lastSound = 0, holdLeft = 0, waveT = 4, spawnedWaves = 0;
  const camera = { x: player.x, y: player.y };
  const cv = c.canvas();
  const pattern = groundPattern(cv.g, cfg.biome);
  const aliveBots = () => units.filter(u => !u.player && u.alive).length;

  // ---------------- Combat
  function sound(u, kind) {
    const dist = Math.hypot(u.x - player.x, u.y - player.y);
    if (dist > 750 || t - lastSound < 0.05) return;
    lastSound = t;
    const vol = (1 - dist / 750) * (u.player ? 0.16 : 0.1);
    if (kind === "shot") { noise(0.09, vol); tone(u.player ? 180 : 140, 0.06, "square", vol * 0.25, -60); }
  }

  function fire(u, ang) {
    if (!u.alive || u.cd > 0 || u.reload > 0) return;
    if (u.ammo <= 0) { u.reload = W8.reload; return; }
    u.cd = W8.rate;
    u.ammo--;
    const sp = u.player ? 0.035 : spread;
    const a = ang + (Math.random() - 0.5) * 2 * sp;
    const mx = u.x + Math.cos(ang) * 24, my = u.y + Math.sin(ang) * 24;
    bullets.push({ x: mx, y: my, vx: Math.cos(a) * W8.speed, vy: Math.sin(a) * W8.speed, owner: u, life: W8.range / W8.speed });
    flashes.push({ x: mx, y: my, a: ang, t: 0 });
    sound(u, "shot");
    if (u.ammo === 0) u.reload = W8.reload;
    if (u.player) units.forEach(o => { if (!o.player && o.alive && Math.hypot(o.x - u.x, o.y - u.y) < 520) o.ai.alert = true; });
  }

  function hostile(a, b) { return a !== b && a.team !== b.team; }

  function damage(u, dmg, by) {
    if (!u.alive) return;
    if (u.armor > 0) { const ab = Math.min(u.armor, dmg * 0.5); u.armor -= ab; dmg -= ab; }
    u.hp -= dmg;
    u.flash = 1;
    if (u.player) { c.buzz(25); dmgFlash = 1; }
    for (let i = 0; i < 6; i++) parts.push({ x: u.x, y: u.y, vx: (Math.random() - 0.5) * 160, vy: (Math.random() - 0.5) * 160, t: 0, life: 0.35, r: 2.5, c: "230,40,60" });
    if (!u.player) { u.ai.alert = true; if (by && !u.ai.target) { u.ai.lx = by.x; u.ai.ly = by.y; if (u.ai.state !== "fight") u.ai.state = "chase"; } }
    if (u.hp <= 0) {
      u.alive = false; u.hp = 0; u.deadT = 0;
      feed.unshift({ txt: (by ? by.name : "The zone") + "  ✖  " + u.name, t: 0, me: by && by.player, dead: u.player });
      if (feed.length > 5) feed.pop();
      if (by && by.player) { kills++; c.sfx("hit"); }
      if (!u.player && mode === "royale" && rng() < 0.5) loot.push({ x: u.x, y: u.y, type: rng() < 0.6 ? "med" : "armor" });
    }
  }

  // ---------------- Line of sight
  function los(a, b, range = sight) {
    if (Math.hypot(a.x - b.x, a.y - b.y) > range) return false;
    for (const q of rects) if (segRect(a.x, a.y, b.x, b.y, q)) return false;
    return true;
  }

  // ---------------- Movement with sliding + steering
  function moveUnit(u, dx, dy) {
    const ox = u.x, oy = u.y;
    if (!blockedAt(u.x + dx, u.y, u.r)) u.x += dx;
    if (!blockedAt(u.x, u.y + dy, u.r)) u.y += dy;
    return Math.hypot(u.x - ox, u.y - oy);
  }

  function steer(u, tx, ty, speed, dt) {
    const a = Math.atan2(ty - u.y, tx - u.x);
    const step = speed * dt;
    for (const off of [0, 0.7, -0.7, 1.4, -1.4, 2.1, -2.1]) {
      if (moveUnit(u, Math.cos(a + off) * step, Math.sin(a + off) * step) > step * 0.4) return true;
    }
    return false;
  }

  function pickWaypoint(u) {
    let p;
    if (zone) {
      const r = Math.max(60, zone.r * 0.75), a = rng() * TAU, rr = Math.sqrt(rng()) * r;
      p = { x: clamp(zone.x + Math.cos(a) * rr, 40, MW - 40), y: clamp(zone.y + Math.sin(a) * rr, 40, MH - 40) };
    } else if (!u.ai.alert && mode !== "hold") {
      p = { x: u.ai.post.x + (rng() - 0.5) * 220, y: u.ai.post.y + (rng() - 0.5) * 220 };
    } else p = { x: 60 + rng() * (MW - 120), y: 60 + rng() * (MH - 120) };
    u.ai.wx = p.x; u.ai.wy = p.y;
  }

  function aiUpdate(u, dt) {
    const ai = u.ai;
    ai.think -= dt;
    if (ai.think <= 0) {
      ai.think = 0.14;
      const cands = mode === "royale" ? units.filter(o => o.alive && hostile(u, o)) : (player.alive ? [player] : []);
      let best = null, bd = Infinity;
      for (const o of cands) {
        const dd = Math.hypot(o.x - u.x, o.y - u.y);
        if (dd < bd && (ai.alert || dd < sight * 0.6 || o === ai.target) && los(u, o)) { bd = dd; best = o; }
      }
      if (best) {
        if (ai.target !== best) { ai.target = best; ai.seen = 0; }
        ai.state = "fight"; ai.alert = true; ai.lx = best.x; ai.ly = best.y;
      } else if (ai.state === "fight") { ai.state = "chase"; ai.target = null; }
      if (mode === "hold" && player.alive && ai.state === "roam") { ai.state = "chase"; ai.lx = player.x; ai.ly = player.y; }
      if (!player.player || !player.alive) return;
      if (!ai.alert && Math.hypot(player.x - u.x, player.y - u.y) < 160) ai.alert = true;
      if (u.hp < 55 && u.med > 0) { u.hp = Math.min(100, u.hp + 40); u.med--; }
    }

    if (zone && Math.hypot(u.x - zone.x, u.y - zone.y) > zone.r - 20 && ai.state !== "fight") {
      steer(u, zone.x, zone.y, botSpeed * 1.05, dt);
      return;
    }

    if (ai.state === "fight" && ai.target && ai.target.alive) {
      const tg = ai.target;
      const dist = Math.hypot(tg.x - u.x, tg.y - u.y);
      const want = Math.atan2(tg.y - u.y, tg.x - u.x);
      u.ang = want;
      ai.seen += dt;
      ai.sw -= dt;
      if (ai.sw <= 0) { ai.sw = 0.8 + rng() * 1.2; ai.strafe = rng() < 0.5 ? 1 : -1; }
      const perp = want + (Math.PI / 2) * ai.strafe;
      let mx = Math.cos(perp) * 0.7, my = Math.sin(perp) * 0.7;
      if (dist > 380) { mx += Math.cos(want); my += Math.sin(want); }
      else if (dist < 170) { mx -= Math.cos(want); my -= Math.sin(want); }
      const len = Math.hypot(mx, my) || 1;
      if (moveUnit(u, (mx / len) * botSpeed * 0.85 * dt, (my / len) * botSpeed * 0.85 * dt) < 0.5) ai.strafe *= -1;
      if (ai.seen > reaction && dist < W8.range) fire(u, want);
      return;
    }

    if (ai.state === "chase") {
      if (Math.hypot(ai.lx - u.x, ai.ly - u.y) < 30 || !steer(u, ai.lx, ai.ly, botSpeed, dt)) { ai.state = "roam"; pickWaypoint(u); }
      u.ang = Math.atan2(ai.ly - u.y, ai.lx - u.x);
      return;
    }

    // roam / patrol / look for loot
    if (u.hp < 70) {
      const near = loot.find(l => Math.hypot(l.x - u.x, l.y - u.y) < 320);
      if (near) { ai.wx = near.x; ai.wy = near.y; }
    }
    const dd = Math.hypot(ai.wx - u.x, ai.wy - u.y);
    if (dd < 26) pickWaypoint(u);
    const speed = ai.alert ? botSpeed : botSpeed * 0.45;
    if (!steer(u, ai.wx, ai.wy, speed, dt)) { ai.stuck += dt; if (ai.stuck > 0.4) { ai.stuck = 0; pickWaypoint(u); } }
    u.ang = Math.atan2(ai.wy - u.y, ai.wx - u.x);
  }

  // ---------------- Input
  const keys = c.keys();
  const input = { mx: 0, my: 0, aimX: null, aimY: null, firing: false, touch: c.touch, jx: 0, jy: 0 };
  const toWorld = (sx, sy) => ({ x: (sx - cv.W / 2) / view.scale + camera.x, y: (sy - cv.H / 2) / view.scale + camera.y });
  const view = { scale: 1 };

  c.on(cv.cv, "pointermove", e => { if (e.pointerType === "mouse") { const p = cv.pos(e); const w = toWorld(p.x, p.y); input.aimX = w.x; input.aimY = w.y; input.touch = false; } });
  c.on(cv.cv, "pointerdown", e => { if (e.pointerType === "mouse") { input.firing = true; input.touch = false; } });
  c.on(window, "pointerup", e => { if (e.pointerType === "mouse") input.firing = false; });

  let touchUi = null;
  function buildTouch() {
    const pad = el("div", "touchpad");
    pad.innerHTML = '<div class="stick-base"><div class="stick-knob"></div></div><div class="abtn fire">FIRE</div><div class="abtn heal">💊<span>0</span></div>';
    c.board.style.position = "relative";
    c.board.appendChild(pad);
    const base = pad.querySelector(".stick-base"), knob = pad.querySelector(".stick-knob"), fireB = pad.querySelector(".fire"), heal = pad.querySelector(".heal");
    let sid = null;
    const setStick = e => {
      const r = base.getBoundingClientRect();
      let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
      const m = Math.hypot(dx, dy), max = r.width / 2;
      if (m > max) { dx = (dx / m) * max; dy = (dy / m) * max; }
      knob.style.transform = "translate(" + dx + "px," + dy + "px)";
      input.jx = dx / max; input.jy = dy / max;
    };
    base.addEventListener("pointerdown", e => { sid = e.pointerId; base.setPointerCapture(sid); setStick(e); input.touch = true; });
    base.addEventListener("pointermove", e => { if (e.pointerId === sid) setStick(e); });
    const endStick = e => { if (e.pointerId !== sid) return; sid = null; knob.style.transform = ""; input.jx = input.jy = 0; };
    base.addEventListener("pointerup", endStick);
    base.addEventListener("pointercancel", endStick);
    fireB.addEventListener("pointerdown", e => { fireB.setPointerCapture(e.pointerId); input.firing = true; input.touch = true; fireB.classList.add("on"); });
    const endFire = () => { input.firing = false; fireB.classList.remove("on"); };
    fireB.addEventListener("pointerup", endFire);
    fireB.addEventListener("pointercancel", endFire);
    heal.addEventListener("pointerdown", () => useMed());
    return { heal: heal.querySelector("span"), pad };
  }
  touchUi = buildTouch();
  if (!c.touch) touchUi.pad.style.display = "none";
  c.on(window, "touchstart", () => { touchUi.pad.style.display = ""; input.touch = true; }, { passive: true, once: true });

  function useMed() {
    if (!started || !player.alive || player.med <= 0 || player.hp >= 100) return;
    player.med--; player.hp = Math.min(100, player.hp + 45); c.sfx("good"); c.banner("+45 HP", "good");
  }

  // ---------------- HUD and frame
  let dmgFlash = 0;
  const hud = () => {
    const o = { Kills: kills };
    if (mode === "royale") o.Alive = units.filter(u => u.alive).length;
    else if (mode !== "hold") o.Enemies = aliveBots();
    if (mode === "rescue") o.Hostage = hostage.following ? "With you" : "Find";
    c.hud(o);
  };
  hud();

  function updatePlayer(dt) {
    if (!player.alive) return;
    let mx = 0, my = 0;
    if (keys.w || keys.arrowup) my -= 1;
    if (keys.s || keys.arrowdown) my += 1;
    if (keys.a || keys.arrowleft) mx -= 1;
    if (keys.d || keys.arrowright) mx += 1;
    mx += input.jx; my += input.jy;
    const len = Math.hypot(mx, my);
    if (len > 0.1) { const s = Math.min(1, len); moveUnit(player, (mx / len) * 175 * s * dt, (my / len) * 175 * s * dt); }
    if (keys.r && player.ammo < W8.mag && player.reload <= 0) player.reload = W8.reload;
    if (keys.h || keys.q || keys.e) { keys.h = keys.q = keys.e = false; useMed(); }

    let aimAng = player.ang;
    const autoTarget = () => {
      let best = null, bd = Infinity;
      units.forEach(o => { if (o.alive && hostile(player, o)) { const dd = Math.hypot(o.x - player.x, o.y - player.y); if (dd < bd && dd < W8.range && los(player, o, W8.range)) { bd = dd; best = o; } } });
      return best;
    };
    if (input.touch) {
      const tg = autoTarget();
      if (tg) aimAng = Math.atan2(tg.y - player.y, tg.x - player.x);
      else if (len > 0.1) aimAng = Math.atan2(my, mx);
    } else if (input.aimX != null) aimAng = Math.atan2(input.aimY - player.y, input.aimX - player.x);
    player.ang = aimAng;
    if (input.firing || keys[" "]) fire(player, aimAng);

    for (let i = loot.length - 1; i >= 0; i--) {
      const l = loot[i];
      if (Math.hypot(l.x - player.x, l.y - player.y) < 30) {
        if (l.type === "med") { if (player.med >= 3) continue; player.med++; c.banner("Medkit +1", "good"); }
        else { if (player.armor >= 100) continue; player.armor = Math.min(100, player.armor + 50); c.banner("Armor +50", "good"); }
        loot.splice(i, 1); c.sfx("coin");
      }
    }
    if (touchUi) touchUi.heal.textContent = player.med;
  }

  function updateBullets(dt) {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
      let hitWall = false;
      for (const q of rects) if (segRect(b.x, b.y, nx, ny, q)) { hitWall = true; break; }
      let hitU = null;
      for (const u of units) {
        if (!u.alive || u === b.owner || (b.owner.team === u.team)) continue;
        if (distToSeg(u.x, u.y, b.x, b.y, nx, ny) < u.r) { hitU = u; break; }
      }
      if (hitU) { damage(hitU, W8.dmg, b.owner); bullets.splice(i, 1); continue; }
      if (hitWall) { for (let k = 0; k < 4; k++) parts.push({ x: nx, y: ny, vx: (Math.random() - 0.5) * 120, vy: (Math.random() - 0.5) * 120, t: 0, life: 0.25, r: 2, c: "255,220,140" }); bullets.splice(i, 1); continue; }
      b.px = b.x; b.py = b.y; b.x = nx; b.y = ny; b.life -= dt;
      if (b.life <= 0) bullets.splice(i, 1);
    }
  }

  function draw(dt) {
    const g = cv.g, W = cv.W, H = cv.H;
    view.scale = clamp(Math.min(W, H) / 680, 0.55, 1.15);
    const s = view.scale;
    camera.x += (player.x - camera.x) * Math.min(1, dt * 8);
    camera.y += (player.y - camera.y) * Math.min(1, dt * 8);
    const halfW = W / 2 / s, halfH = H / 2 / s;
    camera.x = MW > halfW * 2 ? clamp(camera.x, halfW, MW - halfW) : MW / 2;
    camera.y = MH > halfH * 2 ? clamp(camera.y, halfH, MH - halfH) : MH / 2;
    g.save();
    g.fillStyle = "#0a0c18"; g.fillRect(0, 0, W, H);
    g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-camera.x, -camera.y);
    g.save(); g.fillStyle = pattern; g.fillRect(0, 0, MW, MH); g.restore();
    g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 6; g.strokeRect(0, 0, MW, MH);
    const vx0 = camera.x - W / 2 / s - 80, vx1 = camera.x + W / 2 / s + 80, vy0 = camera.y - H / 2 / s - 80, vy1 = camera.y + H / 2 / s + 80;
    const inView = (x, y, m = 0) => x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m;

    if (extract) {
      g.save(); g.translate(extract.x, extract.y);
      g.fillStyle = "rgba(52,245,165,.15)"; g.strokeStyle = "rgba(52,245,165," + (0.5 + 0.3 * Math.sin(t * 4)) + ")"; g.lineWidth = 5;
      g.beginPath(); g.arc(0, 0, extract.r, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = "rgba(255,255,255,.85)"; g.font = "900 54px Orbitron, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("H", 0, 2);
      g.restore();
    }

    loot.forEach(l => {
      if (!inView(l.x, l.y)) return;
      g.save(); g.translate(l.x, l.y);
      g.shadowColor = l.type === "med" ? "#34f5a5" : "#2ee6ff"; g.shadowBlur = 14 + 6 * Math.sin(t * 4);
      g.fillStyle = l.type === "med" ? "#e8fff5" : "#cfefff"; g.fillRect(-12, -10, 24, 20);
      g.shadowBlur = 0;
      g.fillStyle = l.type === "med" ? "#ff3d5e" : "#2a7bff";
      if (l.type === "med") { g.fillRect(-3, -7, 6, 14); g.fillRect(-7, -3, 14, 6); } else { g.beginPath(); g.moveTo(0, -7); g.lineTo(7, -2); g.lineTo(5, 7); g.lineTo(-5, 7); g.lineTo(-7, -2); g.fill(); }
      g.restore();
    });

    // shadows first
    g.fillStyle = "rgba(0,0,0,.28)";
    rects.forEach(q => { if (inView(q.x, q.y, 300)) g.fillRect(q.x + 10, q.y + 12, q.w, q.h); });
    trees.forEach(tr => { if (inView(tr.x, tr.y)) { g.beginPath(); g.arc(tr.x + 8, tr.y + 10, tr.r, 0, TAU); g.fill(); } });

    // dead bodies
    units.forEach(u => {
      if (u.alive || !inView(u.x, u.y)) return;
      u.deadT += dt;
      g.globalAlpha = Math.max(0.15, 1 - u.deadT / 10);
      g.fillStyle = "rgba(120,20,30,.55)"; g.beginPath(); g.ellipse(u.x, u.y, 22, 14, 0.4, 0, TAU); g.fill();
      g.fillStyle = "#3a3f55"; g.beginPath(); g.arc(u.x, u.y, u.r, 0, TAU); g.fill();
      g.globalAlpha = 1;
    });

    // units
    units.forEach(u => {
      if (!u.alive || !inView(u.x, u.y)) return;
      const visible = u.player || los(player, u, sight + 120) || Math.hypot(u.x - player.x, u.y - player.y) < 130;
      if (!visible) return;
      u.flash = Math.max(0, u.flash - dt * 5);
      g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(u.x + 4, u.y + 6, u.r + 2, u.r - 2, 0, 0, TAU); g.fill();
      g.save(); g.translate(u.x, u.y); g.rotate(u.ang);
      g.fillStyle = "#1a1d26"; g.fillRect(6, -3.5, 26, 7);
      g.fillStyle = "#3a3f55"; g.fillRect(6, -5, 10, 10);
      g.restore();
      const col = u.player ? "#2ee6ff" : u.team === 2 ? "#ff4d5e" : "hsl(" + u.hue + " 75% 58%)";
      const gr = g.createRadialGradient(u.x - 5, u.y - 6, 2, u.x, u.y, u.r);
      gr.addColorStop(0, u.flash ? "#fff" : "rgba(255,255,255,.85)"); gr.addColorStop(0.3, col); gr.addColorStop(1, "#111522");
      g.fillStyle = gr; g.beginPath(); g.arc(u.x, u.y, u.r, 0, TAU); g.fill();
      g.strokeStyle = u.player ? "#fff" : "rgba(0,0,0,.6)"; g.lineWidth = 2; g.stroke();
      if (u.player) { g.strokeStyle = "rgba(46,230,255,.35)"; g.lineWidth = 2; g.beginPath(); g.arc(u.x, u.y, u.r + 7 + Math.sin(t * 4) * 2, 0, TAU); g.stroke(); }
      if (!u.player) {
        g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(u.x - 18, u.y - 30, 36, 5);
        g.fillStyle = u.hp > 50 ? "#34f5a5" : u.hp > 25 ? "#ffd23f" : "#ff4d5e"; g.fillRect(u.x - 18, u.y - 30, 36 * (u.hp / 100), 5);
        if (u.armor > 0) { g.fillStyle = "#2ea8ff"; g.fillRect(u.x - 18, u.y - 24, 36 * (u.armor / 100), 2); }
        g.fillStyle = "rgba(255,255,255,.75)"; g.font = "700 11px Rajdhani, sans-serif"; g.textAlign = "center"; g.fillText(u.name, u.x, u.y - 34);
      }
    });

    if (hostage) {
      g.font = "30px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(hostage.following ? "🏃" : "🙋", hostage.x, hostage.y);
      if (!hostage.following) { g.strokeStyle = "rgba(255,210,122," + (0.5 + 0.4 * Math.sin(t * 5)) + ")"; g.lineWidth = 3; g.beginPath(); g.arc(hostage.x, hostage.y, 30, 0, TAU); g.stroke(); }
    }

    // buildings and props
    rects.forEach(q => {
      if (!inView(q.x, q.y, 300) && !inView(q.x + q.w, q.y + q.h, 300)) return;
      if (q.kind === "crate") {
        g.fillStyle = "#8a5a2b"; g.fillRect(q.x, q.y, q.w, q.h);
        g.strokeStyle = "#5a3a1a"; g.lineWidth = 3; g.strokeRect(q.x + 2, q.y + 2, q.w - 4, q.h - 4);
        g.beginPath(); g.moveTo(q.x + 3, q.y + 3); g.lineTo(q.x + q.w - 3, q.y + q.h - 3); g.moveTo(q.x + q.w - 3, q.y + 3); g.lineTo(q.x + 3, q.y + q.h - 3); g.stroke();
      } else if (q.kind === "wall") {
        g.fillStyle = "#6d6a64"; g.fillRect(q.x, q.y, q.w, q.h);
        g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(q.x, q.y, q.w, 4);
      } else {
        const gr = g.createLinearGradient(q.x, q.y, q.x + q.w, q.y + q.h);
        gr.addColorStop(0, q.roof); gr.addColorStop(1, "#1d2030");
        g.fillStyle = gr; g.fillRect(q.x, q.y, q.w, q.h);
        g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 3; g.strokeRect(q.x + 1.5, q.y + 1.5, q.w - 3, q.h - 3);
        g.strokeStyle = "rgba(0,0,0,.25)"; g.lineWidth = 2; g.beginPath(); g.moveTo(q.x, q.y + q.h / 2); g.lineTo(q.x + q.w, q.y + q.h / 2); g.stroke();
        g.fillStyle = "rgba(0,0,0,.25)";
        q.vents.forEach(([a, b]) => g.fillRect(q.x + 12 + a * (q.w - 40), q.y + 12 + b * (q.h - 40), 16, 16));
      }
    });
    trees.forEach(tr => {
      if (!inView(tr.x, tr.y)) return;
      const gr = g.createRadialGradient(tr.x - tr.r * 0.3, tr.y - tr.r * 0.3, 2, tr.x, tr.y, tr.r);
      gr.addColorStop(0, BIOMES[cfg.biome].tree[1]); gr.addColorStop(1, BIOMES[cfg.biome].tree[0]);
      g.fillStyle = gr; g.beginPath(); g.arc(tr.x, tr.y, tr.r, 0, TAU); g.fill();
    });

    // bullets & flashes
    g.lineCap = "round";
    bullets.forEach(b => {
      g.strokeStyle = b.owner.player ? "rgba(160,240,255,.95)" : "rgba(255,210,120,.9)"; g.lineWidth = 2.4;
      g.beginPath(); g.moveTo(b.x - b.vx * 0.025, b.y - b.vy * 0.025); g.lineTo(b.x, b.y); g.stroke();
    });
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i]; f.t += dt;
      const fg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, 16);
      fg.addColorStop(0, "rgba(255,240,180,.95)"); fg.addColorStop(1, "rgba(255,150,40,0)");
      g.fillStyle = fg; g.beginPath(); g.arc(f.x, f.y, 16, 0, TAU); g.fill();
      if (f.t > 0.05) flashes.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      g.fillStyle = "rgba(" + p.c + "," + Math.max(0, 1 - p.t / p.life) + ")"; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
      if (p.t > p.life) parts.splice(i, 1);
    }

    // zone
    if (zone) {
      g.fillStyle = "rgba(90,40,180,.32)";
      g.beginPath(); g.rect(-50, -50, MW + 100, MH + 100); g.arc(zone.x, zone.y, zone.r, 0, TAU, true); g.fill("evenodd");
      g.strokeStyle = "rgba(170,120,255,.9)"; g.lineWidth = 5; g.shadowColor = "#a66bff"; g.shadowBlur = 16;
      g.beginPath(); g.arc(zone.x, zone.y, zone.r, 0, TAU); g.stroke(); g.shadowBlur = 0;
    }

    // aim line (desktop)
    if (!input.touch && player.alive && input.aimX != null) {
      g.strokeStyle = "rgba(46,230,255,.25)"; g.lineWidth = 2; g.setLineDash([8, 10]);
      g.beginPath(); g.moveTo(player.x, player.y); g.lineTo(input.aimX, input.aimY); g.stroke(); g.setLineDash([]);
      g.strokeStyle = "rgba(255,255,255,.8)"; g.beginPath(); g.arc(input.aimX, input.aimY, 10, 0, TAU); g.stroke();
    }
    g.restore();

    // screen-space HUD
    if (dmgFlash > 0) {
      dmgFlash = Math.max(0, dmgFlash - dt * 2);
      const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.7);
      vg.addColorStop(0, "rgba(255,0,40,0)"); vg.addColorStop(1, "rgba(255,0,40," + dmgFlash * 0.55 + ")");
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
    const hx = 14, hy = input.touch ? 14 : H - 64;
    g.fillStyle = "rgba(6,8,20,.7)"; g.beginPath(); g.roundRect ? g.roundRect(hx, hy, 220, 50, 12) : g.rect(hx, hy, 220, 50, 12); g.fill();
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(hx + 10, hy + 10, 200, 10);
    g.fillStyle = player.hp > 50 ? "#34f5a5" : player.hp > 25 ? "#ffd23f" : "#ff4d5e"; g.fillRect(hx + 10, hy + 10, 2 * player.hp, 10);
    g.fillStyle = "#2ea8ff"; g.fillRect(hx + 10, hy + 22, 2 * player.armor, 4);
    g.fillStyle = "#e9ecff"; g.font = "700 14px Rajdhani, sans-serif"; g.textAlign = "left"; g.textBaseline = "alphabetic";
    g.fillText("HP " + Math.ceil(player.hp) + "   " + (player.reload > 0 ? "RELOADING" : "AMMO " + player.ammo + "/" + W8.mag) + "   💊" + player.med, hx + 10, hy + 42);

    // minimap
    const mm = Math.min(130, Math.min(W, H) * 0.24), mx0 = W - mm - 12, my0 = 12, ms = mm / MW;
    g.fillStyle = "rgba(6,8,20,.75)"; g.fillRect(mx0 - 4, my0 - 4, mm + 8, mm + 8);
    g.save(); g.beginPath(); g.rect(mx0, my0, mm, mm); g.clip();
    g.fillStyle = BIOMES[cfg.biome].base; g.globalAlpha = 0.6; g.fillRect(mx0, my0, mm, mm); g.globalAlpha = 1;
    g.fillStyle = "rgba(20,24,40,.8)"; rects.forEach(q => g.fillRect(mx0 + q.x * ms, my0 + q.y * ms, Math.max(1, q.w * ms), Math.max(1, q.h * ms)));
    if (zone) { g.strokeStyle = "#c39bff"; g.lineWidth = 1.5; g.beginPath(); g.arc(mx0 + zone.x * ms, my0 + zone.y * ms, zone.r * ms, 0, TAU); g.stroke(); }
    if (extract) { g.fillStyle = "#34f5a5"; g.beginPath(); g.arc(mx0 + extract.x * ms, my0 + extract.y * ms, 4, 0, TAU); g.fill(); }
    if (hostage) { g.fillStyle = "#ffd27a"; g.beginPath(); g.arc(mx0 + hostage.x * ms, my0 + hostage.y * ms, 3.5, 0, TAU); g.fill(); }
    units.forEach(u => { if (u.alive && !u.player && (los(player, u, sight + 120) || mode === "hold")) { g.fillStyle = "#ff4d5e"; g.fillRect(mx0 + u.x * ms - 2, my0 + u.y * ms - 2, 4, 4); } });
    g.fillStyle = "#2ee6ff"; g.beginPath(); g.arc(mx0 + player.x * ms, my0 + player.y * ms, 3.5, 0, TAU); g.fill();
    g.strokeStyle = "rgba(255,255,255,.4)"; g.strokeRect(mx0 + (camera.x - W / 2 / s) * ms, my0 + (camera.y - H / 2 / s) * ms, (W / s) * ms, (H / s) * ms);
    g.restore();

    // kill feed
    feed.forEach((f, i) => {
      f.t += dt;
      const a = Math.max(0, 1 - Math.max(0, f.t - 4) / 1);
      g.globalAlpha = a;
      g.fillStyle = f.me ? "rgba(46,230,255,.18)" : f.dead ? "rgba(255,61,94,.25)" : "rgba(0,0,0,.45)";
      const fy = (input.touch ? 74 : 14) + i * 24;
      g.fillRect(14, fy, 210, 20);
      g.fillStyle = "#fff"; g.font = "700 12px Rajdhani, sans-serif"; g.fillText(f.txt, 22, fy + 14);
      g.globalAlpha = 1;
    });
    for (let i = feed.length - 1; i >= 0; i--) if (feed[i].t > 5) feed.splice(i, 1);
  }

  // ---------------- Main loop
  c.every(dt => {
    t += dt;
    if (started) {
      updatePlayer(dt);
      units.forEach(u => {
        if (!u.alive) return;
        u.cd = Math.max(0, u.cd - dt);
        if (u.reload > 0) { u.reload -= dt; if (u.reload <= 0) u.ammo = W8.mag; }
        if (!u.player && player.alive) aiUpdate(u, dt);
        if (!u.player) for (let i = loot.length - 1; i >= 0; i--) {
          const l = loot[i];
          if (Math.hypot(l.x - u.x, l.y - u.y) < 26) { if (l.type === "med") { if (u.hp < 100) u.hp = Math.min(100, u.hp + 40); else u.med++; } else u.armor = Math.min(100, u.armor + 50); loot.splice(i, 1); }
        }
      });
      updateBullets(dt);

      if (zone) {
        zone.t += dt;
        zone.r = Math.max(zone.rMin, lerp(zone.r0, zone.rMin, Math.min(1, zone.t / zone.T)));
        units.forEach(u => { if (u.alive && Math.hypot(u.x - zone.x, u.y - zone.y) > zone.r) damage(u, 9 * dt, null); });
      }

      if (mode === "hold") {
        waveT -= dt;
        const maxAlive = 5 + Math.floor(L / 12);
        if (waveT <= 0) {
          waveT = 8.5 - d * 4;
          const size = 2 + Math.floor(L / 15);
          for (let i = 0; i < size && aliveBots() < maxAlive; i++) {
            const side = Math.floor(rng() * 4);
            const p = side === 0 ? { x: 40 + rng() * (MW - 80), y: 40 } : side === 1 ? { x: MW - 40, y: 40 + rng() * (MH - 80) } : side === 2 ? { x: 40 + rng() * (MW - 80), y: MH - 40 } : { x: 40, y: 40 + rng() * (MH - 80) };
            if (blockedAt(p.x, p.y, 18)) continue;
            const u = makeUnit(p.x, p.y, 2, false, botNames[(spawnedWaves * 3 + i) % botNames.length], 0);
            u.ai.alert = true; u.ai.state = "chase"; u.ai.lx = player.x; u.ai.ly = player.y;
          }
          spawnedWaves++;
          if (rng() < 0.5) { const p = freeSpot(14, (x, y) => Math.hypot(x - MW / 2, y - MH / 2) < 260); loot.push({ x: p.x, y: p.y, type: rng() < 0.65 ? "med" : "armor" }); }
        }
      }

      if (hostage && player.alive) {
        if (!hostage.following && Math.hypot(hostage.x - player.x, hostage.y - player.y) < 46) { hostage.following = true; c.sfx("coin"); c.banner("Hostage secured — get to the H pad!", "good"); }
        if (hostage.following) {
          const dx = player.x - hostage.x, dy = player.y - hostage.y, dd = Math.hypot(dx, dy);
          if (dd > 44) { const st = Math.min(dd - 44, 190 * dt); hostage.x += (dx / dd) * st; hostage.y += (dy / dd) * st; }
          if (Math.hypot(player.x - extract.x, player.y - extract.y) < extract.r && Math.hypot(hostage.x - extract.x, hostage.y - extract.y) < extract.r + 30) {
            hud(); return c.win(c.stars(player.hp / 100, 0.6, 0.3), "Hostage rescued with " + Math.ceil(player.hp) + " HP");
          }
        }
      }

      hud();
      if (!player.alive) {
        draw(dt);
        const place = units.filter(u => u.alive).length + 1;
        return c.lose(mode === "royale" ? "Eliminated — you placed #" + place + " of " + units.length + "." : "You were eliminated.");
      }
      if ((mode === "royale" || mode === "assault") && aliveBots() === 0) {
        draw(dt);
        return c.win(c.stars(player.hp / 100, 0.6, 0.3), mode === "royale" ? "Winner winner! " + kills + " kills" : "Base cleared — " + kills + " kills");
      }
    }
    draw(dt);
  });

  const intros = {
    royale: "Last one standing wins. <b>" + cfg.bots + "</b> enemies fight each other and you. Stay inside the shrinking zone, grab 💊 and armor.",
    assault: "Clear the enemy base: eliminate all <b>" + cfg.bots + "</b> guards.",
    hold: "Hold your position for <b>" + Math.round(45 + L * 0.5) + "s</b> against waves of attackers.",
    rescue: "Find the hostage 🙋 in the enemy compound and bring them to the <b>H</b> pad."
  };
  await c.ready(intros[mode] + (c.touch ? "<br>Left stick moves · FIRE auto-aims · 💊 heals." : "<br><b>WASD</b> move · <b>mouse</b> aim · <b>click</b> fire · <b>R</b> reload · <b>H</b> heal."));
  started = true;
  if (mode === "hold") {
    holdLeft = Math.round(45 + L * 0.5);
    c.countdown(holdLeft, () => { if (player.alive) c.win(c.stars(player.hp / 100, 0.6, 0.3), "Held the line — " + kills + " kills"); });
  }
  if (mode === "assault") c.countdown(Math.round(120 + cfg.bots * 10), () => c.lose("Out of time."));
  if (mode === "rescue") c.countdown(Math.round(140 + cfg.bots * 8), () => c.lose("Out of time — the extraction left."));
}

function drawHuntBird(g, b, sc) {
  const dir = b.vx < 0 ? -1 : 1;
  const pal = b.type === "dove" ? { body: "#f4f6ff", wing: "#d9dff7", head: "#ffffff", beak: "#ffb02e" }
    : b.type === "gold" ? { body: "#ffd34d", wing: "#ffae1f", head: "#ffe680", beak: "#ff7a1a" }
    : { body: "#7a5a3e", wing: "#5a3f2a", head: "#1f6b3a", beak: "#ffb02e" };
  g.save();
  g.translate(b.x, b.y); g.scale(dir * sc, sc);
  if (b.dead) g.rotate(b.rot);
  if (b.type !== "bird") { g.shadowColor = b.type === "gold" ? "rgba(255,210,80,.9)" : "rgba(255,255,255,.7)"; g.shadowBlur = 16; }
  const f = b.dead ? 0.25 : Math.sin(b.flap);
  g.fillStyle = shade(pal.wing, -35);
  g.beginPath(); g.moveTo(-4, -4); g.quadraticCurveTo(4, -6 - 20 * f, 14, -4 - 28 * f); g.quadraticCurveTo(10, -2, 6, -2); g.closePath(); g.fill();
  g.fillStyle = pal.wing;
  g.beginPath(); g.moveTo(-16, -2); g.lineTo(-31, -9); g.lineTo(-29, 5); g.closePath(); g.fill();
  const gr = g.createLinearGradient(0, -10, 0, 10);
  gr.addColorStop(0, shade(pal.body, 35)); gr.addColorStop(1, shade(pal.body, -35));
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 19, 10, -0.08, 0, TAU); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = pal.head; g.beginPath(); g.arc(16, -7, 8, 0, TAU); g.fill();
  if (b.type === "bird") { g.fillStyle = "#f4f6ff"; g.fillRect(9, -2, 8, 2); }
  g.fillStyle = pal.beak; g.beginPath(); g.moveTo(22, -9); g.lineTo(32, -6); g.lineTo(22, -3); g.closePath(); g.fill();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(18, -9, 2.6, 0, TAU); g.fill();
  g.fillStyle = "#111"; g.beginPath(); g.arc(18.8, -9, 1.3, 0, TAU); g.fill();
  g.fillStyle = shade(pal.wing, 15);
  g.beginPath(); g.moveTo(-8, -3); g.quadraticCurveTo(0, -8 - 28 * f, 14, -6 - 36 * f); g.quadraticCurveTo(12, -2, 4, 0); g.closePath(); g.fill();
  g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(-2, -3); g.lineTo(6, -6 - 22 * f); g.moveTo(2, -2); g.lineTo(10, -5 - 28 * f); g.stroke();
  g.restore();
}

async function birdHunt(c) {
  const L = c.L, d = c.d, rng = c.rng;
  const sky = TOD_SKIES[todFor(L)];
  const need = 8 + Math.floor(L * 0.3);
  const MAG = 6;
  let reserve = Math.ceil(need * (2.0 - d * 0.55)) + 4 - MAG;
  let inMag = MAG;
  const speed = 130 + d * 240;
  const zig = L > 6 ? 16 + d * 70 : 0;
  const doveChance = L > 8 ? 0.12 + d * 0.18 : 0;
  const goldChance = 0.07;
  const riseChance = L > 3 ? 0.35 + d * 0.25 : 0;
  const maxBirds = 2 + Math.floor(d * 4);
  const timeLimit = Math.round(30 + need * 1.6);
  const cv = c.canvas("aim");
  const seed = hashStr("hunt") + L * 17;
  const backC = makeCloudField(seed + 1, 6, sky.tint, { y0: 0.03, y1: 0.35, s0: 0.4, s1: 0.8, v: 0.008, parallax: 0, alpha: 0.75 });
  const frontC = makeCloudField(seed + 2, 3, sky.tint, { y0: 0.08, y1: 0.45, s0: 1.2, s1: 1.8, v: 0.016, parallax: 0, alpha: 0.82 });
  const starsBg = range(70).map(() => [rng(), rng() * 0.55, 0.3 + rng() * 0.7]);
  const birds = [], bits = [];
  let hits = 0, shots = 0, goodShots = 0, hearts = 3, started = false, finished = false, spawnT = 0.4, t = 0;
  let aim = null, gunA = -Math.PI / 2, recoil = 0, flashT = 0, reloadT = 0, ring = null;

  const hud = () => c.hud({ Birds: hits + "/" + need, Shells: inMag + reserve, Lives: hearts });
  hud();
  const sc = () => clamp(Math.min(cv.W, cv.H * 1.4) / 900, 0.55, 1.15);

  function spawn() {
    const W = cv.W, H = cv.H, s = sc();
    const r = rng();
    const type = r < doveChance ? "dove" : r < doveChance + goldChance ? "gold" : "bird";
    const sp = speed * s * (0.8 + rng() * 0.45) * (type === "gold" ? 1.35 : 1);
    if (rng() < riseChance) {
      const x = W * (0.15 + rng() * 0.7), ang = -Math.PI / 2 + (rng() - 0.5) * 1.3;
      birds.push({ mode: "rise", x, y: H * 0.9, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, type, flap: rng() * 6, life: 5 - d * 2.4, t: 0, dead: false, rot: 0, fv: 0 });
    } else {
      const dir = rng() < 0.5 ? 1 : -1, y0 = H * (0.12 + rng() * 0.5);
      birds.push({ mode: "cross", x: dir > 0 ? -50 : W + 50, y: y0, y0, vx: dir * sp, vy: 0, type, flap: rng() * 6, ph: rng() * 6, t: 0, dead: false, rot: 0, fv: 0 });
    }
  }

  function feathers(b) {
    const col = b.type === "dove" ? "244,246,255" : b.type === "gold" ? "255,211,77" : "160,112,77";
    for (let i = 0; i < 18; i++) { const a = Math.random() * TAU, v = 60 + Math.random() * 200; bits.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, life: 0.7 + Math.random() * 0.7, col, r: 2 + Math.random() * 3, rot: Math.random() * 6 }); }
  }

  function startReload() {
    if (reloadT > 0 || inMag >= MAG || reserve <= 0) return;
    reloadT = 1.1;
    c.banner("Reloading…");
    tone(300, 0.08, "square", 0.04); tone(220, 0.08, "square", 0.04, 0, 0.5);
  }

  function shoot(p) {
    if (!started || finished || !c.alive()) return;
    if (reloadT > 0) return;
    if (inMag <= 0) { startReload(); return; }
    inMag--; shots++;
    recoil = 1; flashT = 0.07;
    ring = { x: p.x, y: p.y, t: 0 };
    c.sfx("shot"); noise(0.18, 0.12);
    const s = sc();
    let target = null, best = Infinity;
    birds.forEach(b => { if (b.dead) return; const dd = Math.hypot(b.x - p.x, b.y - p.y); if (dd < 40 * s && dd < best) { best = dd; target = b; } });
    if (target) {
      target.dead = true; feathers(target);
      if (target.type === "dove") {
        hearts--; c.sfx("bad"); c.shake(); c.banner("That was a dove! −1 life", "bad"); hud();
        if (hearts <= 0) { finished = true; return c.after(500, () => c.lose("Too many doves were hit.")); }
      } else {
        goodShots++; hits += target.type === "gold" ? 2 : 1; c.sfx("hit");
        if (target.type === "gold") c.banner("Golden bird! +2", "good");
      }
    }
    hud();
    if (hits >= need) { finished = true; const acc = goodShots / shots; return c.after(500, () => c.win(acc >= 0.8 ? 3 : acc >= 0.6 ? 2 : 1, "Accuracy " + Math.round(acc * 100) + "%")); }
    if (inMag <= 0) { if (reserve > 0) startReload(); else { finished = true; c.after(800, () => c.lose("Out of shells — " + hits + " of " + need + " birds.")); } }
  }

  c.on(cv.cv, "pointermove", e => { aim = cv.pos(e); });
  c.on(cv.cv, "pointerdown", e => { aim = cv.pos(e); shoot(aim); });
  const keys = c.keys();

  function drawGun(g, W, H, s) {
    const px = W / 2, py = H + 18 * s;
    if (aim) gunA = rotTo(gunA, Math.atan2(aim.y - py, aim.x - px), 0.25);
    g.save(); g.translate(px, py); g.rotate(gunA);
    g.translate(-recoil * 26 * s, 0);
    const len = 230 * s;
    const bg = g.createLinearGradient(0, -9 * s, 0, 9 * s);
    bg.addColorStop(0, "#5d6170"); bg.addColorStop(0.5, "#2a2d36"); bg.addColorStop(1, "#14161c");
    g.fillStyle = bg; rrect(g, 40 * s, -7 * s, len, 7 * s, 3 * s); g.fill(); rrect(g, 40 * s, 1 * s, len - 10 * s, 6 * s, 3 * s); g.fill();
    const wg = g.createLinearGradient(0, -20 * s, 0, 20 * s);
    wg.addColorStop(0, "#9a5a2b"); wg.addColorStop(1, "#4a2a12");
    g.fillStyle = wg; rrect(g, -60 * s, -16 * s, 120 * s, 28 * s, 10 * s); g.fill();
    g.fillStyle = "#3a3d48"; g.fillRect(50 * s, -9 * s, 50 * s, 18 * s);
    g.fillStyle = "#6b4020"; rrect(g, 120 * s, -6 * s, 70 * s, 16 * s, 6 * s); g.fill();
    if (flashT > 0) {
      const fx = 40 * s + len + 14 * s;
      const fl = g.createRadialGradient(fx, -1, 0, fx, -1, 50 * s);
      fl.addColorStop(0, "rgba(255,255,220,1)"); fl.addColorStop(0.3, "rgba(255,190,80,.85)"); fl.addColorStop(1, "rgba(255,120,0,0)");
      g.fillStyle = fl; g.beginPath(); g.arc(fx, -1, 50 * s, 0, TAU); g.fill();
    }
    g.restore();
  }

  c.every(dt => {
    t += dt;
    const g = cv.g, W = cv.W, H = cv.H, s = sc();
    if (keys.r) { keys.r = false; startReload(); }
    if (reloadT > 0) { reloadT -= dt; if (reloadT <= 0) { const n = Math.min(MAG - inMag, reserve); inMag += n; reserve -= n; hud(); c.banner("Ready", "good"); } }
    recoil = Math.max(0, recoil - dt * 5); flashT = Math.max(0, flashT - dt);
    backC.update(dt); frontC.update(dt);
    if (started && !finished) {
      spawnT -= dt;
      if (spawnT <= 0 && birds.filter(b => !b.dead).length < maxBirds) { spawn(); spawnT = (1.1 - d * 0.5) * (0.6 + rng() * 0.8); }
    }
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.t += dt; b.flap += dt * (b.dead ? 2 : 15);
      if (b.dead) { b.fv += 1100 * dt; b.y += b.fv * dt; b.rot += dt * 7; if (b.y > H + 60) birds.splice(i, 1); continue; }
      if (b.mode === "cross") {
        b.x += b.vx * dt; b.ph += dt * 2.6; b.y = b.y0 + Math.sin(b.ph) * zig * s;
        if (b.x < -90 || b.x > W + 90) birds.splice(i, 1);
      } else {
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.t < b.life) {
          if (b.x < 30 && b.vx < 0) b.vx *= -1;
          if (b.x > W - 30 && b.vx > 0) b.vx *= -1;
          if (b.y < 30 && b.vy < 0) b.vy *= -1;
          if (b.y > H * 0.78 && b.vy > 0) b.vy *= -1;
          if (rng() < dt * 0.6) { const a = Math.atan2(b.vy, b.vx) + (rng() - 0.5) * 1.2, sp = Math.hypot(b.vx, b.vy); b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; }
        } else { b.vy = Math.min(b.vy, -Math.abs(b.vy) - 200 * dt); if (b.y < -80) birds.splice(i, 1); }
      }
    }

    const sg = g.createLinearGradient(0, 0, 0, H);
    sky.sky.forEach((col, i) => sg.addColorStop(i / (sky.sky.length - 1) * 0.8, col));
    sg.addColorStop(1, sky.sky[sky.sky.length - 1]);
    g.fillStyle = sg; g.fillRect(0, 0, W, H);
    if (sky.moon) {
      starsBg.forEach(([x, y, a]) => { g.fillStyle = "rgba(255,255,255," + a * (0.6 + 0.4 * Math.sin(t * 2 + x * 30)) + ")"; g.fillRect(x * W, y * H, 1.6, 1.6); });
      g.fillStyle = "#e9eeff"; g.shadowColor = "#cfe0ff"; g.shadowBlur = 40; g.beginPath(); g.arc(W * 0.8, H * 0.18, 28 * s, 0, TAU); g.fill(); g.shadowBlur = 0;
    } else {
      const sx = W * 0.75, sy = H * (sky.tint === "day" ? 0.16 : 0.62);
      const sgr = g.createRadialGradient(sx, sy, 0, sx, sy, H * 0.45);
      sgr.addColorStop(0, sky.sun); sgr.addColorStop(0.15, "rgba(255,220,170,.55)"); sgr.addColorStop(1, "rgba(255,200,150,0)");
      g.fillStyle = sgr; g.fillRect(0, 0, W, H);
    }
    backC.draw(g, W, H);
    const hill = (base, amp, fq, col, ph) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, base + Math.sin(x * fq + ph) * amp + Math.sin(x * fq * 2.3 + ph) * amp * 0.4); g.lineTo(W, H); g.closePath(); g.fill(); };
    hill(H * 0.74, 34 * s, 0.004 / s, sky.far, 1);
    hill(H * 0.82, 24 * s, 0.008 / s, sky.mid, 2);
    birds.forEach(b => drawHuntBird(g, b, s * (1.1 - d * 0.35)));
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; p.vx *= 0.98; p.rot += dt * 6;
      if (p.t > p.life) { bits.splice(i, 1); continue; }
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = "rgba(" + p.col + "," + (1 - p.t / p.life) + ")"; g.beginPath(); g.ellipse(0, 0, p.r, p.r * 0.45, 0, 0, TAU); g.fill(); g.restore();
    }
    frontC.draw(g, W, H);
    const gy = H * 0.88;
    const gg = g.createLinearGradient(0, gy, 0, H);
    gg.addColorStop(0, shade(sky.ground[0], 10)); gg.addColorStop(1, sky.ground[1]);
    g.fillStyle = gg; g.fillRect(0, gy, W, H - gy);
    g.strokeStyle = shade(sky.ground[0], -10); g.lineWidth = 2;
    for (let x = 0; x < W; x += 7) { const h = 14 + ((x * 37) % 17); const sway = Math.sin(t * 2 + x * 0.05) * 4; g.beginPath(); g.moveTo(x, gy + 6); g.quadraticCurveTo(x + sway * 0.5, gy - h * 0.5, x + sway, gy - h * s); g.stroke(); }
    if (ring) { ring.t += dt; g.strokeStyle = "rgba(255,240,200," + Math.max(0, 1 - ring.t / 0.25) + ")"; g.lineWidth = 3; g.beginPath(); g.arc(ring.x, ring.y, 8 + ring.t * 140, 0, TAU); g.stroke(); if (ring.t > 0.25) ring = null; }
    drawGun(g, W, H, s);
    for (let k = 0; k < MAG; k++) {
      const x = 18 + k * 18, y = H - 34;
      g.fillStyle = k < inMag ? "#ff3d5e" : "rgba(255,255,255,.15)"; rrect(g, x, y, 12, 22, 3); g.fill();
      g.fillStyle = k < inMag ? "#ffd27a" : "rgba(255,255,255,.1)"; g.fillRect(x, y + 16, 12, 6);
    }
    g.fillStyle = "#fff"; g.font = "700 13px Rajdhani, sans-serif"; g.textAlign = "left";
    g.fillText(reloadT > 0 ? "RELOADING…" : "+" + reserve, 20 + MAG * 18, H - 18);
    if (aim) drawCrosshair(g, aim.x, aim.y);
  });

  await c.ready("Shoot <b>" + need + "</b> birds in <b>" + timeLimit + "s</b>. You have <b>" + (inMag + reserve) + "</b> shells (6 per load)." + (zig ? " Birds zig-zag." : "") + (doveChance ? " <b>Don't shoot white doves</b> — they cost a life." : "") + (riseChance ? " Some birds burst out of the grass!" : ""));
  started = true;
  c.countdown(timeLimit, () => { if (!finished) { finished = true; c.lose("Time's up! The flock got away."); } });
}

const CANDY_SETS = {
  candy: { e: ["🍬", "🍭", "🍩", "🧁", "🍪", "🍫"], c: ["#ff4d5e", "#ff8ad8", "#ffb347", "#a66bff", "#d2a679", "#8b4a2b"] },
  jewel: { e: ["❤️", "💎", "🔶", "🍀", "🔮", "⭐"], c: ["#ff3d5e", "#3db8ff", "#ff9d2b", "#2ee68a", "#a66bff", "#ffd23f"] }
};

async function match3(c, mode) {
  const cols = 6 + (c.L > 40 ? 1 : 0) + (c.L > 80 ? 1 : 0);
  const rows = 7 + (c.L > 30 ? 1 : 0) + (c.L > 70 ? 1 : 0);
  const kinds = c.L <= 30 ? 4 : c.L <= 70 ? 5 : 6;
  const set = CANDY_SETS[mode];
  const band = kinds === 4 ? (c.L - 1) / 29 : kinds === 5 ? (c.L - 31) / 39 : (c.L - 71) / 29;
  let moves, target, goals;

  if (mode === "candy") {
    moves = 20 - Math.floor(c.L / 25);
    const per = { 4: 60, 5: 46, 6: 36 }[kinds];
    target = Math.round((moves * per * (0.6 + 0.45 * band)) / 10) * 10;
  } else {
    moves = 22 - Math.floor(c.L / 34);
    const need = 6 + Math.floor(c.L * 0.1);
    const picks = shuffle(c.rng, range(kinds)).slice(0, 2);
    goals = picks.map(k => ({ k, need, got: 0 }));
  }

  let score = 0, busy = true, sel = null, started = false, idle = 0;
  const bx = c.box(cols / rows);
  bx.style.setProperty("--cols", cols);
  bx.style.setProperty("--rows", rows);
  const wrap = el("div", "slide");
  wrap.style.borderRadius = "16px";
  wrap.style.background = "radial-gradient(circle at 50% 0%, rgba(255,90,209,.12), transparent 60%), rgba(255,255,255,.03)";
  wrap.style.border = "1px solid var(--line2)";
  wrap.style.overflow = "hidden";
  bx.appendChild(wrap);

  const grid = range(rows).map(() => new Array(cols).fill(null));
  const rnd = () => Math.floor(c.rand() * kinds);

  function makeCandy(t, r, cc, fromRow) {
    const d = el("div", "candy", "<b></b>");
    const item = { t, s: null, el: d, r, c: cc };
    paintCandy(item);
    place(item, fromRow != null ? fromRow : r, cc);
    wrap.appendChild(d);
    d.addEventListener("pointerdown", e => onDown(item, e));
    return item;
  }

  function paintCandy(it) {
    const b = it.el.firstChild;
    b.textContent = it.s ? "⚡" : set.e[it.t];
    it.el.style.setProperty("--cc", set.c[it.t]);
    b.style.boxShadow = it.s ? "0 0 0 2px #fff, 0 0 18px " + set.c[it.t] : "";
  }

  function place(it, r, cc) {
    it.el.style.left = (cc * 100) / cols + "%";
    it.el.style.top = (r * 100) / rows + "%";
  }

  // Fill without starting matches
  for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) {
    let t, guard = 0;
    do { t = rnd(); } while (guard++ < 20 && ((cc >= 2 && grid[r][cc - 1].t === t && grid[r][cc - 2].t === t) || (r >= 2 && grid[r - 1][cc].t === t && grid[r - 2][cc].t === t)));
    grid[r][cc] = makeCandy(t, r, cc);
  }

  function findRuns() {
    const runs = [];
    for (let r = 0; r < rows; r++) {
      let s = 0;
      for (let cc = 1; cc <= cols; cc++) {
        if (cc < cols && grid[r][cc] && grid[r][s] && grid[r][cc].t === grid[r][s].t) continue;
        if (cc - s >= 3 && grid[r][s]) runs.push(range(cc - s).map(k => [r, s + k]));
        s = cc;
      }
    }
    for (let cc = 0; cc < cols; cc++) {
      let s = 0;
      for (let r = 1; r <= rows; r++) {
        if (r < rows && grid[r][cc] && grid[s][cc] && grid[r][cc].t === grid[s][cc].t) continue;
        if (r - s >= 3 && grid[s][cc]) runs.push(range(r - s).map(k => [s + k, cc]));
        s = r;
      }
    }
    return runs;
  }

  function hasMove() {
    const swapT = (a, b) => { const t = a.t; a.t = b.t; b.t = t; };
    for (let r = 0; r < rows; r++) for (let cc = 0; cc < cols; cc++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = cc + dc;
        if (r2 >= rows || c2 >= cols) continue;
        swapT(grid[r][cc], grid[r2][c2]);
        const ok = findRuns().length > 0;
        swapT(grid[r][cc], grid[r2][c2]);
        if (ok) return [[r, cc], [r2, c2]];
      }
    }
    return null;
  }

  function reshuffle() {
    let guard = 0;
    do {
      const all = grid.flat();
      const ts = shuffle(c.rand, all.map(it => it.t));
      all.forEach((it, i) => { it.t = ts[i]; paintCandy(it); });
    } while ((findRuns().length || !hasMove()) && guard++ < 50);
    c.banner("No moves — shuffled!");
  }

  const hud = () => {
    if (mode === "candy") c.hud({ Score: score + "/" + target, Moves: moves });
    else { const o = { Moves: moves }; goals.forEach(g => { o[set.e[g.k]] = Math.max(0, g.need - g.got); }); c.hud(o); }
  };

  async function resolve(focus) {
    let chain = 0;
    while (true) {
      const runs = findRuns();
      if (!runs.length) break;
      chain++;
      const clear = new Set();
      const makeSpecial = [];
      runs.forEach(run => {
        run.forEach(([r, cc]) => clear.add(r * cols + cc));
        if (run.length >= 4) {
          const keep = run.find(([r, cc]) => focus && focus.some(([fr, fc]) => fr === r && fc === cc)) || run[Math.floor(run.length / 2)];
          makeSpecial.push(keep);
        }
      });
      // Specials blast their whole row and column
      let grew = true;
      while (grew) {
        grew = false;
        [...clear].forEach(k => {
          const it = grid[Math.floor(k / cols)][k % cols];
          if (it && it.s && !it.blasted) {
            it.blasted = true;
            for (let x = 0; x < cols; x++) { const kk = it.r * cols + x; if (!clear.has(kk)) { clear.add(kk); grew = true; } }
            for (let y = 0; y < rows; y++) { const kk = y * cols + it.c; if (!clear.has(kk)) { clear.add(kk); grew = true; } }
            c.sfx("boom");
          }
        });
      }
      makeSpecial.forEach(([r, cc]) => clear.delete(r * cols + cc));
      makeSpecial.forEach(([r, cc]) => { const it = grid[r][cc]; if (it) { it.s = "line"; it.blasted = false; paintCandy(it); } });

      clear.forEach(k => {
        const r = Math.floor(k / cols), cc = k % cols, it = grid[r][cc];
        if (!it) return;
        if (mode === "jewel") goals.forEach(g => { if (g.k === it.t) g.got++; });
        it.el.classList.add("pop");
        const dead = it.el;
        setTimeout(() => dead.remove(), 220);
        grid[r][cc] = null;
      });
      score += clear.size * 10 * chain + (clear.size > 5 ? 50 : 0);
      tone(500 + chain * 90, 0.12, "triangle", 0.1);
      if (chain > 1) c.banner(chain >= 4 ? "Sweet! x" + chain : "Combo x" + chain, "good");
      hud();
      await c.wait(230);

      for (let cc = 0; cc < cols; cc++) {
        let write = rows - 1;
        for (let r = rows - 1; r >= 0; r--) {
          if (grid[r][cc]) {
            const it = grid[r][cc];
            grid[r][cc] = null;
            grid[write][cc] = it;
            it.r = write; it.c = cc;
            place(it, write, cc);
            write--;
          }
        }
        let spawn = -1;
        for (let r = write; r >= 0; r--) {
          const it = makeCandy(rnd(), r, cc, spawn--);
          grid[r][cc] = it;
          void it.el.offsetWidth;
          place(it, r, cc);
        }
      }
      await c.wait(260);
      focus = null;
    }
    return chain;
  }

  function checkEnd() {
    if (mode === "candy") {
      if (score >= target) return c.win(score >= target * 1.4 ? 3 : score >= target * 1.2 ? 2 : 1, score + " points with " + moves + " moves left");
    } else if (goals.every(g => g.got >= g.need)) return c.win(moves >= 5 ? 3 : moves >= 2 ? 2 : 1, moves + " moves left");
    if (moves <= 0) return c.lose(mode === "candy" ? "Out of moves — " + score + " of " + target + " points." : "Out of moves — goals not reached.");
    if (!hasMove()) reshuffle();
  }

  async function trySwap(a, b) {
    if (busy || !c.alive()) return;
    busy = true; idle = 0;
    wrap.querySelectorAll(".hint").forEach(x => x.classList.remove("hint"));
    const swap = () => {
      grid[a.r][a.c] = b; grid[b.r][b.c] = a;
      [a.r, b.r] = [b.r, a.r]; [a.c, b.c] = [b.c, a.c];
      place(a, a.r, a.c); place(b, b.r, b.c);
    };
    swap();
    c.sfx("click");
    await c.wait(200);
    if (!findRuns().length) { swap(); await c.wait(200); busy = false; return; }
    moves--;
    hud();
    await resolve([[a.r, a.c], [b.r, b.c]]);
    busy = false;
    checkEnd();
  }

  let down = null;
  function onDown(it, e) {
    if (!started || busy) return;
    down = { it, x: e.clientX, y: e.clientY };
    if (sel && sel !== it && Math.abs(sel.r - it.r) + Math.abs(sel.c - it.c) === 1) {
      const a = sel; sel.el.classList.remove("sel"); sel = null; down = null;
      trySwap(a, it);
      return;
    }
    if (sel) sel.el.classList.remove("sel");
    sel = it; it.el.classList.add("sel");
  }
  c.on(window, "pointermove", e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) < 16) return;
    const it = down.it;
    down = null;
    const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, dx > 0 ? 1 : -1] : [dy > 0 ? 1 : -1, 0];
    const r2 = it.r + dr, c2 = it.c + dc;
    if (r2 < 0 || c2 < 0 || r2 >= rows || c2 >= cols) return;
    if (sel) { sel.el.classList.remove("sel"); sel = null; }
    trySwap(it, grid[r2][c2]);
  });
  c.on(window, "pointerup", () => { down = null; });

  c.every(dt => {
    if (!started || busy) return;
    idle += dt;
    if (idle > 6) {
      idle = 0;
      const mv = hasMove();
      if (mv) mv.forEach(([r, cc]) => grid[r][cc].el.classList.add("hint"));
    }
  });

  if (!hasMove()) reshuffle();
  hud();
  const intro = mode === "candy"
    ? "Score <b>" + target + "</b> points in <b>" + moves + "</b> moves. Match 4 to make a <b>⚡ blaster</b>!"
    : "Collect <b>" + goals.map(g => g.need + " " + set.e[g.k]).join("</b> and <b>") + "</b> in <b>" + moves + "</b> moves.";
  await c.ready(intro);
  started = true;
  busy = false;
}


addGames("arcade", [
  {
    id: "ar-birds", name: "Bird Hunt", icon: "🦆",

// Shared quiz runner for question/answer games
async function runQuiz(c, { need, limit, intro, gen, cc = 2, lives = 3 }) {
  let score = 0, hearts = lives, cur = null, started = false;
  const box = el("div", "qbox");
  const rule = el("div", "qrule"), big = el("div", "qbig"), ch = el("div", "choices");
  box.append(rule, big, ch);
  c.board.appendChild(box);
  const hud = () => c.hud({ Score: score + "/" + need, Lives: hearts });

  function next() {
    cur = gen();
    rule.textContent = cur.rule || "";
    rule.hidden = !cur.rule;
    rule.classList.toggle("flip", !!cur.flip);
    big.innerHTML = cur.q;
    big.style.fontSize = cur.size || "";
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");
    ch.style.setProperty("--cc", cur.cc || cc);
    ch.innerHTML = "";
    cur.choices.forEach(v => {
      const b = el("button", "choice", String(v));
      b.type = "button";
      b.addEventListener("click", () => answer(v, b));
      ch.appendChild(b);
    });
  }

  function answer(v, b) {
    if (!started || !c.alive()) return;
    if (String(v) === String(cur.answer)) {
      score++; c.sfx("click"); hud();
      if (score >= need) return c.win(hearts, hearts + " lives left");
    } else {
      hearts--; c.sfx("bad"); c.shake(); hud();
      c.banner("Answer: " + cur.answer, "bad");
      if (hearts <= 0) return c.lose("Out of lives.");
    }
    next();
  }

  hud();
  next();
  await c.ready(intro);
  started = true;
  c.countdown(limit, () => c.lose("Time's up!"));
}

function nearOptions(rng, answer, spread, count = 4) {
  const set = new Set([answer]);
  let guard = 0;
  while (set.size < count && guard++ < 200) {
    const delta = Math.max(1, Math.round((rng() * 2 - 1) * spread));
    const v = answer + (rng() < 0.5 ? -delta : delta);
    if (v >= 0 || answer < 0) set.add(v);
  }
  return shuffle(rng, [...set]);
}

function mathExpr(c, rng) {
  const L = c.L;
  const maxN = 8 + Math.floor(c.d * 92);
  const ops = ["+", "−"];
  if (L > 15) ops.push("×");
  if (L > 35) ops.push("÷");
  const op = pickOf(rng, ops);
  let a, b, val;
  if (op === "+") { a = randInt(rng, 1, maxN); b = randInt(rng, 1, maxN); val = a + b; }
  else if (op === "−") { a = randInt(rng, 2, maxN); b = randInt(rng, 1, a); val = a - b; }
  else if (op === "×") { const m = 4 + Math.floor(c.d * 11); a = randInt(rng, 2, m); b = randInt(rng, 2, m); val = a * b; }
  else { const m = 4 + Math.floor(c.d * 10); b = randInt(rng, 2, m); val = randInt(rng, 2, m); a = b * val; }
  let text = a + " " + op + " " + b;
  if (L > 60 && rng() < 0.6) {
    const k = randInt(rng, 1, 9 + Math.floor(c.d * 20));
    if (rng() < 0.5) { text += " + " + k; val += k; } else if (val - k >= 0) { text += " − " + k; val -= k; }
  }
  return { text, val };
}

          let seq = [];
          if (t === "add") { const a = randInt(r, 1, 20), s = randInt(r, 2, 4 + Math.floor(c.d * 12)); seq = range(len + 1).map(i => a + s * i); }
          else if (t === "sub") { const s = randInt(r, 2, 9), a = s * (len + 2) + randInt(r, 0, 30); seq = range(len + 1).map(i => a - s * i); }

      let vals = [], sel = new Set(), target = 0, round = 0, started = false, timer = null;
      const tiles = range(n).map(i => { const b = el("button", "tile"); b.type = "button"; b.addEventListener("click", () => tap(i)); grid.appendChild(b); return b; });
      const hud = () => { const sum = [...sel].reduce((a, i) => a + vals[i], 0); c.hud({ Target: target, Sum: sum, Round: Math.min(round + 1, rounds) + "/" + rounds }); };
      function newRound() {
        vals = range(n).map(() => randInt(c.rand, 1, maxV));

        target = pick.reduce((a, i) => a + vals[i], 0);

          timer.add(-2); c.sfx("bad"); c.shake();

          sel.clear(); hud();
        }
      }
      newRound();
      await c.ready("Pick tiles that add up to the target. <b>" + rounds + "</b> rounds in <b>" + limit + "s</b>. Going over costs 2 seconds.");
