// =====================================================================
// Game runs
// =====================================================================
let run = null;

function stopRun() {
  if (!run) return;
  const r = run;
  run = null;
  r.ended = true;
  cancelAnimationFrame(r.raf);
  r.timeouts.forEach(clearTimeout);
  r.cleanups.forEach(fn => { try { fn(); } catch (_) {} });
}

function startLevel(game, level) {
  stopRun();
  closeModal();
  const save = gs(game.id);
  level = clamp(level, 1, Math.min(MAX_LEVEL, save.unlocked));
  ui.game = game;

  save.plays++;
  store.recent = [game.id].concat(store.recent.filter(id => id !== game.id)).slice(0, 8);
  if (save.resume && save.resume.level !== level) save.resume = null;
  persist();

  const play = $("play");
  play.hidden = false;
  document.body.style.overflow = "hidden";
  play.style.setProperty("--accent", game.color);
  $("pIcon").textContent = game.icon;
  $("pIcon").style.setProperty("--c", game.color);
  $("pName").textContent = game.name;
  $("pLevel").textContent = "Level " + level + " · " + tierOf(level);

  const board = $("board"), hudEl = $("hud"), bannerEl = $("banner"), overlay = $("overlay"), timebar = $("timebar");
  board.innerHTML = "";
  board.className = "board";
  board.removeAttribute("style");
  hudEl.innerHTML = "";
  bannerEl.textContent = "";
  bannerEl.className = "banner";
  timebar.hidden = true;
  timebar.className = "timebar";
  overlay.hidden = true;
  overlay.innerHTML = "";

  const r = { ended: false, loops: new Set(), raf: 0, timeouts: [], cleanups: [], chips: {}, game, level, t0: Date.now() };
  run = r;

  let last = performance.now();
  const frame = now => {
    if (r.ended) return;
    const dt = Math.min(0.066, (now - last) / 1000);
    last = now;
    r.loops.forEach(fn => { if (fn(dt) === false) r.loops.delete(fn); });
    r.raf = requestAnimationFrame(frame);
  };
  r.raf = requestAnimationFrame(frame);

  const c = {
    game, level, L: level,
    d: (level - 1) / (MAX_LEVEL - 1),
    rng: mulberry32(hashStr(game.id) + level * 7919),
    rand: Math.random,
    board,
    resume: save.resume && save.resume.level === level ? save.resume.data : null,
    touch: isTouch(),

    alive: () => !r.ended && run === r,
    every(fn) { r.loops.add(fn); },
    after(ms, fn) { r.timeouts.push(setTimeout(() => { if (c.alive()) fn(); }, ms)); },
    wait(ms) { return new Promise(res => r.timeouts.push(setTimeout(res, ms))); },
    on(target, ev, fn, opt) { target.addEventListener(ev, fn, opt); r.cleanups.push(() => target.removeEventListener(ev, fn, opt)); },
    cleanup(fn) { r.cleanups.push(fn); },
    sfx(name) { if (SFX[name]) SFX[name](); },
    buzz,

    // +3 boxes every 5 levels
    boxes(start, cap = 64) { return Math.min(cap, start + 3 * Math.floor((level - 1) / 5)); },

    box(ar = 1) {
      const area = el("div", "gridarea");
      const bx = el("div", "gridbox");
      bx.style.setProperty("--ar", ar);
      area.appendChild(bx);
      board.appendChild(area);
      return bx;
    },

    grid(cols, rows) {
      const bx = c.box(cols / rows);
      bx.style.setProperty("--cols", cols);
      bx.style.setProperty("--rows", rows);
      const g = el("div", "grid");
      bx.appendChild(g);
      return g;
    },

    gridN(n, maxCols = 12) {
      const cols = Math.min(maxCols, Math.ceil(Math.sqrt(n)));
      const rows = Math.ceil(n / cols);
      return { grid: c.grid(cols, rows), cols, rows };
    },

    canvas(cls = "") {
      const cv = el("canvas", "scene " + cls);
      board.appendChild(cv);
      const g = cv.getContext("2d");
      const api = { cv, g, W: 1, H: 1, dpr: 1 };
      api.fit = () => {
        const rect = cv.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        api.W = Math.max(1, rect.width); api.H = Math.max(1, rect.height); api.dpr = dpr;
        cv.width = Math.round(api.W * dpr); cv.height = Math.round(api.H * dpr);
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (api.onResize) api.onResize();
      };
      api.pos = e => { const rect = cv.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; };
      api.fit();
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => api.fit());
        ro.observe(cv);
        r.cleanups.push(() => ro.disconnect());
      } else c.on(window, "resize", api.fit);
      return api;
    },

    keys() {
      const k = {};
      c.on(window, "keydown", e => { k[e.key.toLowerCase()] = true; if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault(); });
      c.on(window, "keyup", e => { k[e.key.toLowerCase()] = false; });
      c.on(window, "blur", () => { for (const key in k) k[key] = false; });
      return k;
    },

    controls(defs) {
      const row = el("div", "controls");
      const out = defs.map(([label, fn, cls]) => {
        const b = el("button", "btn ghost small " + (cls || ""), label);
        b.type = "button";
        b.addEventListener("click", () => { if (c.alive()) fn(b); });
        row.appendChild(b);
        return b;
      });
      board.appendChild(row);
      return out;
    },

    hud(obj) {
      for (const [key, value] of Object.entries(obj)) {
        let chip = r.chips[key];
        if (!chip) {
          chip = el("div", "hchip", "<small>" + key + "</small><b></b>");
          hudEl.appendChild(chip);
          r.chips[key] = chip;
        }
        const b = chip.lastElementChild;
        if (key === "Lives") {
          const max = Math.max(3, value);
          b.className = "hearts";
          b.innerHTML = range(max).map(i => '<i class="' + (i < value ? "" : "lost") + '">♥</i>').join("");
        } else if (b.textContent !== String(value)) b.textContent = value;
      }
    },

    banner(text, kind = "") {
      bannerEl.textContent = text;
      bannerEl.className = "banner " + kind;
      void bannerEl.offsetWidth;
      bannerEl.classList.add("flash");
    },

    shake() { board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake"); buzz(50); },

    countdown(total, onEnd) {
      let left = total, paused = false;
      timebar.hidden = false;
      const fill = timebar.firstElementChild;
      const api = {
        left: () => left,
        frac: () => left / total,
        pause(v) { paused = v; },
        add(s) {
          left = clamp(left + s, 0, total);
          if (s < 0) { timebar.classList.remove("hit"); void timebar.offsetWidth; timebar.classList.add("hit"); }
        }
      };
      c.every(dt => {
        if (!paused) left = Math.max(0, left - dt);
        fill.style.transform = "scaleX(" + left / total + ")";
        timebar.classList.toggle("low", left / total < 0.25);
        c.hud({ Time: Math.ceil(left) + "s" });
        if (left <= 0) { onEnd(); return false; }
      });
      return api;
    },

    stars(frac, a = 0.6, b = 0.3) { return frac >= a ? 3 : frac >= b ? 2 : 1; },
    ready(text) { return showReady(game, level, text, r); },
    saveProgress(data) { save.resume = { level, data }; persist(); },
    win(stars, note) { finish(r, true, clamp(stars, 1, 3), note || ""); },
    lose(reason) { finish(r, false, 0, reason || "Try again!"); }
  };

  try {
    const p = game.start(c);
    if (p && p.catch) p.catch(err => console.error(game.id, err));
  } catch (err) {
    console.error(game.id, err);
  }
}

function showReady(game, level, text, r) {
  const overlay = $("overlay");
  return new Promise(resolve => {
    overlay.innerHTML =
      '<div class="ocard"><div class="oicon">' + game.icon + '</div><div class="otier">' + tierOf(level) + " tier</div>" +
      "<h2>Level " + level + "</h2><p>" + text + '</p><button id="goBtn" class="btn big" type="button">▶ Start</button><br><button id="howBtn" class="linkbtn" type="button">❔ How to play</button></div>';
    overlay.hidden = false;
    const go = $("goBtn");
    go.focus({ preventScroll: true });
    go.addEventListener("click", () => {
      if (run !== r || r.ended) return;
      overlay.hidden = true;
      overlay.innerHTML = "";
      SFX.click();
      resolve();
    });
    $("howBtn").addEventListener("click", () => openHowTo(game));
  });
}

function finish(r, won, stars, note) {
  if (r.ended || run !== r) return;
  r.ended = true;
  cancelAnimationFrame(r.raf);
  r.timeouts.forEach(clearTimeout);
  r.cleanups.forEach(fn => { try { fn(); } catch (_) {} });

  const s = gs(r.game.id);
  const firstClear = won && !s.stars[r.level];
  const champion = won && r.level >= MAX_LEVEL && !s.done;
  const secs = Math.round((Date.now() - r.t0) / 1000);

  if (won) {
    s.wins++;
    s.stars[r.level] = Math.max(s.stars[r.level] || 0, stars);
    s.unlocked = Math.max(s.unlocked, Math.min(MAX_LEVEL, r.level + 1));
    if (r.level >= MAX_LEVEL) s.done = true;
  }
  s.resume = null;
  store.profile.playMs += secs * 1000;
  store.history.push({ t: Date.now(), g: r.game.id, L: r.level, w: won ? 1 : 0, s: won ? stars : 0, d: secs });
  if (store.history.length > 3000) store.history = store.history.slice(-3000);
  touchStreak();
  persist();

  const overlay = $("overlay");
  const lastLevel = r.level >= MAX_LEVEL;
  let html = "";

  if (champion) {
    SFX.champ();
    const allDone = GAMES.every(g => gs(g.id).done);
    html = '<div class="ocard win"><div class="oicon">🏆</div><div class="otier">Game complete</div>' +
      "<h2>Congratulations, " + esc(store.profile.name) + "!</h2>" +
      '<div class="ostars">' + [1, 2, 3].map(i => '<span class="on" style="animation-delay:' + (0.15 + i * 0.18) + 's">★</span>').join("") + "</div>" +
      "<p>You conquered every level of <b>" + esc(r.game.name) + "</b>. This game is now complete — you are a true " + TIERS[9] + " champion." +
      (allDone ? "<br><br><b>Incredible — you have completed every game in the arcade!</b>" : "") + "</p>" +
      '<div class="row"><button class="btn ghost" data-act="levels" type="button">☰ Levels</button><button class="btn" data-act="home" type="button">🏠 More games</button></div></div>';
  } else {
    won ? SFX.win() : SFX.lose();
    html = '<div class="ocard ' + (won ? "win" : "lose") + '"><div class="oicon">' + (won ? r.game.icon : "💥") + "</div>";
    html += '<div class="otier">Level ' + r.level + " · " + tierOf(r.level) + "</div>";
    if (won) {
      html += "<h2>" + (lastLevel ? "Champion again!" : "Level complete!") + "</h2>";
      html += '<div class="ostars">' + [1, 2, 3].map(i => '<span class="' + (i <= stars ? "on" : "") + '" style="animation-delay:' + (0.15 + i * 0.18) + 's">★</span>').join("") + "</div>";
      html += "<p>" + note + (firstClear && !lastLevel ? " · <b>Level " + (r.level + 1) + " unlocked</b>" : "") + "</p>";
    } else {
      html += "<h2>Mission failed</h2><p>" + note + "</p>";
    }
    html += '<div class="row"><button class="btn ghost" data-act="levels" type="button">☰ Levels</button>';
    html += '<button class="btn ' + (won && !lastLevel ? "ghost" : "") + '" data-act="retry" type="button">⟲ ' + (won ? "Replay" : "Retry") + "</button>";
    if (won && !lastLevel) html += '<button class="btn" data-act="next" type="button">Next ▶</button>';
    html += "</div></div>";
  }

  overlay.innerHTML = html;
  overlay.hidden = false;

  overlay.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
    SFX.click();
    const act = b.dataset.act;
    if (act === "levels") openHub(r.game);
    else if (act === "home") go("home");
    else if (act === "retry") startLevel(r.game, r.level);
    else startLevel(r.game, r.level + 1);
  }));

  const primary = overlay.querySelector('[data-act="next"]') || overlay.querySelector('[data-act="retry"]') || overlay.querySelector('[data-act="home"]');
  if (primary) primary.focus({ preventScroll: true });
  if (won) confetti(champion ? 160 : 70);
}

function confetti(n) {
  const overlay = $("overlay");
  const colors = ["#ffd27a", "#2ee6ff", "#ff3d81", "#8b5cf6", "#34f5a5", "#ff8a2b"];
  for (let i = 0; i < n; i++) {
    const p = el("i", "confetti");
    p.style.setProperty("--x", Math.random() * 100 + "%");
    p.style.setProperty("--col", colors[i % colors.length]);
    p.style.setProperty("--t", 1.6 + Math.random() * 1.8 + "s");
    p.style.setProperty("--dl", Math.random() * 0.6 + "s");
    overlay.appendChild(p);
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}

function rrect(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
}

const CAR_COLORS = ["#ff3d5e", "#2ea8ff", "#ffd23f", "#34f5a5", "#a66bff", "#ff8a2b", "#e9ecff", "#2b2f3d", "#ff5ad1", "#3a6b4a"];

// Rear view car sprite. x = centre, y = bottom, w = width in px
function drawCarRear(g, x, y, w, col, o = {}) {
  const h = w * 0.56;
  g.save();
  g.translate(x, y);
  if (o.tilt) g.rotate(o.tilt);
  g.fillStyle = "rgba(0,0,0,.38)";
  g.beginPath(); g.ellipse(0, -h * 0.02, w * 0.56, h * 0.12, 0, 0, TAU); g.fill();
  g.fillStyle = "#0d0f14";
  rrect(g, -w * 0.48, -h * 0.3, w * 0.17, h * 0.3, w * 0.03); g.fill();
  rrect(g, w * 0.31, -h * 0.3, w * 0.17, h * 0.3, w * 0.03); g.fill();
  const gr = g.createLinearGradient(0, -h * 0.66, 0, -h * 0.08);
  gr.addColorStop(0, shade(col, 45)); gr.addColorStop(0.5, col); gr.addColorStop(1, shade(col, -60));
  g.fillStyle = gr;
  rrect(g, -w * 0.5, -h * 0.66, w, h * 0.56, w * 0.09); g.fill();
  g.fillStyle = shade(col, -25);
  g.beginPath(); g.moveTo(-w * 0.38, -h * 0.64); g.lineTo(w * 0.38, -h * 0.64); g.lineTo(w * 0.29, -h * 0.98); g.lineTo(-w * 0.29, -h * 0.98); g.closePath(); g.fill();
  const wg = g.createLinearGradient(0, -h * 0.95, 0, -h * 0.66);
  wg.addColorStop(0, "#3d5a80"); wg.addColorStop(1, "#0b1422");
  g.fillStyle = wg;
  g.beginPath(); g.moveTo(-w * 0.32, -h * 0.68); g.lineTo(w * 0.32, -h * 0.68); g.lineTo(w * 0.25, -h * 0.93); g.lineTo(-w * 0.25, -h * 0.93); g.closePath(); g.fill();
  g.fillStyle = "rgba(255,255,255,.18)";
  g.beginPath(); g.moveTo(-w * 0.2, -h * 0.9); g.lineTo(-w * 0.05, -h * 0.9); g.lineTo(-w * 0.14, -h * 0.7); g.lineTo(-w * 0.27, -h * 0.7); g.closePath(); g.fill();
  g.shadowColor = "#ff2a3d"; g.shadowBlur = o.brake ? w * 0.25 : w * 0.1;
  g.fillStyle = o.brake ? "#ff6b78" : "#ff2a3d";
  rrect(g, -w * 0.46, -h * 0.56, w * 0.24, h * 0.1, h * 0.04); g.fill();
  rrect(g, w * 0.22, -h * 0.56, w * 0.24, h * 0.1, h * 0.04); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = "#11141c"; g.fillRect(-w * 0.42, -h * 0.24, w * 0.84, h * 0.08);
  g.fillStyle = "#e8ecff"; g.fillRect(-w * 0.09, -h * 0.4, w * 0.18, h * 0.1);
  if (o.police) {
    const on = Math.floor(o.t * 8) % 2;
    g.shadowBlur = w * 0.3;
    g.shadowColor = on ? "#ff2a3d" : "#2a7bff"; g.fillStyle = on ? "#ff2a3d" : "#552";
    g.fillRect(-w * 0.2, -h * 1.06, w * 0.18, h * 0.08);
    g.shadowColor = on ? "#552" : "#2a7bff"; g.fillStyle = on ? "#223" : "#2a7bff";
    g.fillRect(w * 0.02, -h * 1.06, w * 0.18, h * 0.08);
    g.shadowBlur = 0;
  }
  if (o.nitro) {
    const fl = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.2);
    fl.addColorStop(0, "rgba(255,255,255,.95)"); fl.addColorStop(0.3, "rgba(80,200,255,.9)"); fl.addColorStop(1, "rgba(40,80,255,0)");
    g.fillStyle = fl;
    [-0.3, 0.3].forEach(sx => { g.save(); g.translate(sx * w, -h * 0.16); g.scale(1, 1.4 + Math.random() * 0.8); g.beginPath(); g.arc(0, w * 0.08, w * 0.16, 0, TAU); g.fill(); g.restore(); });
  }
  g.restore();
}

const RACE_THEMES = {
  sunset: { sky: ["#1a0b3d", "#6b1f6b", "#ff5e62", "#ffb86b"], sun: "#ffd27a", grass: ["#1f5a46", "#1a4c3c"], rumble: ["#ff3d81", "#f4f6ff"], road: ["#3c3c4a", "#36364a"], lane: "#f4f6ff", fog: "#ff8a7a", far: "#3d1d5c", mid: "#2a1240" },
  night: { sky: ["#03040f", "#0b0a26", "#2a0d4a", "#4a1460"], sun: null, moon: true, grass: ["#14151f", "#11121b"], rumble: ["#2ee6ff", "#ff3d81"], road: ["#1d1e2b", "#1a1b27"], lane: "#ffd23f", fog: "#1a0b33", far: "#120a2a", mid: "#0b0618", neon: true },
  dusk: { sky: ["#1d1a4a", "#5a2a6e", "#ff7a5c", "#ffc28a"], sun: "#ffb86b", grass: ["#2f4a2a", "#2a4226"], rumble: ["#ff4d5e", "#f4f6ff"], road: ["#47474f", "#414149"], lane: "#f4f6ff", fog: "#ff9d7a", far: "#4a2a5c", mid: "#2a2440" },
  police: { sky: ["#010208", "#060a1f", "#0f1a40", "#1c2a5a"], sun: null, moon: true, grass: ["#0e1a14", "#0b1510"], rumble: ["#ff3d5e", "#3d8bff"], road: ["#26272f", "#23242b"], lane: "#f4f6ff", fog: "#0f1a40", far: "#0a1030", mid: "#060a1c", neon: true },
  desert: { sky: ["#2f6bd0", "#5a9ae6", "#ffd9a0", "#ffe9c4"], sun: "#fff4d6", grass: ["#d9a35f", "#cc9552"], rumble: ["#c0392b", "#f4f6ff"], road: ["#6b6b72", "#64646b"], lane: "#f4f6ff", fog: "#f5d7a8", far: "#c47a4a", mid: "#a65a35" }
};

async function racer3d(c, mode) {
  const L = c.L, d = c.d, rng = c.rng;
  const theme = RACE_THEMES[{ highway: "sunset", city: "night", street: "dusk", police: "police", canyon: "desert" }[mode]];
  const segL = 200, rumbleL = 3, roadW = 2000, camH = 1000;
  const camD0 = 1 / Math.tan((100 / 2) * Math.PI / 180);
  let camD = camD0;
  const playerZ = camH * camD0;
  const lanes = mode === "city" ? 4 : 3;
  const maxSpeed = segL * 60;
  const accel = maxSpeed / 4.5, breaking = -maxSpeed, decel = -maxSpeed / 5, offRoadDecel = -maxSpeed / 1.8, offRoadLimit = maxSpeed / 4;
  const drawDist = c.touch ? 140 : 180;
  const segments = [];
  const lastY = () => (segments.length ? segments[segments.length - 1].p2.world.y : 0);
  const pt = (y, z) => ({ world: { x: 0, y, z }, camera: {}, screen: {} });
  function addSegment(curve, y) {
    const n = segments.length;
    segments.push({ i: n, p1: pt(lastY(), n * segL), p2: pt(y, (n + 1) * segL), curve, sprites: [], cars: [], dark: Math.floor(n / rumbleL) % 2, clip: 0, looped: false, fog: 1 });
  }
  const easeIn = (a, b, p) => a + (b - a) * p * p;
  const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
  function addRoad(enter, hold, leave, curve, y) {
    const sy = lastY(), ey = sy + y * segL, tot = enter + hold + leave;
    for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(sy, ey, n / tot));
    for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(sy, ey, (enter + n) / tot));
    for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(sy, ey, (enter + hold + n) / tot));
  }

  const curvy = { highway: 0.55, city: 0.4, street: 0.7, police: 0.55, canyon: 1.1 }[mode];
  const hilly = { highway: 0.5, city: 0.15, street: 0.5, police: 0.35, canyon: 0.9 }[mode];
  const trackSegs = mode === "street" ? Math.round(900 + L * 9) : 1700;
  addRoad(40, 40, 40, 0, 0);
  while (segments.length < trackSegs) {
    const len = 20 + Math.floor(rng() * 45);
    const curve = (rng() < 0.5 ? -1 : 1) * (1.2 + rng() * 4.5) * curvy * (0.65 + d * 0.6);
    const hill = (rng() - 0.5) * 70 * hilly;
    if (rng() < 0.32) addRoad(len, len, len, 0, hill);
    else addRoad(len, len, len, curve, hill);
  }
  addRoad(50, 50, 50, 0, -lastY() / segL);
  const trackLength = segments.length * segL;

  // Scenery
  const addSprite = (n, s) => segments[n % segments.length].sprites.push(s);
  for (let n = 20; n < segments.length; n++) {
    const r = rng();
    if (n % 4 === 0) { addSprite(n, { type: "post", offset: -1.09, w: 70, h: 330 }); addSprite(n, { type: "post", offset: 1.09, w: 70, h: 330 }); }
    if (mode === "highway") {
      if (n % 7 === 0) addSprite(n, { type: "palm", offset: -1.35 - rng() * 0.6, w: 700, h: 1500 + rng() * 500 });
      if (n % 7 === 3) addSprite(n, { type: "palm", offset: 1.35 + rng() * 0.6, w: 700, h: 1500 + rng() * 500 });
      if (n % 60 === 30) addSprite(n, { type: "billboard", offset: (rng() < 0.5 ? -1 : 1) * 1.9, w: 1800, h: 1900, text: pickOf(rng, ["VICE BEACH", "NEON DRIVE", "MIND ARCADE", "SUNSET FM"]), hue: Math.floor(rng() * 360) });
      if (n % 25 === 12) addSprite(n, { type: "lamp", offset: -1.15, w: 300, h: 1700 });
    } else if (mode === "city") {
      if (n % 5 === 0) addSprite(n, { type: "tower", offset: -1.5 - rng() * 0.9, w: 1400 + rng() * 1200, h: 3000 + rng() * 5000, hue: Math.floor(rng() * 360), seed: rng() });
      if (n % 5 === 2) addSprite(n, { type: "tower", offset: 1.5 + rng() * 0.9, w: 1400 + rng() * 1200, h: 3000 + rng() * 5000, hue: Math.floor(rng() * 360), seed: rng() });
      if (n % 10 === 4) addSprite(n, { type: "lamp", offset: (n % 20 < 10 ? -1 : 1) * 1.12, w: 300, h: 1700 });
      if (n % 45 === 20) addSprite(n, { type: "billboard", offset: (rng() < 0.5 ? -1 : 1) * 1.6, w: 1600, h: 2600, text: pickOf(rng, ["NIGHT CITY", "CYBER CAFE", "HOTEL", "24/7", "CLUB NEON"]), hue: Math.floor(rng() * 360) });
    } else if (mode === "street") {
      if (n % 9 === 0) addSprite(n, { type: rng() < 0.6 ? "tree" : "tower", offset: -1.4 - rng() * 0.8, w: 900 + rng() * 600, h: 1400 + rng() * 2400, hue: Math.floor(rng() * 360), seed: rng() });
      if (n % 9 === 4) addSprite(n, { type: rng() < 0.6 ? "tree" : "tower", offset: 1.4 + rng() * 0.8, w: 900 + rng() * 600, h: 1400 + rng() * 2400, hue: Math.floor(rng() * 360), seed: rng() });
      if (n % 30 === 15) addSprite(n, { type: "lamp", offset: 1.12, w: 300, h: 1700 });
    } else if (mode === "police") {
      if (n % 11 === 0) addSprite(n, { type: "lamp", offset: -1.12, w: 300, h: 1700 });
      if (n % 11 === 5) addSprite(n, { type: "lamp", offset: 1.12, w: 300, h: 1700 });
      if (n % 6 === 2) addSprite(n, { type: "tree", offset: (r < 0.5 ? -1 : 1) * (1.6 + rng()), w: 900, h: 1600 });
    } else {
      if (n % 6 === 0) addSprite(n, { type: "cactus", offset: (r < 0.5 ? -1 : 1) * (1.25 + rng() * 1.3), w: 420, h: 900 + rng() * 500 });
      if (n % 13 === 5) addSprite(n, { type: "rock", offset: (rng() < 0.5 ? -1 : 1) * (1.6 + rng() * 1.6), w: 1600 + rng() * 1400, h: 1100 + rng() * 1300 });
    }
  }
  const startSeg = segments[Math.floor(playerZ / segL) + 2];
  if (mode === "street") {
    segments[Math.floor(playerZ / segL) + 4].finish = true;
    segments[segments.length - 4].finish = true;
  }
  void startSeg;

  // Traffic & rivals
  const cars = [];
  const density = { highway: 30 + L * 0.6, city: 45 + L * 0.5, street: 6 + L * 0.08, police: 34 + L * 0.6, canyon: 10 + L * 0.2 }[mode];
  for (let i = 0; i < Math.round(density); i++) {
    const lane = Math.floor(rng() * lanes);
    const offset = -1 + (2 * lane + 1) / lanes + (rng() - 0.5) * 0.1;
    const z = (Math.floor(rng() * segments.length) * segL + 3000) % trackLength;
    cars.push({ offset, z, speed: maxSpeed * (0.22 + rng() * 0.33), color: pickOf(rng, CAR_COLORS), passed: false, laneT: rng() * 10 });
  }
  const rivals = [];
  if (mode === "street") {
    const nR = 3 + Math.floor(L / 25);

        car.z = wrapZ(car.z + car.speed * dt);
        car.laneT -= dt;
        if (car.laneT <= 0 && c.L > 30) { car.laneT = 4 + rng() * 6; const lane = Math.floor(rng() * lanes); car.targetOff = -1 + (2 * lane + 1) / lanes; }
        if (car.targetOff != null) car.offset += (car.targetOff - car.offset) * Math.min(1, dt * 0.8);
        const rel = wrapZ(car.z - (position + playerZ));
        const ahead = rel < trackLength / 2;
        if (car.wasAhead && !ahead && trackLength - rel < 3000 && started) { overtakes++; nitro = Math.min(1, nitro + 0.08); if (mode === "city") { c.sfx("coin"); hud(); } }
        car.wasAhead = ahead;
      }
      findSeg(car.z).cars.push(car);
    }
    if (mode === "street") {
      for (const r of rivals) {
        const rs = findSeg(r.z);
        for (const o of rs.cars) {
          if (o !== r && !o.rival && r.speed > o.speed && overlap(r.offset, carW, o.offset, carW, 0.9)) r.offset += (r.offset > o.offset ? 1 : -1) * dt * 1.6;
        }
        r.offset = clamp(r.offset, -0.8, 0.8);
      }
    }

    if (!started || finished) return;
    if (mode === "police") {
      gap += ((speed - policeSpeed) / maxSpeed) * 240 / 3.6 * dt;
      gap = Math.min(gap, 220);
      if (gap <= 0) { finished = true; hud(); return c.lose("Busted! The police caught you."); }
    }
    hud();
    if ((mode === "highway" || mode === "canyon") && dist >= goalDist) { finished = true; return c.win(c.stars(timer.frac(), 0.25, 0.1), Math.round(timeLimit - timer.left()) + "s · " + (dist / 1000).toFixed(2) + " km"); }
    if (mode === "city" && overtakes >= needOver) { finished = true; return c.win(c.stars(timer.frac(), 0.3, 0.12), overtakes + " cars overtaken"); }
    if (mode === "street" && position + playerZ >= trackLength - 4 * segL && dist > trackLength * 0.003) {
      finished = true;
      const ahead = rivals.filter(r => r.dist >= trackLength - 4 * segL).length;
      if (ahead === 0) { const margin = Math.min(...rivals.map(r => trackLength - r.dist)); return c.win(margin > 6000 ? 3 : margin > 2000 ? 2 : 1, "1st place!"); }
      return c.lose("You finished #" + (ahead + 1) + " — you need 1st place.");
    }
  }

  function render(dt) {
    const g = cv.g, W = cv.W, H = cv.H;
    const speedPct = speed / maxSpeed;
    const baseSeg = findSeg(position);
    const basePct = pct(position, segL);
    const playerSeg = findSeg(position + playerZ);
    const playerPct = pct(position + playerZ, segL);
    const playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);
    let maxy = H, x = 0, dxs = -(baseSeg.curve * basePct);
    const horizon = H / 2 - (playerY * 0) ;
    camD = camD0 * (1 - 0.1 * speedPct - (usingNitro ? 0.06 : 0));
    const roll = -steerTilt * 0.6 * speedPct - playerSeg.curve * speedPct * 0.012;
    g.save();
    g.translate(W / 2, H * 0.75); g.rotate(roll); g.scale(1.07, 1.07); g.translate(-W / 2, -H * 0.75);
    drawBackground(g, W, H, H * 0.52);
    void horizon;
    const shakeY = crashT > 0 ? (Math.random() - 0.5) * 8 : usingNitro ? (Math.random() - 0.5) * 2 : 0;
    g.save(); g.translate(0, shakeY);
    for (let n = 0; n < drawDist; n++) {
      const seg = segments[(baseSeg.i + n) % segments.length];
      seg.looped = seg.i < baseSeg.i;
      seg.fog = 1 / Math.pow(Math.E, (n / drawDist) * (n / drawDist) * (theme.neon ? 4 : 3));
      seg.clip = maxy;
      const camZ = position - (seg.looped ? trackLength : 0);
      project(seg.p1, playerX * roadW - x, playerY + camH, camZ, W, H);
      project(seg.p2, playerX * roadW - x - dxs, playerY + camH, camZ, W, H);
      x += dxs; dxs += seg.curve;
      if (seg.p1.camera.z <= camD || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
      renderSegment(g, W, seg);
      maxy = seg.p1.screen.y;
    }
    for (let n = drawDist - 1; n > 0; n--) {
      const seg = segments[(baseSeg.i + n) % segments.length];
      if (seg.p1.camera.z <= camD) continue;
      for (const s of seg.sprites) {
        const sc = seg.p1.screen.scale;
        const sx = seg.p1.screen.x + sc * s.offset * roadW * W / 2;
        drawSprite(g, s, sx, seg.p1.screen.y, sc, W, seg.clip, seg.fog);
      }
      for (const car of seg.cars) {
        const p = pct(car.z, segL);
        const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, p);
        const cx = lerp(seg.p1.screen.x, seg.p2.screen.x, p) + sc * car.offset * roadW * W / 2;
        const cy = lerp(seg.p1.screen.y, seg.p2.screen.y, p);
        const cw = 560 * sc * W / 2;
        if (cw < 2 || cy - cw > seg.clip) continue;
        if (cy > seg.clip) { g.save(); g.beginPath(); g.rect(0, 0, W, seg.clip); g.clip(); }
        drawCarRear(g, cx, cy, cw, car.color, { brake: car.rival ? false : (car.speed < maxSpeed * 0.3) });
        if (car.rival && cw > 14) { g.fillStyle = "#fff"; g.font = "700 " + Math.max(10, cw * 0.18) + "px Rajdhani, sans-serif"; g.textAlign = "center"; g.fillText(car.name, cx, cy - cw * 0.66); }
        if (cy > seg.clip) g.restore();
      }
    }
    // player car — slides toward the steering side and leans into turns
    const pw = clamp(W * 0.26, 120, 300);
    const offroad = playerX < -1 || playerX > 1;
    const bounce = speed > 0 ? Math.sin(t * 40) * speedPct * (offroad ? 5 : 1.5) : 0;
    const carX = W / 2 + steerTilt * W * 1.2 + (crashT > 0 ? Math.sin(t * 60) * 6 : 0);
    const carY = H - 14 + bounce - (c.touch ? 100 : 0);
    const steering = Math.abs(steerTilt) > 0.045;
    if (started && !finished && speedPct > 0.5 && steering && fxp.length < 160) {
      for (const sx of [-0.36, 0.36]) fxp.push({ x: carX + sx * pw, y: carY - 6, vx: -steerTilt * 900 + (Math.random() - 0.5) * 60, vy: -20 - Math.random() * 40, t: 0, life: 0.7, r: pw * 0.06, col: "220,224,235" });
    }
    if (started && offroad && speed > offRoadLimit * 0.5 && fxp.length < 160) {
      for (const sx of [-0.4, 0.4]) fxp.push({ x: carX + sx * pw, y: carY - 4, vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 60, t: 0, life: 0.8, r: pw * 0.07, col: theme === RACE_THEMES.desert ? "200,150,90" : "120,105,80" });
    }
    for (let i = fxp.length - 1; i >= 0; i--) {
      const p = fxp[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = p.t / p.life;
      if (k >= 1) { fxp.splice(i, 1); continue; }
      g.fillStyle = "rgba(" + p.col + "," + 0.45 * (1 - k) + ")"; g.beginPath(); g.arc(p.x, p.y, p.r * (1 + k * 2.5), 0, TAU); g.fill();
    }
    drawCarRear(g, carX, carY, pw, mode === "police" ? "#ff3d81" : mode === "street" ? "#ffd23f" : "#ff3d5e", { tilt: steerTilt * 2.2, brake: input.brake || keys.arrowdown || keys.s, nitro: usingNitro });
    g.restore();
    g.restore();

    if (usingNitro || speed > maxSpeed * 0.9) {
      g.strokeStyle = "rgba(255,255,255," + (usingNitro ? 0.35 : 0.15) + ")"; g.lineWidth = 2;
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * TAU + t, r0 = Math.min(W, H) * (0.45 + Math.random() * 0.2);
        g.beginPath(); g.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0); g.lineTo(W / 2 + Math.cos(a) * (r0 + 60), H / 2 + Math.sin(a) * (r0 + 60)); g.stroke();
      }
    }
    if (mode === "police") {
      const k = clamp(1 - gap / 70, 0, 1);
      if (k > 0) {
        const on = Math.floor(t * 6) % 2;
        const lg = g.createRadialGradient(on ? 0 : W, H, 0, on ? 0 : W, H, W * 0.6);
        lg.addColorStop(0, (on ? "rgba(255,40,60," : "rgba(40,110,255,") + 0.55 * k + ")"); lg.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = lg; g.fillRect(0, 0, W, H);
      }
    }
    const prog = clamp(mode === "highway" || mode === "canyon" ? dist / goalDist : mode === "city" ? overtakes / needOver : mode === "police" ? (timer ? 1 - timer.frac() : 0) : (position + playerZ) / trackLength, 0, 1);
    const bw = Math.min(W * 0.46, 380), bx = W / 2 - bw / 2, by = 14;
    g.fillStyle = "rgba(6,8,20,.6)"; rrect(g, bx - 8, by - 6, bw + 16, 18, 9); g.fill();
    g.fillStyle = "rgba(255,255,255,.12)"; rrect(g, bx, by, bw, 6, 3); g.fill();
    const pg2 = g.createLinearGradient(bx, 0, bx + bw, 0); pg2.addColorStop(0, "#2ee6ff"); pg2.addColorStop(1, "#ff3d81");
    g.fillStyle = pg2; rrect(g, bx, by, Math.max(6, bw * prog), 6, 3); g.fill();
    if (mode === "street") rivals.forEach(r => { g.fillStyle = r.color; g.beginPath(); g.arc(bx + bw * clamp(r.dist / trackLength, 0, 1), by + 3, 4, 0, TAU); g.fill(); });
    g.fillStyle = "#fff"; g.beginPath(); g.arc(bx + bw * prog, by + 3, 5, 0, TAU); g.fill();
    if (cdText) {
      const big = Math.min(W, H) * 0.2;
      g.save(); g.textAlign = "center"; g.textBaseline = "middle";
      g.font = "900 " + Math.round(big) + "px Orbitron, sans-serif";
      g.shadowColor = cdText === "GO!" ? "#34f5a5" : "#ff3d5e"; g.shadowBlur = 40;
      g.fillStyle = cdText === "GO!" ? "#34f5a5" : "#fff";
      g.fillText(cdText, W / 2, H * 0.38);
      g.shadowBlur = 0;
      ["3", "2", "1"].forEach((n, i) => {
        const on = cdText === "GO!" ? "#34f5a5" : (Number(cdText) <= 3 - i ? "#ff3d5e" : "rgba(255,255,255,.12)");
        g.fillStyle = "rgba(6,8,20,.75)"; g.beginPath(); g.arc(W / 2 + (i - 1) * big * 0.42, H * 0.38 - big * 0.85, big * 0.16, 0, TAU); g.fill();
        g.fillStyle = on; g.beginPath(); g.arc(W / 2 + (i - 1) * big * 0.42, H * 0.38 - big * 0.85, big * 0.12, 0, TAU); g.fill();
      });
      g.restore();
    }
    drawSpeedo(g, W, H);
    if (mode === "street") {
      const ahead = rivals.filter(r => r.dist > position + playerZ).length;
      g.fillStyle = "rgba(6,8,20,.6)"; g.fillRect(12, 12, 110, 58);
      g.fillStyle = ahead === 0 ? "#ffd27a" : "#fff"; g.font = "900 34px Orbitron, sans-serif"; g.textAlign = "left"; g.textBaseline = "top";
      g.fillText((ahead + 1) + (["ST", "ND", "RD"][ahead] || "TH"), 22, 18);
    }
  }

  c.every(dt => {
    t += dt;
    update(dt);
    if (!c.alive()) return;
    render(dt);
    const sp = speed / maxSpeed;
    eng.set(52 + sp * 175 + (usingNitro ? 45 : 0) + Math.sin(t * 30) * 2, finished ? 0.012 : 0.028 + sp * 0.03);
  });

  const intro = {
    highway: "Drive <b>" + (goalDist / 1000).toFixed(1) + " km</b> down Vice Highway in <b>" + timeLimit + "s</b>. Weave through traffic — crashes slow you down.",
    city: "Overtake <b>" + needOver + "</b> cars in Neon City within <b>" + overTime + "s</b>. Each crash costs 2 seconds.",
    street: "Beat <b>" + rivals.length + "</b> street racers to the finish line. Only 1st place counts!",
    police: "Outrun the police for <b>" + surviveT + "s</b>. If the gap reaches 0 you're busted.",
    canyon: "Race <b>" + (goalDist / 1000).toFixed(1) + " km</b> through Red Canyon in <b>" + timeLimit + "s</b>. Stay on the road — rocks and cacti stop you dead."
  }[mode];
  await c.ready(intro + (c.touch ? "<br>◀ ▶ steer · BRAKE · NITRO boost." : "<br><b>←/→</b> steer · <b>↓</b> brake · <b>Space</b> nitro."));
  for (const n of ["3", "2", "1"]) { cdText = n; tone(440, 0.22, "square", 0.08); await c.wait(750); }
  cdText = "GO!"; tone(880, 0.45, "square", 0.09);
  started = true;
  c.banner("GO!", "good");
  c.after(800, () => { cdText = ""; });
  if (mode === "highway" || mode === "canyon") timer = c.countdown(timeLimit, () => { if (!finished) { finished = true; c.lose("Time's up — " + (dist / 1000).toFixed(2) + " km driven."); } });
  if (mode === "city") timer = c.countdown(overTime, () => { if (!finished) { finished = true; c.lose("Time's up — " + overtakes + " overtakes."); } });
  if (mode === "police") timer = c.countdown(surviveT, () => { if (!finished) { finished = true; c.win(c.stars(gap / 140, 0.6, 0.3), "Escaped with a " + Math.round(gap) + " m gap"); } });
}

// ---------------------------------------------------------------------
// Top-down city driving
// ---------------------------------------------------------------------
async function cityDrive(c, mode) {
  const L = c.L, d = c.d, rng = c.rng;
  const night = mode === "escape" || mode === "rally";
  const pal = night
    ? { asphalt: "#15161f", walk: "#24263a", ground: "#1b1d2b", park: "#12301f", line: "rgba(255,220,120,.55)", roofs: ["#2a2f4a", "#33294a", "#1f3446", "#3a2a3a"], wall: 0.45 }
    : { asphalt: "#3b3e48", walk: "#7b7f8c", ground: "#5a5e6b", park: "#2f6b3a", line: "rgba(255,255,255,.75)", roofs: ["#8a8fa6", "#a07e6a", "#6d7f99", "#9a8f7a", "#7d6b8a"], wall: 0.7 };

  const blocks = [], buildings = [], trees = [], parked = [];
  let MW, MH, block = 380, road = 170, nb = 0;
  let slot = null;

  if (mode === "park") {
    MW = 1100; MH = 900;
    const rowsN = 2 + Math.floor(L / 40);
    const slotW = 74 - d * 18, slotL = 100 - d * 18;
    const rowY = r => 160 + r * (MH - 320) / Math.max(1, rowsN - 1);
    const cols = Math.floor((MW - 200) / slotW);
    const pick = { r: Math.floor(rng() * rowsN), k: 2 + Math.floor(rng() * (cols - 4)) };
    for (let r = 0; r < rowsN; r++) for (let k = 0; k < cols; k++) {
      const x = 100 + k * slotW, y = rowY(r) - slotL / 2;
      if (r === pick.r && k === pick.k) { slot = { x, y, w: slotW, h: slotL, ang: Math.PI / 2 }; continue; }
      if (rng() < 0.15 + d * 0.75) parked.push({ x: x + slotW / 2, y: y + slotL / 2, a: Math.PI / 2 + (rng() < 0.5 ? 0 : Math.PI) + (rng() - 0.5) * 0.08, col: pickOf(rng, CAR_COLORS) });
    }
    if (L > 30) for (let i = 0; i < 2 + Math.floor(L / 25); i++) trees.push({ x: 120 + rng() * (MW - 240), y: rowY(Math.floor(rng() * rowsN)) + (rng() < 0.5 ? -1 : 1) * (slotL / 2 + 45), r: 10, cone: true });
  } else {
    nb = 4 + Math.floor(L / 20);
    MW = MH = nb * (block + road) + road;
    for (let by = 0; by < nb; by++) for (let bx = 0; bx < nb; bx++) {
      const x = road + bx * (block + road), y = road + by * (block + road);
      const type = rng() < 0.14 ? "park" : "city";
      blocks.push({ x, y, w: block, h: block, type });
      const m = 24, gap = 14, inner = block - m * 2;
      if (type === "park") {
        for (let k = 0; k < 6; k++) trees.push({ x: x + m + 20 + rng() * (inner - 40), y: y + m + 20 + rng() * (inner - 40), r: 16 + rng() * 10 });
        continue;
      }
      const pat = Math.floor(rng() * 4);
      const rects = pat === 0 ? [[0, 0, 1, 1]] : pat === 1 ? [[0, 0, 0.5, 1], [0.5, 0, 0.5, 1]] : pat === 2 ? [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]] : [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]];
      rects.forEach(([u, v, w, h]) => buildings.push({ x: x + m + u * inner + (u ? gap / 2 : 0), y: y + m + v * inner + (v ? gap / 2 : 0), w: w * inner - (w < 1 ? gap / 2 : 0), h: h * inner - (h < 1 ? gap / 2 : 0), height: 50 + rng() * 140, roof: pickOf(rng, pal.roofs), ac: range(randInt(rng, 0, 3)).map(() => [rng(), rng()]) }));
    }
  }

  const roadC = i => road / 2 + i * (block + road);
  const solids = mode === "park"
    ? [{ x: -40, y: -40, w: MW + 80, h: 40 }, { x: -40, y: MH, w: MW + 80, h: 40 }, { x: -40, y: 0, w: 40, h: MH }, { x: MW, y: 0, w: 40, h: MH }]
    : buildings.concat([{ x: -40, y: -40, w: MW + 80, h: 40 }, { x: -40, y: MH, w: MW + 80, h: 40 }, { x: -40, y: 0, w: 40, h: MH }, { x: MW, y: 0, w: 40, h: MH }]);

    const along = road + rng() * (MW - road * 2);
    return horiz ? { x: along, y: roadC(i) + (rng() - 0.5) * road * 0.5 } : { x: roadC(i) + (rng() - 0.5) * road * 0.5, y: along };
  };

  // Cars
  const mid = Math.floor(nb / 2);
  const player = { x: mode === "park" ? MW / 2 : roadC(mid) + road / 2 + block / 2, y: mode === "park" ? MH - 70 : roadC(mid) + road * 0.22, a: mode === "park" ? -Math.PI / 2 : 0, vx: 0, vy: 0, fwd: 0, hp: 100, hitT: 0 };
  const PL = 50, PWD = 25;
  const maxV = mode === "park" ? 260 : 560;

  const traffic = [];
  if (mode !== "park") {
    const nT = Math.round(nb * nb * (0.5 + d * 0.6) + (mode === "delivery" ? 6 : 0));
    for (let i = 0; i < nT; i++) {
      const horiz = rng() < 0.5, idx = Math.floor(rng() * (nb + 1));
      const dir = horiz ? (rng() < 0.5 ? 0 : 2) : (rng() < 0.5 ? 1 : 3);
      const along = road + rng() * (MW - road * 2);
      const tc = { dir, x: horiz ? along : roadC(idx), y: horiz ? roadC(idx) : along, v: 110 + rng() * 90 + d * 60, col: pickOf(rng, CAR_COLORS), lastI: -1 };

  }
  function laneSnap(tc) {
    const off = road * 0.22;
    if (tc.dir === 0) { tc.y = roadC(Math.round((tc.y - road / 2) / (block + road))) + off; }
    if (tc.dir === 2) { tc.y = roadC(Math.round((tc.y - road / 2) / (block + road))) - off; }
    if (tc.dir === 1) { tc.x = roadC(Math.round((tc.x - road / 2) / (block + road))) - off; }
    if (tc.dir === 3) { tc.x = roadC(Math.round((tc.x - road / 2) / (block + road))) + off; }
  }

  const police = [];
  const spawnPolice = () => {
    let p, tries = 0;

    police.push({ x: p.x, y: p.y, a: Math.atan2(player.y - p.y, player.x - p.x), vx: 0, vy: 0, fwd: 0, stuck: 0 });
  };
  if (mode === "escape") for (let i = 0; i < 1 + Math.floor(L / 15); i++) spawnPolice();

  // Objectives
  let targets = [], fare = 0, carrying = false, delivered = 0, need = 0;
  const icons = { taxi: "🧍", rally: "🏁", delivery: "📦" };
  const sidewalkPoint = () => {
    const b = blocks.filter(bl => bl.type === "city")[Math.floor(rng() * blocks.filter(bl => bl.type === "city").length)] || blocks[0];
    const side = Math.floor(rng() * 4), u = 0.15 + rng() * 0.7;
    return side === 0 ? { x: b.x + u * b.w, y: b.y - 26 } : side === 1 ? { x: b.x + b.w + 26, y: b.y + u * b.h } : side === 2 ? { x: b.x + u * b.w, y: b.y + b.h + 26 } : { x: b.x - 26, y: b.y + u * b.h };
  };
  if (mode === "taxi") { need = 3 + Math.floor(L / 20); targets = [{ ...sidewalkPoint(), kind: "pickup" }]; }
  if (mode === "rally") { need = 4 + Math.floor(L / 12); for (let i = 0; i < need; i++) { let p; do { p = randomRoadPoint(); } while (targets.length && Math.hypot(p.x - targets[targets.length - 1].x, p.y - targets[targets.length - 1].y) < 500); targets.push({ ...p, kind: "check" }); } }
  if (mode === "delivery") { need = 5 + Math.floor(L / 10); for (let i = 0; i < need; i++) targets.push({ ...randomRoadPoint(), kind: "box" }); }

  const timeLimit = mode === "taxi" ? Math.round(need * (32 - d * 12) + 10)
    : mode === "rally" ? Math.round(need * (11 - d * 4) + 10)
    : mode === "delivery" ? Math.round(need * (10 - d * 3.6) + 12)
    : mode === "park" ? Math.round(45 - d * 18)
    : Math.round(40 + L * 0.5);

  let started = false, finished = false, t = 0, strikes = 0, parkHold = 0, timer = null;
  const parts = [];
  const cv = c.canvas();
  const keys = c.keys();
  const input = { jx: 0, jy: 0, brake: false, touch: c.touch };

  // Touch UI: joystick + brake
  const pad = el("div", "touchpad");
  pad.innerHTML = '<div class="stick-base"><div class="stick-knob"></div></div><div class="abtn fire" style="font-size:14px">BRAKE<br>/ REV</div>';
  c.board.style.position = "relative";
  c.board.appendChild(pad);
  const base = pad.querySelector(".stick-base"), knob = pad.querySelector(".stick-knob"), brakeB = pad.querySelector(".fire");
  let sid = null;
  const setStick = e => {
    const r = base.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);

  function impact(dmg, at) {

  const hud = () => {

  function currentTarget() {

  function update(dt) {

    });

    // traffic
    traffic.forEach(tc => {
      const block2 = block + road;
      const blockedAhead = Math.hypot(player.x - (tc.x + [1, 0, -1, 0][tc.dir] * 50), player.y - (tc.y + [0, 1, 0, -1][tc.dir] * 50)) < 40;
      const v = blockedAhead ? 0 : tc.v;

  function drawCarTop(g, car, col, o = {}) {

  function render(dt) {
    const g = cv.g, W = cv.W, H = cv.H;

    const scale = clamp(Math.min(W, H) / (mode === "park" ? 560 : 640), 0.6, 1.3) * (1 - Math.min(0.16, sp / maxV * 0.16));
    const camX = player.x + player.vx * 0.25, camY = player.y + player.vy * 0.25;

    cam.x += (camX - cam.x) * Math.min(1, dt * 5); cam.y += (camY - cam.y) * Math.min(1, dt * 5);

    }

    // targets
    const ct = currentTarget();
    const drawMarker = (tg, icon, col, main) => {
      const pulse = 1 + 0.15 * Math.sin(t * 5);
      g.fillStyle = col.replace("1)", ".18)"); g.strokeStyle = col; g.lineWidth = 4;
      g.beginPath(); g.arc(tg.x, tg.y, 46 * pulse, 0, TAU); g.fill(); g.stroke();
      if (main) { g.save(); g.globalCompositeOperation = "lighter"; const bg = g.createLinearGradient(tg.x, tg.y - 220, tg.x, tg.y); bg.addColorStop(0, "rgba(0,0,0,0)"); bg.addColorStop(1, col.replace("1)", ".35)")); g.fillStyle = bg; g.fillRect(tg.x - 10, tg.y - 220, 20, 220); g.restore(); }
      g.font = "30px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(icon, tg.x, tg.y);

    if (mode === "taxi") drawMarker(targets[0], carrying ? "🏁" : "🧍", carrying ? "rgba(52,245,165,1)" : "rgba(255,210,63,1)", true);

    if (mode !== "park") {
      const vis = buildings.filter(b => b.x < vx1 && b.x + b.w > vx0 && b.y < vy1 && b.y + b.h > vy0);
      vis.sort((a, b) => Math.hypot(b.x + b.w / 2 - cam.x, b.y + b.h / 2 - cam.y) - Math.hypot(a.x + a.w / 2 - cam.x, a.y + a.h / 2 - cam.y));
      vis.forEach(b => {
        const k = b.height * 0.0024;
        const ox = (b.x + b.w / 2 - cam.x) * k, oy = (b.y + b.h / 2 - cam.y) * k;
        const B = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
        const R = B.map(([x, y]) => [x + ox, y + oy]);
        const normals = [[0, -1], [1, 0], [0, 1], [-1, 0]];
        g.fillStyle = "rgba(0,0,0,.35)";
        g.beginPath(); B.forEach(([x, y], i) => (i ? g.lineTo(x + 14, y + 16) : g.moveTo(x + 14, y + 16))); g.closePath(); g.fill();
        for (let i = 0; i < 4; i++) {
          const [nx, ny] = normals[i];
          if (nx * ox + ny * oy >= 0) continue;
          const j = (i + 1) % 4;
          g.fillStyle = shade(b.roof, Math.round(-70 * pal.wall - i * 6));
          g.beginPath(); g.moveTo(B[i][0], B[i][1]); g.lineTo(B[j][0], B[j][1]); g.lineTo(R[j][0], R[j][1]); g.lineTo(R[i][0], R[i][1]); g.closePath(); g.fill();
          if (night) {
            g.fillStyle = "rgba(255,210,120,.55)";
            const steps = 5;
            for (let s = 1; s < steps; s++) for (let f = 1; f < 4; f++) {
              if (((s * 7 + f * 3 + Math.round(b.x)) % 5) < 2) continue;
              const u = s / steps, v = f / 4;
              const px = lerp(lerp(B[i][0], B[j][0], u), lerp(R[i][0], R[j][0], u), v), py = lerp(lerp(B[i][1], B[j][1], u), lerp(R[i][1], R[j][1], u), v);
              g.fillRect(px - 2, py - 2, 4, 4);
            }
          }
        }
        const rg = g.createLinearGradient(R[0][0], R[0][1], R[2][0], R[2][1]);
        rg.addColorStop(0, shade(b.roof, 25)); rg.addColorStop(1, shade(b.roof, -15));
        g.fillStyle = rg;
        g.beginPath(); R.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
        g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 2; g.stroke();
        g.fillStyle = "rgba(0,0,0,.22)";
        b.ac.forEach(([u, v]) => g.fillRect(R[0][0] + 14 + u * (b.w - 46), R[0][1] + 14 + v * (b.h - 46), 18, 14));
      });
    }

    parts.forEach(p => { g.fillStyle = "rgba(" + p.c + "," + Math.max(0, 1 - p.t / p.life) + ")"; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); });
    g.restore();

    // arrow to target
    if (ct) {
      const sx = (ct.x - cam.x) * scale + W / 2, sy = (ct.y - cam.y) * scale + H / 2;
      if (sx < 30 || sx > W - 30 || sy < 30 || sy > H - 30) {
        const a = Math.atan2(sy - H / 2, sx - W / 2);
        const ex = clamp(W / 2 + Math.cos(a) * W, 44, W - 44), ey = clamp(H / 2 + Math.sin(a) * H, 44, H - 44);
        g.save(); g.translate(ex, ey); g.rotate(a);
        g.fillStyle = "#ffd23f"; g.shadowColor = "#ffd23f"; g.shadowBlur = 14;
        g.beginPath(); g.moveTo(20, 0); g.lineTo(-12, -14); g.lineTo(-4, 0); g.lineTo(-12, 14); g.closePath(); g.fill();
        g.restore();
        g.fillStyle = "#fff"; g.font = "700 12px Rajdhani, sans-serif"; g.textAlign = "center";
        g.fillText(Math.round(Math.hypot(ct.x - player.x, ct.y - player.y) / 10) + " m", ex, ey + 28);
      }
    }

    // minimap
    if (mode !== "park") {
      const mm = Math.min(140, Math.min(W, H) * 0.26), mx0 = W - mm - 12, my0 = 12, ms = mm / MW;
      g.fillStyle = "rgba(6,8,20,.8)"; g.fillRect(mx0 - 4, my0 - 4, mm + 8, mm + 8);
      g.fillStyle = pal.asphalt; g.fillRect(mx0, my0, mm, mm);
      g.fillStyle = night ? "#2a2c40" : "#8a8ea0"; blocks.forEach(b => g.fillRect(mx0 + b.x * ms, my0 + b.y * ms, b.w * ms, b.h * ms));
      const dot = (x, y, col, r = 3) => { g.fillStyle = col; g.beginPath(); g.arc(mx0 + x * ms, my0 + y * ms, r, 0, TAU); g.fill(); };
      if (mode === "taxi") dot(targets[0].x, targets[0].y, carrying ? "#34f5a5" : "#ffd23f", 4);
      if (mode === "rally" && targets[delivered]) dot(targets[delivered].x, targets[delivered].y, "#2ee6ff", 4);
      if (mode === "delivery") targets.forEach(tg => dot(tg.x, tg.y, "#ff8a2b"));
      police.forEach(p => dot(p.x, p.y, Math.floor(t * 6) % 2 ? "#ff2a3d" : "#2a7bff"));
      g.save(); g.translate(mx0 + player.x * ms, my0 + player.y * ms); g.rotate(player.a);
      g.fillStyle = "#fff"; g.beginPath(); g.moveTo(6, 0); g.lineTo(-4, -4); g.lineTo(-4, 4); g.closePath(); g.fill(); g.restore();
    }

    // speed
    const kmh = Math.round(Math.abs(player.fwd) / maxV * (mode === "park" ? 60 : 180));
    g.fillStyle = "rgba(6,8,20,.65)"; rrect(g, 12, c.touch ? 12 : H - 62, 150, 50, 12); g.fill();
    g.fillStyle = "#fff"; g.font = "900 26px Orbitron, sans-serif"; g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText(kmh, 24, (c.touch ? 12 : H - 62) + 25);
    g.fillStyle = "#8a92b9"; g.font = "700 12px Rajdhani, sans-serif"; g.fillText("KM/H" + (player.fwd < -5 ? "  R" : ""), 90, (c.touch ? 12 : H - 62) + 27);
  }

  c.every(dt => {
    t += dt;
    update(dt);
    if (!c.alive()) return;
    render(dt);
  });

  const intro = {
    taxi: "Pick up <b>" + need + "</b> passengers 🧍 and drive each one to the 🏁. Stop next to them to load up.",
    escape: "Survive <b>" + timeLimit + "s</b> with <b>" + police.length + "</b> police cars chasing you. Don't let your car get wrecked!",
    park: "Park in the glowing <b>P</b> spot. Line up straight and stop inside. 3 scratches and you fail.",
    rally: "Drive through <b>" + need + "</b> checkpoints 🏁 in order across the night city.",
    delivery: "Collect all <b>" + need + "</b> packages 📦 around the city before time runs out."
  }[mode];
  await c.ready(intro + (c.touch ? "<br>Joystick steers & drives · BRAKE / reverse." : "<br><b>↑</b> gas · <b>↓</b> brake / reverse · <b>←/→</b> steer."));
  started = true;
  c.banner("GO!", "good");
  timer = c.countdown(timeLimit, () => {
    if (finished) return;
    finished = true;
    if (mode === "escape") c.win(c.stars(player.hp / 100, 0.6, 0.3), "Escaped with " + Math.round(player.hp) + "% car health");
    else c.lose("Time's up!");
  });
}

  const enemies = [], shots = [], parts = [], pickups = [];
  let tx = null, ty = null, started = false, t = 0, kills = 0, spawnT = 1.2, scroll = 0, bossObj = null, finished = false, dmgFlash = 0, gunTick = 0;
  let W = cv.W, H = cv.H, s = 1, groundY = 0;

  const hud = () => c.hud(boss ? { Target: bossObj && !bossObj.dead ? Math.ceil((bossObj.hp / bossObj.max) * 100) + "%" : "Incoming", Armor: Math.max(0, Math.round(P.hp)) + "%" } : { Kills: kills + "/" + need, Armor: Math.max(0, Math.round(P.hp)) + "%" });

  // ----- effects

  function enemyShot(e, x, y, ang, speed, dmg, k = "b") {

  }

  // ----- spawning
  const kinds = ["drone", "drone"];

  if (L > 35) kinds.push("heli");

  // ----- terrain
  const farH = x => 0.55 + 0.22 * Math.sin(x * 0.0035 + 1.3) + 0.14 * Math.sin(x * 0.0091 + 2.1) + 0.09 * Math.sin(x * 0.023);
  const midH = x => 0.5 + 0.25 * Math.sin(x * 0.006 + 0.4) + 0.15 * Math.sin(x * 0.017 + 1.7);

  function drawWorld(g, dt) {

    sky.sky.forEach((col, i) => sg.addColorStop(i / (sky.sky.length - 1), col));
    g.fillStyle = sg; g.fillRect(0, 0, W, groundY + 2);
    if (sky.moon) {

      g.fillStyle = "#e9eeff"; g.shadowColor = "#cfe0ff"; g.shadowBlur = 40;
      g.beginPath(); g.arc(W * 0.8, H * 0.16, 26 * s, 0, TAU); g.fill(); g.shadowBlur = 0;

    g.fillStyle = sky.far;
    g.beginPath(); g.moveTo(0, groundY);
    for (let x = 0; x <= W + 24; x += 24) g.lineTo(x, groundY - H * 0.34 * farH((x + scroll * 0.12) / s));

    midC.draw(g, W, H);
    g.fillStyle = sky.mid;
    g.beginPath(); g.moveTo(0, groundY);
    for (let x = 0; x <= W + 16; x += 16) g.lineTo(x, groundY - H * 0.16 * midH((x + scroll * 0.4) / s));
    g.lineTo(W, groundY); g.closePath(); g.fill();
    const tw = 34 * s, toff = (scroll * 0.4) % tw;

      g.beginPath(); g.moveTo(x, by + 2); g.lineTo(x + tw * 0.35, by - (14 + h * 22) * s); g.lineTo(x + tw * 0.7, by + 2); g.closePath(); g.fill();

    const dash = 70 * s, doff = scroll % (dash * 2);

    for (let x = -doff; x < W; x += dash * 2) g.fillRect(x, groundY + (H - groundY) * 0.58, dash, 3 * s);
    const bw = 120 * s, boff = scroll % bw;

    g.fillStyle = "#8a5a2b"; g.fillRect(-10 * s, 6 * s, 20 * s, 16 * s);
    g.font = 14 * s + "px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(p.type === "repair" ? "🔧" : "🚀", 0, 14 * s);
    g.restore();
  }

  // ----- main loop
  c.every(dt => {
    t += dt;
    if (cv.W !== W || cv.H !== H) layout();
    const g = cv.g;
    const gS = (150 + 50 * d) * s;
    scroll += gS * dt;
    backC.update(dt, 0.4); midC.update(dt, 0.4); frontC.update(dt, 0.4);

    // player control
    const maxV = 540 * s;
    let kx = 0, ky = 0;
    if (keys.a || keys.arrowleft) kx -= 1;
    if (keys.d || keys.arrowright) kx += 1;
    if (keys.w || keys.arrowup) ky -= 1;
    if (keys.s || keys.arrowdown) ky += 1;
    if ((keys[" "] || keys.e) && started) fireMissiles();
    if (P.alive) {
      if (kx || ky) { P.vx = lerp(P.vx, kx * maxV, Math.min(1, dt * 6)); P.vy = lerp(P.vy, ky * maxV, Math.min(1, dt * 6)); tx = null; }
      else if (tx != null) { P.vx = lerp(P.vx, clamp((tx - P.x) * 5, -maxV, maxV), Math.min(1, dt * 7)); P.vy = lerp(P.vy, clamp((ty - P.y) * 5, -maxV, maxV), Math.min(1, dt * 7)); }

    } else {

      if (Math.random() < 0.6) parts.push({ k: "smoke", x: P.x, y: P.y, vx: -gS * 0.3, vy: -30 * s, t: 0, life: 1.4, r: 16 * s });
    }
    P.hit = Math.max(0, P.hit - dt * 4);
    P.mslCd -= dt;
    if (P.msl < 6) { P.mslT += dt; if (P.mslT > 3.6 - d * 1.2) { P.mslT = 0; P.msl++; mslN.textContent = P.msl; } }
    eng.set(P.alive ? 46 + Math.hypot(P.vx, P.vy) / maxV * 30 + Math.sin(t * 50) * 4 : 30, P.alive ? 0.045 : 0.0);

    // auto gun
    P.gunCd -= dt; P.flash = Math.max(0, P.flash - dt);
    if (started && P.alive && !finished && P.gunCd <= 0) {

      const ca = Math.cos(P.tilt), sa = Math.sin(P.tilt);
      const gx = P.x + (52 * ca - 13 * sa) * s, gy = P.y + (52 * sa + 13 * ca) * s;
      let a = P.tilt * 0.6, best = null, bd = 1e12;
      for (const e of enemies) {

        const dx = e.x - gx, dy = e.y - gy;

        const ang = Math.atan2(dy, dx);
        if (Math.abs(ang) > 0.85) continue;
        const dd = dx * dx + dy * dy;
        if (dd < bd) { bd = dd; best = e; }
      }
      if (best) { const tt = Math.sqrt(bd) / (1500 * s); a = Math.atan2(best.y + (best.vy || 0) * tt - gy, best.x + ((best.vx || 0) - (best.kind === "tank" || best.kind === "aa" ? gS : 0)) * tt - gx); }
      a += (Math.random() - 0.5) * 0.045;

    }

    // spawning
    if (started && !finished) {

      const alive = enemies.filter(e => !e.dead && !e.falling && e.kind !== "boss").length;
      if (spawnT <= 0 && alive < 2 + Math.floor(d * 5)) { spawn(pickOf(rng, kinds)); spawnT = (1.5 - d * 0.85) * (0.6 + rng() * 0.8); }
      if (boss && !bossObj && t > 7) { bossObj = spawn("boss"); c.banner("⚠ BOSS GUNSHIP INBOUND", "bad"); tone(220, 0.6, "sawtooth", 0.06); tone(180, 0.6, "sawtooth", 0.06, 0, 0.6); hud(); }
    }

    // enemies
    for (const e of enemies) {
      if (e.dead) { if (e.wreck) e.x -= gS * dt; continue; }

        if (Math.random() < 0.7) parts.push({ k: "smoke", x: e.x, y: e.y, vx: 0, vy: -20 * s, t: 0, life: 1.6, r: 14 * s });
        if (e.y >= groundY - 10 * s) { e.dead = true; e.wreck = e.kind !== "jet"; e.y = groundY - 6 * s; boom(e.x, e.y, e.kind === "boss" ? 2.5 : 1); }
        continue;
      }
      const dxp = P.x - e.x, dyp = P.y - e.y, aimP = Math.atan2(dyp, dxp);

      } else if (e.kind === "heli") {

        e.y = clamp(e.y, 60 * s, groundY - 90 * s);
        if (e.fireCd <= 0 && e.burst === 0 && e.x < W - 30 * s) { e.burst = 3 + Math.floor(d * 3); e.bcd = 0; }
        if (e.burst > 0) { e.bcd -= dt; if (e.bcd <= 0) { e.bcd = 0.12; e.burst--; enemyShot(e, e.x - 46 * s, e.y + 12 * s, aimP + (rng() - 0.5) * (0.16 - 0.1 * d), (420 + 300 * d) * s, 5 + 5 * d); noise(0.04, 0.025); if (!e.burst) e.fireCd = (1.8 + rng() * 1.2) * (1.25 - d * 0.6); } }
      } else if (e.kind === "jet") {
        e.x += e.vx * dt;
        if (!e.fired && e.x < W * 0.9) { e.fired = true; shots.push({ k: "emsl", from: "e", x: e.x - 30 * s, y: e.y + 10 * s, a: Math.PI, sp: (380 + 160 * d) * s, dmg: 14 + 10 * d, life: 4.5, hp: 1 }); tone(500, 0.3, "sawtooth", 0.04, -300); }
        if (e.x < -200 * s) e.dead = true;
      } else if (e.kind === "tank" || e.kind === "aa") {
        e.x -= gS * dt; if (e.own) e.x += e.own * dt;
        e.aim = rotTo(e.aim, Math.atan2(dyp + 30 * s, dxp), dt * 2);
        if (e.kind === "tank" && e.fireCd <= 0 && e.x < W - 20 * s && e.x > 20 * s) { e.fireCd = (2.4 + rng()) * (1.25 - d * 0.55); enemyShot(e, e.x - 2 * s + Math.cos(e.aim) * 46 * s, e.y - 32 * s + Math.sin(e.aim) * 46 * s, e.aim + (rng() - 0.5) * 0.1, (440 + 220 * d) * s, 10 + 7 * d, "flak"); tone(110, 0.15, "square", 0.04); }

        e.y = clamp(e.y, 110 * s, groundY - 140 * s);

    }

function makeWaterPattern(g) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 256;
  const x = cv.getContext("2d");
  const r = mulberry32(77);
  for (let i = 0; i < 120; i++) {
    const px = r() * 256, py = r() * 256, w = 10 + r() * 34;
    x.strokeStyle = "rgba(190,230,255," + (0.08 + r() * 0.16) + ")";
    x.lineWidth = 1 + r() * 1.6;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + w / 2, py - 4 - r() * 4, px + w, py); x.stroke();
  }
  return g.createPattern(cv, "repeat");
}

async function vehicleWar(c, mode) {

      islands.push({ x, y, r, pts, palms: range(5 + Math.floor(rng() * 6)).map(() => { const a = rng() * TAU, rr = Math.sqrt(rng()) * r * 0.6; return [Math.cos(a) * rr, Math.sin(a) * rr, 10 + rng() * 8]; }) });
      circles.push({ x, y, r: r * 0.96, hard: false });

    }
  } else {
    for (let i = 0; i < 3; i++) {
      const horiz = i % 2 === 0, at = MW * (0.2 + rng() * 0.6);
      roads.push(horiz ? [[0, at], [MW * 0.33, at + (rng() - 0.5) * 300], [MW * 0.66, at + (rng() - 0.5) * 300], [MW, at]] : [[at, 0], [at + (rng() - 0.5) * 300, MH * 0.33], [at + (rng() - 0.5) * 300, MH * 0.66], [at, MH]]);
    }
    const overl = (x, y, w, h, m) => rects.some(q => x < q.x + q.w + m && x + w + m > q.x && y < q.y + q.h + m && y + h + m > q.y) || circles.some(o => o.x > x - o.r - m && o.x < x + w + o.r + m && o.y > y - o.r - m && o.y < y + h + o.r + m);

      if (overl(x, y, w, h, 120) || (Math.abs(x + w / 2 - MW / 2) < 260 && y + h > MH - 520)) continue;

  };
  const roster = ocean
    ? [["boat", 1], ["destroyer", L > 4 ? 1 : 0], ["heli", L > 9 ? 0.8 : 0], ["sub", L > 16 ? 0.7 : 0], ["jet", L > 26 ? 0.6 : 0], ["shore", 0.55]]
    : [["infantry", 1.1], ["tank", 1], ["apc", L > 6 ? 0.8 : 0], ["heli", L > 11 ? 0.8 : 0], ["artillery", L > 19 ? 0.5 : 0], ["jet", L > 28 ? 0.6 : 0]];
  const pickKind = () => { const tot = roster.reduce((a, [, w]) => a + w, 0); let x = rng() * tot; for (const [k, w] of roster) { x -= w; if (x <= 0) return k; } return roster[0][0]; };

  const P = { kind: ocean ? "ship" : "tank", team: "p", x: MW / 2, y: MH - 260, a: -Math.PI / 2, ta: -Math.PI / 2, v: 0, hp: 100, max: 100, r: ocean ? 30 : 24, reload: 0, mg: 0, mgT: null, spec: ocean ? 3 : 2, specT: 0, hit: 0, alive: true, tread: 0, recoil: 0, deathT: 0 };
  if (blockedAt(P.x, P.y, P.r + 6)) { const p = freeSpot(P.r, (x, y) => y > MH * 0.7); P.x = p.x; P.y = p.y; }

  const units = [], proj = [], fx = [], decals = [], foam = [], pickups = [], wrecks = [], strikes = [];
  let spawned = 0, kills = 0, started = false, finished = false, t = 0, dmgFlash = 0, shake = 0, spawnT = 2;
  const mouse = { x: null, y: null, down: false };
  const input = { jx: 0, jy: 0, fire: false, touch: c.touch };

  function makeUnit(kind, x, y) {
    const df = DEF[kind];
    const u = {
      kind, team: "e", x, y, a: rng() * TAU, ta: rng() * TAU, v: 0, r: df.r, air: !!df.air, def: df,
      hp: Math.round(df.hp * (1 + 0.7 * d)), reload: df.reload * (0.5 + rng() * 0.6), burst: 0, bcd: 0, salvo: 0,
      dmg: df.dmg * (1 + 0.6 * d), spread: (df.spread || 0.1) * (1 - 0.65 * d), rel: df.reload * (1 - 0.45 * d),
      alert: false, side: rng() < 0.5 ? 1 : -1, sideT: 2, stuck: 0, hit: 0, tread: 0, recoil: 0, dive: false, subT: 3 + rng() * 3, orb: rng() * TAU, alt: kind === "jet" ? 120 : 70, dropped: false, wx: null, wy: null
    };
    u.max = u.hp;
    if (kind === "jet") { const side = Math.floor(rng() * 4); u.x = side === 0 ? -200 : side === 1 ? MW + 200 : rng() * MW; u.y = side === 2 ? -200 : side === 3 ? MH + 200 : rng() * MH; u.a = Math.atan2(P.y - u.y, P.x - u.x); u.v = df.speed; }
    units.push(u);
    return u;
  }

  function spawnOne(initial) {
    if (spawned >= need) return;
    const kind = pickKind();
    const far = (x, y) => Math.hypot(x - P.x, y - P.y) > (initial ? 700 : 820);
    if (kind === "shore") {
      const isl = islands.filter(o => Math.hypot(o.x - P.x, o.y - P.y) > 700);
      if (!isl.length) return spawnOne(initial);
      const o = pickOf(rng, isl), a = rng() * TAU;
      const u = makeUnit("shore", o.x + Math.cos(a) * o.r * 0.55, o.y + Math.sin(a) * o.r * 0.55);
      u.onIsland = o; spawned++; return;
    }
    if (kind === "heli") { const p = { x: rng() < 0.5 ? 40 : MW - 40, y: 80 + rng() * (MH - 160) }; makeUnit("heli", p.x, p.y); spawned++; return; }
    if (kind === "jet") { makeUnit("jet", 0, 0); spawned++; return; }
    const p = freeSpot(DEF[kind].r, far);
    if (kind === "infantry") {
      const n = Math.min(3, need - spawned);
      for (let i = 0; i < n; i++) { const q = { x: p.x + (rng() - 0.5) * 60, y: p.y + (rng() - 0.5) * 60 }; if (!blockedAt(q.x, q.y, 10)) { makeUnit("infantry", q.x, q.y); spawned++; } }
      if (spawned < need && n && !units.some(u => u.kind === "infantry" && Math.hypot(u.x - p.x, u.y - p.y) < 80)) { makeUnit("infantry", p.x, p.y); spawned++; }
      return;
    }
    makeUnit(kind, p.x, p.y); spawned++;
  }
  for (let i = 0; i < Math.min(maxAlive, need); i++) spawnOne(true);

  // ---------- effects
  function addFx(o) { if (fx.length < 650) fx.push(o); }
  function explode(x, y, size, dmg, radius, team, onWater) {
    addFx({ k: "flash", x, y, t: 0, life: 0.16, r: 90 * size });
    addFx({ k: "ring", x, y, t: 0, life: 0.5, r: 110 * size });
    for (let i = 0; i < 12 * size; i++) { const a = rng() * TAU, v = (60 + rng() * 220) * size; addFx({ k: "fire", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.45 + rng() * 0.4, r: (12 + rng() * 14) * size }); }
    for (let i = 0; i < 7 * size; i++) addFx({ k: "smoke", x: x + (rng() - 0.5) * 30, y: y + (rng() - 0.5) * 30, vx: (rng() - 0.5) * 30, vy: (rng() - 0.5) * 30, t: 0, life: 1.6 + rng(), r: (16 + rng() * 14) * size });
    if (onWater) for (let i = 0; i < 10 * size; i++) { const a = rng() * TAU, v = (40 + rng() * 140) * size; addFx({ k: "drop", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.6, r: 3 + rng() * 3 }); }
    else if (decals.length < 220) decals.push({ k: "scorch", x, y, r: 26 * size, a: rng() * TAU });
    const dist = Math.hypot(x - P.x, y - P.y);
    if (dist < 900) { noise(0.35 * Math.min(1.5, size), 0.18 * (1 - dist / 900) * Math.min(1.2, size)); tone(70, 0.3, "sine", 0.12 * (1 - dist / 900), -30); shake = Math.max(shake, 8 * size * (1 - dist / 900)); }
    if (dmg) {
      const targets = team === "p" ? units : [P];
      targets.forEach(u => {
        if (u === P ? !P.alive : u.dead) return;
        if (u.air || (u.kind === "sub" && u.dive)) return;
        const dd = Math.hypot(u.x - x, u.y - y);
        if (dd < radius + u.r) damage(u, dmg * (1 - 0.6 * (dd / (radius + u.r))));
      });
    }
  }
  function splash(x, y) {
    addFx({ k: "ring", x, y, t: 0, life: 0.6, r: 30, water: true });
    for (let i = 0; i < 6; i++) { const a = rng() * TAU; addFx({ k: "drop", x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, t: 0, life: 0.5, r: 2.5 }); }
  }
  function sparks(x, y, n) { for (let i = 0; i < n; i++) { const a = rng() * TAU, v = 80 + rng() * 160; addFx({ k: "spark", x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.25 + rng() * 0.2 }); } }

  function damage(u, dmg) {
    if (u === P) {
      if (!P.alive || finished) return;
      P.hp -= dmg; P.hit = 1; dmgFlash = Math.min(1, dmgFlash + dmg / 30); c.buzz(30);
      if (P.hp <= 0) { P.hp = 0; P.alive = false; explode(P.x, P.y, 1.8, 0, 0, "e", ocean); hud(); c.after(1600, () => c.lose(ocean ? "Your warship was sunk." : "Your tank was destroyed.")); }
      hud();
      return;
    }
    if (u.dead) return;
    u.hp -= dmg; u.hit = 1; u.alert = true; u.lx = P.x; u.ly = P.y;
    if (u.hp <= 0) killUnit(u);
  }

  function killUnit(u) {
    u.dead = true; kills++;
    if (u.air) { u.falling = 0.9; }
    else { explode(u.x, u.y, u.kind === "infantry" ? 0.4 : u.kind === "destroyer" ? 1.8 : 1.2, 0, 0, "p", ocean); if (u.kind !== "infantry") wrecks.push({ ...u, t: 0 }); }
    if (rng() < 0.3) pickups.push({ x: u.x, y: u.y, type: rng() < 0.6 ? "repair" : "special", t: 0 });
    hud();
    if (kills >= need && !finished) { finished = true; c.after(1300, () => c.win(c.stars(P.hp / 100, 0.6, 0.3), kills + " destroyed · " + Math.round(P.hp) + "% armor")); }
  }

  // ---------- weapons
  const SHELL_P = 780, SHELL_E = 620;
  function lead(from, to, speed) {
    const dx = to.x - from.x, dy = to.y - from.y, dist = Math.hypot(dx, dy), tt = dist / speed;
    const vx = to.vx || (Math.cos(to.a) * (to.v || 0)), vy = to.vy || (Math.sin(to.a) * (to.v || 0));
    return Math.atan2(dy + vy * tt, dx + vx * tt);
  }
  function addProj(o) { if (proj.length < 400) proj.push(o); }

  function playerCannon() {
    if (!started || !P.alive || finished || P.reload > 0) return;
    P.reload = ocean ? 1.25 : 1.0; P.recoil = 6;
    const bx = P.x + Math.cos(P.ta) * P.r * (ocean ? 1.3 : 1.8), by = P.y + Math.sin(P.ta) * P.r * (ocean ? 1.3 : 1.8);
    addProj({ k: "shell", team: "p", x: bx, y: by, vx: Math.cos(P.ta) * SHELL_P, vy: Math.sin(P.ta) * SHELL_P, dmg: 46, splash: 70, life: (ocean ? 840 : 740) / SHELL_P });
    addFx({ k: "flash", x: bx, y: by, t: 0, life: 0.1, r: 46 });
    for (let i = 0; i < 4; i++) addFx({ k: "smoke", x: bx, y: by, vx: Math.cos(P.ta) * 60 + (rng() - 0.5) * 40, vy: Math.sin(P.ta) * 60 + (rng() - 0.5) * 40, t: 0, life: 0.9, r: 10 });
    noise(0.22, 0.2); tone(95, 0.22, "sine", 0.16, -50);
    shake = Math.max(shake, 5);
  }

  function playerSpecial() {
    if (!started || !P.alive || finished || P.spec <= 0) return;
    if (ocean) {
      P.spec--;
      addProj({ k: "torpedo", team: "p", x: P.x + Math.cos(P.a) * P.r * 1.4, y: P.y + Math.sin(P.a) * P.r * 1.4, vx: Math.cos(P.a) * 300, vy: Math.sin(P.a) * 300, dmg: 95, life: 4.5 });
      tone(200, 0.3, "triangle", 0.06, -80);
      c.banner("Torpedo away!", "good");
    } else {
      let tx, ty;
      if (!input.touch && mouse.x != null) { tx = mouse.x; ty = mouse.y; }
      else {
        const vis = units.filter(u => !u.dead && !u.air && Math.hypot(u.x - P.x, u.y - P.y) < 800).sort((a, b) => Math.hypot(a.x - P.x, a.y - P.y) - Math.hypot(b.x - P.x, b.y - P.y));
        if (vis.length) { tx = vis[0].x; ty = vis[0].y; } else { tx = P.x + Math.cos(P.ta) * 450; ty = P.y + Math.sin(P.ta) * 450; }
      }
      P.spec--;
      const a = rng() * TAU;
      strikes.push({ x: tx, y: ty, a, t: 0, done: 0 });
      c.banner("Airstrike inbound!", "good");
      tone(660, 0.12, "square", 0.05); tone(880, 0.16, "square", 0.05, 0, 0.12);
    }
    hud();
  }

  function enemyFire(u) {
    const df = u.def;
    const tip = u.r * (u.kind === "destroyer" ? 1.3 : 1.6);
    if (df.wpn === "shell") {
      const bx = u.x + Math.cos(u.ta) * tip, by = u.y + Math.sin(u.ta) * tip;
      const a = u.ta + (rng() - 0.5) * 2 * u.spread;
      addProj({ k: "shell", team: "e", x: bx, y: by, vx: Math.cos(a) * SHELL_E, vy: Math.sin(a) * SHELL_E, dmg: u.dmg, splash: 55, life: (df.range * 1.15) / SHELL_E });
      addFx({ k: "flash", x: bx, y: by, t: 0, life: 0.09, r: 34 });
      u.recoil = 5;
      const dist = Math.hypot(u.x - P.x, u.y - P.y);
      if (dist < 900) { noise(0.16, 0.12 * (1 - dist / 900)); }
      u.reload = u.rel * (0.85 + rng() * 0.3);
    } else if (df.wpn === "bullet") {
      if (df.burst) { u.burst = df.burst; u.bcd = 0; u.reload = u.rel + df.burst * 0.09; }
      else { shootBullet(u, u.ta); u.reload = u.rel * (0.8 + rng() * 0.4); if (u.kind === "infantry" && L > 25 && rng() < 0.22) { addProj({ k: "rocket", team: "e", x: u.x, y: u.y, vx: Math.cos(u.ta) * 420, vy: Math.sin(u.ta) * 420, dmg: 10 * (1 + d), splash: 34, life: 1.2 }); } }
    } else if (df.wpn === "arty") {
      const off = (1 - d) * 110 + 30, a = rng() * TAU;
      addProj({ k: "arty", team: "e", tx: P.x + Math.cos(a) * off * rng(), ty: P.y + Math.sin(a) * off * rng(), t: 0, T: 2.1 - d * 0.5, dmg: u.dmg, splash: 85, x: u.x, y: u.y });
      u.reload = u.rel; u.recoil = 6;
      noise(0.2, 0.06);
    } else if (df.wpn === "torpedo") {
      const a = lead(u, P, 240) + (rng() - 0.5) * u.spread;
      addProj({ k: "torpedo", team: "e", x: u.x, y: u.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, dmg: u.dmg, life: 5 });
      u.reload = u.rel;
    } else if (df.wpn === "rocket") { u.salvo = df.salvo; u.bcd = 0; u.reload = u.rel + df.salvo * 0.13; }
  }
  function shootBullet(u, a) {
    const aa = a + (rng() - 0.5) * 2 * u.spread;
    addProj({ k: "bullet", team: u === P ? "p" : "e", x: u.x + Math.cos(a) * u.r, y: u.y + Math.sin(a) * u.r, vx: Math.cos(aa) * 950, vy: Math.sin(aa) * 950, dmg: u === P ? 3.6 : u.dmg, life: 0.55 });
  }

  // ---------- movement helpers
  function moveBody(u, dx, dy) {
    let moved = false;
    if (!blockedAt(u.x + dx, u.y + dy, u.r)) { u.x += dx; u.y += dy; return true; }
    if (!blockedAt(u.x + dx, u.y, u.r)) { u.x += dx; moved = true; }
    else if (!blockedAt(u.x, u.y + dy, u.r)) { u.y += dy; moved = true; }
    return moved;
  }
  function driveToward(u, tx, ty, spd, dt) {
    const df = u.def;
    let want = Math.atan2(ty - u.y, tx - u.x);
    const look = u.r + 46;
    for (const off of [0, 0.5, -0.5, 1, -1, 1.6, -1.6, 2.3, -2.3]) {
      const a = want + off * u.side;
      if (!blockedAt(u.x + Math.cos(a) * look, u.y + Math.sin(a) * look, u.r * 0.9)) { want = a; break; }
    }
    u.a = rotTo(u.a, want, (df.turn || 3) * dt);
    const diff = Math.abs(wrapAng(want - u.a));
    const target = diff < 1.1 ? spd : spd * 0.25;
    u.v = lerp(u.v, target, Math.min(1, dt * (ocean ? 0.8 : 2.5)));
    const moved = moveBody(u, Math.cos(u.a) * u.v * dt, Math.sin(u.a) * u.v * dt);
    if (!moved && u.v > 10) { u.stuck += dt; u.v *= 0.5; } else u.stuck = Math.max(0, u.stuck - dt);
    if (u.stuck > 0.8) { u.stuck = 0; u.side *= -1; u.a += Math.PI * 0.6; u.wx = null; }
    u.tread = (u.tread || 0) + u.v * dt;
    if (!ocean && u.kind !== "infantry" && u.v > 15 && decals.length < 220 && (u.trk = (u.trk || 0) + u.v * dt) > 16) { u.trk = 0; decals.push({ k: "track", x: u.x - Math.cos(u.a) * u.r * 0.8, y: u.y - Math.sin(u.a) * u.r * 0.8, a: u.a, r: u.r, t: 0 }); }
    if (ocean && u.v > 12 && foam.length < 420 && Math.random() < 0.7) foam.push({ x: u.x - Math.cos(u.a) * u.r * 1.2 + (rng() - 0.5) * u.r * 0.5, y: u.y - Math.sin(u.a) * u.r * 1.2 + (rng() - 0.5) * u.r * 0.5, r: u.r * 0.25, t: 0, life: 1.8 });
  }

  function aiUpdate(u, dt) {
    const df = u.def;
    const dx = P.x - u.x, dy = P.y - u.y, dist = Math.hypot(dx, dy);
    u.hit = Math.max(0, u.hit - dt * 5); u.recoil = Math.max(0, u.recoil - dt * 20);
    if (u.kind === "jet") {
      u.x += Math.cos(u.a) * u.v * dt; u.y += Math.sin(u.a) * u.v * dt;
      const out = u.x < -260 || u.y < -260 || u.x > MW + 260 || u.y > MH + 260;
      if (out) { u.a = rotTo(u.a, Math.atan2(P.y - u.y, P.x - u.x) + (rng() - 0.5) * 0.3, dt * 1.6); u.dropped = false; }
      if (P.alive && !u.dropped && dist < 260) { u.dropped = true; u.bombs = 4; u.bcd = 0; tone(300, 0.4, "sawtooth", 0.04, -200); }
      if (u.bombs > 0) { u.bcd -= dt; if (u.bcd <= 0) { u.bcd = 0.09; u.bombs--; addProj({ k: "bomb", team: "e", x: u.x, y: u.y, t: 0, T: 0.75, dmg: u.dmg, splash: 72 }); } }
      return;
    }
    if (u.kind === "heli") {
      u.orb += dt * 0.32 * u.side;
      const R = 300 + (u.side > 0 ? 40 : 0);
      const tx = P.x + Math.cos(u.orb) * R, ty = P.y + Math.sin(u.orb) * R;
      const ma = Math.atan2(ty - u.y, tx - u.x), md = Math.hypot(tx - u.x, ty - u.y);
      const sp = Math.min(df.speed, md * 1.5);
      u.vx = Math.cos(ma) * sp; u.vy = Math.sin(ma) * sp;
      u.x = clamp(u.x + u.vx * dt, 20, MW - 20); u.y = clamp(u.y + u.vy * dt, 20, MH - 20);
      u.a = rotTo(u.a, dist < df.range * 1.2 ? Math.atan2(dy, dx) : ma, dt * 2.5);
      u.ta = u.a;
      if (!P.alive) return;
      u.reload -= dt;
      if (dist < df.range && u.reload <= 0 && Math.abs(wrapAng(Math.atan2(dy, dx) - u.a)) < 0.3) enemyFire(u);
      if (u.salvo > 0) { u.bcd -= dt; if (u.bcd <= 0) { u.bcd = 0.13; u.salvo--; const a = lead(u, P, 520) + (rng() - 0.5) * u.spread * 2; addProj({ k: "rocket", team: "e", x: u.x + Math.cos(u.a) * 20, y: u.y + Math.sin(u.a) * 20, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, dmg: u.dmg, splash: 38, life: 1.3 }); tone(420, 0.1, "sawtooth", 0.03, -200); } }
      return;
    }
    if (u.kind === "sub") { u.subT -= dt; if (u.subT <= 0) { u.dive = !u.dive; u.subT = u.dive ? 4 + rng() * 3 : 3.5 + rng() * 2; } }
    const vis = P.alive && dist < sight && (ocean || losClear(u, P));
    if (vis) { u.alert = true; u.lx = P.x; u.ly = P.y; }
    if (df.speed > 0) {
      let tx, ty, spd = df.speed;
      if (vis) {
        u.sideT -= dt; if (u.sideT <= 0) { u.sideT = 2 + rng() * 3; u.side *= -1; }
        if (dist > df.range * 0.85) { tx = P.x; ty = P.y; }
        else if (dist < df.range * 0.4) { tx = u.x - dx; ty = u.y - dy; }
        else { const pa = Math.atan2(dy, dx) + (Math.PI / 2) * u.side; tx = u.x + Math.cos(pa) * 200; ty = u.y + Math.sin(pa) * 200; spd *= 0.65; }
      } else if (u.alert && u.lx != null) { tx = u.lx; ty = u.ly; if (Math.hypot(tx - u.x, ty - u.y) < 60) u.alert = false; }
      else { if (u.wx == null || Math.hypot(u.wx - u.x, u.wy - u.y) < 60) { const p = freeSpot(u.r); u.wx = p.x; u.wy = p.y; } tx = u.wx; ty = u.wy; spd *= 0.5; }
      driveToward(u, tx, ty, spd, dt);
    }
    if (vis && dist < df.range * 1.05 && !(u.kind === "sub" && u.dive && rng() < 0.5)) {
      const want = df.wpn === "shell" ? lead(u, P, SHELL_E) : Math.atan2(dy, dx);
      u.ta = df.tturn ? rotTo(u.ta, want, df.tturn * dt) : want;
      u.reload -= dt;
      if (u.reload <= 0 && u.burst <= 0 && Math.abs(wrapAng(want - u.ta)) < 0.14) enemyFire(u);
    } else {
      if (!df.tturn) u.ta = u.a; else u.ta = rotTo(u.ta, u.a, dt);
      u.reload = Math.max(u.reload - dt, 0.6);
    }
    if (u.burst > 0) { u.bcd -= dt; if (u.bcd <= 0) { u.bcd = 0.09; u.burst--; shootBullet(u, u.ta); if (dist < 700) noise(0.03, 0.025 * (1 - dist / 700)); } }
  }

  // ---------- input
  const toWorld = (sx, sy) => ({ x: (sx - cv.W / 2) / view.scale + cam.x, y: (sy - cv.H / 2) / view.scale + cam.y });
  const view = { scale: 1 };
  const cam = { x: P.x, y: P.y };
  c.on(cv.cv, "pointermove", e => { if (e.pointerType === "mouse") { const p = cv.pos(e), w = toWorld(p.x, p.y); mouse.x = w.x; mouse.y = w.y; input.touch = false; } });
  c.on(cv.cv, "pointerdown", e => { if (e.pointerType === "mouse") { if (e.button === 2) playerSpecial(); else mouse.down = true; input.touch = false; } });
  c.on(cv.cv, "contextmenu", e => e.preventDefault());
  c.on(window, "pointerup", e => { if (e.pointerType === "mouse") mouse.down = false; });

  const pad = el("div", "touchpad");
  pad.innerHTML = '<div class="stick-base"><div class="stick-knob"></div></div><div class="abtn fire">FIRE</div><div class="abtn heal">' + (ocean ? "🚀" : "✈️") + '<span>0</span></div>';
  c.board.style.position = "relative";
  c.board.appendChild(pad);
  const base = pad.querySelector(".stick-base"), knob = pad.querySelector(".stick-knob"), fireB = pad.querySelector(".fire"), specB = pad.querySelector(".heal"), specN = specB.querySelector("span");
  let sid = null;
  const setStick = e => {
    const r = base.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.hypot(dx, dy), max = r.width / 2;
    if (m > max) { dx = (dx / m) * max; dy = (dy / m) * max; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    input.jx = dx / max; input.jy = dy / max;
  };

    const rl = clamp(1 - P.reload / (ocean ? 1.25 : 1), 0, 1);
    g.fillStyle = "rgba(255,255,255,.1)"; g.fillRect(hx + 10, hy + 34, 120, 5);
    g.fillStyle = rl >= 1 ? "#2ee6ff" : "#ffb347"; g.fillRect(hx + 10, hy + 34, 120 * rl, 5);
    g.fillStyle = "#e9ecff"; g.font = "700 12px Rajdhani, sans-serif";
    g.fillText((rl >= 1 ? "CANNON READY" : "RELOADING") + "   " + (ocean ? "🚀×" : "✈️×") + P.spec, hx + 10, hy + 52);
    const mm = Math.min(140, Math.min(W, H) * 0.26), mx0 = W - mm - 12, my0 = 12, ms = mm / MW;
    g.fillStyle = "rgba(6,8,20,.78)"; g.fillRect(mx0 - 4, my0 - 4, mm + 8, mm + 8);
    g.save(); g.beginPath(); g.rect(mx0, my0, mm, mm); g.clip();
    g.fillStyle = ocean ? "#0b3d6b" : BIOMES[biome].base; g.globalAlpha = 0.8; g.fillRect(mx0, my0, mm, mm); g.globalAlpha = 1;
    if (ocean) { g.fillStyle = "#c9b27a"; islands.forEach(o => { g.beginPath(); g.arc(mx0 + o.x * ms, my0 + o.y * ms, o.r * ms, 0, TAU); g.fill(); }); }
    else { g.fillStyle = "rgba(20,24,40,.8)"; rects.forEach(q => g.fillRect(mx0 + q.x * ms, my0 + q.y * ms, Math.max(1, q.w * ms), Math.max(1, q.h * ms))); }
    pickups.forEach(p => { g.fillStyle = "#34f5a5"; g.fillRect(mx0 + p.x * ms - 1.5, my0 + p.y * ms - 1.5, 3, 3); });
    units.forEach(u => { if (u.dead || (u.kind === "sub" && u.dive)) return; g.fillStyle = u.air ? "#ffb347" : "#ff4d5e"; g.beginPath(); g.arc(mx0 + u.x * ms, my0 + u.y * ms, u.air ? 2.5 : 3, 0, TAU); g.fill(); });
    g.save(); g.translate(mx0 + P.x * ms, my0 + P.y * ms); g.rotate(P.a); g.fillStyle = "#2ee6ff"; g.beginPath(); g.moveTo(6, 0); g.lineTo(-4, -4); g.lineTo(-4, 4); g.closePath(); g.fill(); g.restore();
    g.strokeStyle = "rgba(255,255,255,.4)"; g.strokeRect(mx0 + (cam.x - hw) * ms, my0 + (cam.y - hh) * ms, hw * 2 * ms, hh * 2 * ms);
    g.restore();
  }

  // ---------- loop
  c.every(dt => {
    t += dt;
    if (started) {
      updatePlayer(dt);
      units.forEach(u => { if (!u.dead) aiUpdate(u, dt); });
      updateProj(dt);
      spawnT -= dt;
      if (spawnT <= 0 && !finished) { spawnT = 3 + rng() * 3; if (units.filter(u => !u.dead).length < maxAlive) spawnOne(false); }
    }
    units.forEach(u => {
      if (!u.dead || u.falling == null) return;
      u.falling -= dt;
      if (u.kind === "jet") { u.x += Math.cos(u.a) * u.v * 0.5 * dt; u.y += Math.sin(u.a) * u.v * 0.5 * dt; }
      if (u.falling <= 0) { u.falling = null; explode(u.x, u.y, 1.1, 0, 0, "p", ocean && !circles.some(o => Math.hypot(o.x - u.x, o.y - u.y) < o.r)); }
    });
    for (let i = units.length - 1; i >= 0; i--) if (units[i].dead && units[i].falling == null) units.splice(i, 1);
    render(dt);
  });

  const intro = ocean
    ? "Command your destroyer and sink <b>" + need + "</b> enemy targets — gunboats, destroyers, submarines, shore guns, helicopters and jets. Your anti-air gun fires automatically."
    : "Lead your tank into battle and destroy <b>" + need + "</b> enemies — infantry, tanks, armored cars, artillery, helicopters and jets. Your machine gun fires automatically.";
  await c.ready(intro + (c.touch ? "<br>Joystick drives · FIRE = main cannon (auto-aims) · " + (ocean ? "🚀 torpedo" : "✈️ airstrike") + "." : "<br><b>WASD</b> drive · <b>mouse</b> aims turret · <b>click</b> fire · <b>right-click</b> or <b>E</b> " + (ocean ? "torpedo" : "airstrike") + "."));
  started = true;
  c.banner(ocean ? "All hands to battle stations!" : "Tanks, roll out!", "good");
  c.countdown(timeLimit, () => { if (!finished) { finished = true; c.lose("Mission time expired — " + kills + " of " + need + " destroyed."); } });
}
